    <h1>${t('q1')}</h1><p class="sub">${t('q1sub')}</p>
    <label class="lbl" for="i_company">${t('company')}</label>
    <input class="txt" id="i_company" placeholder="${esc(t('companyPh'))}" value="${esc(S.company)}" autocomplete="organization">
    <label class="lbl">${t('branche')}</label>
    <div id="o1">${opts(BRANCHES[LANG], S.branche, false, 'two')}</div>
    <div class="nav"><span></span><button class="btn btn-primary" id="n1" ${S.branche && S.company.trim() ? '' : 'disabled'}>${t('next')}</button></div>
  </div>`;
  const check = () => { $('n1').disabled = !(S.branche && S.company.trim()); };
  const pick = v => { S.branche = v; $('o1').innerHTML = opts(BRANCHES[LANG], S.branche, false, 'two'); bindOpts($('o1'), pick); check(); persist(); };
  $('i_company').oninput = e => { S.company = e.target.value; check(); persist(); };
  bindOpts($('o1'), pick);
  $('n1').onclick = () => go(step2);
}

// ── Stap 2: omvang + rol ───────────────────────────────────
function step2(){
  S.step = 2; prog(2); intro(false);
  const render = () => {
    $('screen').innerHTML = `<div class="card">
      <div class="eyebrow">${t('step',{n:2})}</div>
      <h1>${t('q2')}</h1><p class="sub">${t('q2sub')}</p>
      <label class="lbl">${t('omzet')}</label><div id="oO">${opts(OMZET, S.omzet, false, 'two')}</div>
      <label class="lbl">${t('rol')}</label><div id="oR">${opts(ROL[LANG], S.rol, false, 'two')}</div>
      <div class="nav"><button class="btn btn-ghost" id="b2">${t('back')}</button><button class="btn btn-primary" id="n2" ${S.omzet && S.rol ? '' : 'disabled'}>${t('next')}</button></div>
    </div>`;
    $('screen').firstElementChild.style.animation = 'none';
    bindOpts($('oO'), v => { S.omzet = v; persist(); render(); });
    bindOpts($('oR'), v => { S.rol = v; persist(); render(); });
    $('b2').onclick = () => go(step1);
    $('n2').onclick = () => go(step3);
  };
  render();
  $('screen').firstElementChild.style.animation = '';
}

// ── Stap 3: knelpunten ─────────────────────────────────────
function step3(){
  S.step = 3; prog(3); intro(false);
  const render = () => {
    $('screen').innerHTML = `<div class="card">
      <div class="eyebrow">${t('step',{n:3})}</div>
      <h1>${t('q3')}</h1><p class="sub">${t('q3sub')}</p>
      <div id="oP" style="margin-top:18px">${opts(PIJN[LANG].map(p => [p[0], p[1]]), S.pijn, true)}</div>
      <label class="lbl" for="i_notes">${t('notes')}</label>
      <textarea class="txt" id="i_notes" rows="3" placeholder="${esc(t('notesPh'))}">${esc(S.notes)}</textarea>
      <div class="nav"><button class="btn btn-ghost" id="b3">${t('back')}</button><button class="btn btn-primary" id="n3" ${S.pijn.length ? '' : 'disabled'}>${t('next')}</button></div>
    </div>`;
    $('screen').firstElementChild.style.animation = 'none';
    bindOpts($('oP'), v => {
      if (v === 'ONBEKEND') S.pijn = S.pijn.includes(v) ? [] : ['ONBEKEND'];
      else { S.pijn = S.pijn.filter(x => x !== 'ONBEKEND'); S.pijn = S.pijn.includes(v) ? S.pijn.filter(x => x !== v) : S.pijn.concat(v); }
      persist(); render();
    });
    $('i_notes').oninput = e => { S.notes = e.target.value; persist(); };
    $('b3').onclick = () => go(step2);
    $('n3').onclick = () => go(stepCine);
  };
  render();
  $('screen').firstElementChild.style.animation = '';
}

// ── Samenvatting: wat we in de scan uitzoeken ──────────────
function stepCine(){
  S.step = 4; prog(0); intro(false);
  const rows = PIJN[LANG].filter(p => S.pijn.includes(p[0]));
  $('screen').innerHTML = `<div class="card cine">
    <div class="eyebrow bw">${t('cEyebrow')}${S.company ? ' · ' + esc(S.company) : ''}</div>
    <h1 class="bw">${t('cH')}</h1>
    <p class="sub bw">${t('cSub')}</p>
    <div class="scanlist">${rows.map((r, i) => `<div class="scanrow bw"><i>${i+1}</i><span>${esc(r[1])}<small>${esc(r[2])}</small></span></div>`).join('')}</div>
    <div class="checks bw">${t('cChecks').map(c => `<span>${c}</span>`).join('')}</div>
    <p class="honest bw">${t('cHonest')}</p>
    <div class="nav" style="justify-content:center;flex-wrap:wrap"><button class="btn btn-ghost" id="b4">${t('back')}</button><button class="btn btn-primary" id="n4">${t('cBtn')}</button></div>
  </div>`;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.bw').forEach((el, i) => setTimeout(() => el.classList.add('in'), reduce ? 0 : 120 + i * 160));
  $('b4').onclick = () => go(step3);
  $('n4').onclick = () => go(stepCal);
}

// ── Agenda (zelfde API als de oude boekingsmodule) ─────────
let booked = {}, avail = null, calY, calM, loaded = null;
const DEFAULT_AVAIL = {1:{enabled:true,start:'09:00',end:'17:00'},2:{enabled:true,start:'09:00',end:'17:00'},3:{enabled:true,start:'09:00',end:'17:00'},4:{enabled:true,start:'09:00',end:'17:00'},5:{enabled:true,start:'09:00',end:'17:00'},6:{enabled:false},0:{enabled:false}};
function loadCal(){
  if (loaded) return loaded;
  fetch('/api/ping').catch(() => {});
  loaded = Promise.all([fetch('/api/booked-slots').then(r => r.json()), fetch('/api/availability').then(r => r.json())])
    .then(([b, a]) => { booked = b || {}; const x = {}; Object.keys(a || {}).forEach(k => x[+k] = a[k]); avail = Object.keys(x).length ? x : DEFAULT_AVAIL; })
    .catch(() => { avail = DEFAULT_AVAIL; loaded = null; });
  return loaded;
}
loadCal(); // alvast ophalen (Render kan koud staan)
const pad = n => String(n).padStart(2, '0');
const dstr = (y, m, d) => `${y}-${pad(m+1)}-${pad(d)}`;
function slotsFor(ds){
  const a = (avail || DEFAULT_AVAIL)[new Date(ds + 'T00:00:00').getDay()];
  if (!a || !a.enabled || !a.start || !a.end) return [];
  const [sh, sm] = a.start.split(':').map(Number), [eh, em] = a.end.split(':').map(Number);
  const out = [], earliest = Date.now() + 2 * 3600e3; let h = sh, m = sm;
  while (h * 60 + m < eh * 60 + em) {
    const tm = `${pad(h)}:${pad(m)}`;
    if (new Date(`${ds}T${tm}:00`).getTime() > earliest && !(booked[ds] || []).includes(tm)) out.push(tm);
    m += 30; if (m >= 60) { h++; m -= 60; }
  }
  return out;
}
const fmtDay = ds => new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'nl-NL', { weekday:'long', day:'numeric', month:'long' }).format(new Date(ds + 'T00:00:00'));
function stepCal(){
  S.step = 5; prog(0); intro(false);
  const now = new Date(); if (calY === undefined) { calY = now.getFullYear(); calM = now.getMonth(); }
  const limit = new Date(); limit.setDate(limit.getDate() + 45);
  let first = true;
  const draw = () => {
    const lead = (new Date(calY, calM, 1).getDay() + 6) % 7, days = new Date(calY, calM + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span class="cal-cell empty"></span>';
    for (let d = 1; d <= days; d++) {
      const ds = dstr(calY, calM, d), ok = new Date(calY, calM, d) <= limit && slotsFor(ds).length > 0;
      cells += ok ? `<button type="button" class="cal-cell on${S.date === ds ? ' sel' : ''}" data-d="${ds}" aria-label="${esc(fmtDay(ds))}">${d}</button>` : `<span class="cal-cell off">${d}</span>`;
    }
    const month = new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'nl-NL', { month:'long', year:'numeric' }).format(new Date(calY, calM, 1));
    const slots = S.date ? slotsFor(S.date) : [];
    $('screen').innerHTML = `<div class="card">
      <h1>${t('q4')}</h1><p class="sub">${t('q4sub')}</p>
      <p class="cal-note">${avail ? t('calNote') : '<span class="spin"></span> ' + t('loading')}</p>
      <div class="cal-head"><button class="cal-nav" id="cp" ${calY === now.getFullYear() && calM === now.getMonth() ? 'disabled' : ''} aria-label="Vorige maand">‹</button><b>${month}</b><button class="cal-nav" id="cn" ${new Date(calY, calM + 1, 1) > limit ? 'disabled' : ''} aria-label="Volgende maand">›</button></div>
      <div class="cal-dow">${t('dow').map(d => `<span>${d}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      ${S.date ? `<label class="lbl">${esc(fmtDay(S.date))}</label>${slots.length ? `<div class="slots">${slots.map(s => `<button type="button" class="slot${S.time === s ? ' sel' : ''}" data-t="${s}">${s}</button>`).join('')}</div>` : `<p class="hint">${t('noSlots')}</p>`}` : ''}
      <div class="nav"><button class="btn btn-ghost" id="b5">${t('back')}</button><button class="btn btn-primary" id="n5" ${S.date && S.time ? '' : 'disabled'}>${t('next')}</button></div>
    </div>`;
    if (!first) $('screen').firstElementChild.style.animation = 'none';
    first = false;
    $('cp').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } draw(); };
    $('cn').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } draw(); };
    document.querySelectorAll('.cal-cell.on').forEach(b => b.onclick = () => { S.date = b.dataset.d; S.time = null; persist(); draw(); });
    document.querySelectorAll('.slot').forEach(b => b.onclick = () => { S.time = b.dataset.t; persist(); draw(); });
    $('b5').onclick = () => go(stepCine);
    $('n5').onclick = () => go(stepContact);
  };
  draw();
  loadCal().then(() => { if (S.step === 5) draw(); });
}

// ── Contactgegevens + boeken ───────────────────────────────
function stepContact(){
  S.step = 6; prog(0); intro(false);
  $('screen').innerHTML = `<div class="card">
    <h1>${t('q5')}</h1>
    <p class="summary">📅 ${esc(fmtDay(S.date))} ${t('at')} ${S.time}</p>
    <label class="lbl" for="i_name">${t('name')}</label><input class="txt" id="i_name" autocomplete="name" value="${esc(S.name)}"><p class="err" id="e_name"></p>
    <label class="lbl" for="i_email">${t('email')}</label><input class="txt" id="i_email" type="email" autocomplete="email" value="${esc(S.email)}"><p class="err" id="e_email"></p>
    <label class="lbl" for="i_phone">${t('phone')}</label><input class="txt" id="i_phone" type="tel" autocomplete="tel" value="${esc(S.phone)}">
    <label class="lbl" for="i_source">${t('source')}</label>
    <select class="txt" id="i_source"><option value="">${t('sourcePick')}</option>${t('sources').map(o => `<option${S.source === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>
    <p class="err" id="e_submit" role="alert"></p>
    <div class="nav"><button class="btn btn-ghost" id="b6">${t('back')}</button><button class="btn btn-primary" id="n6">${t('confirm')}</button></div>
  </div>`;
  ['name','email','phone','source'].forEach(k => { $('i_' + k).oninput = $('i_' + k).onchange = e => { S[k] = e.target.value; persist(); }; });
  $('b6').onclick = () => go(stepCal);
  $('n6').onclick = submit;
}
function submit(){
  const okName = S.name.trim().length > 1, okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim());
  $('e_name').textContent = okName ? '' : t('errName'); $('i_name').classList.toggle('bad', !okName);
  $('e_email').textContent = okEmail ? '' : t('errEmail'); $('i_email').classList.toggle('bad', !okEmail);
  if (!okName || !okEmail) { (okName ? $('i_email') : $('i_name')).focus(); return; }
  const label = (list, k) => (list.find(x => x[0] === k) || [])[list[0].length - 1] || k;
  const utm = ['utm_source','utm_medium','utm_campaign'].map(k => params.get(k) ? k.replace('utm_','') + '=' + params.get(k) : '').filter(Boolean).join(', ');
  const notes = ['WINSTSCAN' + (LANG === 'en' ? ' (EN)' : ''),
    'Bedrijf: ' + S.company.trim(),
    'Branche: ' + label(BRANCHES.nl, S.branche),
    'Omzet: ' + label(OMZET, S.omzet),
    'Rol: ' + label(ROL.nl, S.rol),
    'Knelpunten: ' + PIJN.nl.filter(p => S.pijn.includes(p[0])).map(p => p[1]).join(', '),
    S.notes.trim() ? 'Toelichting: ' + S.notes.trim() : '',
    'Gevonden via: ' + (S.source || 'niet ingevuld'),
    utm ? 'Campagne: ' + utm : ''].filter(Boolean).join('\n');
  const body = { id:String(Date.now()), date:S.date, time:S.time, name:S.name.trim(), email:S.email.trim(), phone:S.phone.trim(), notes };
  const btn = $('n6'); btn.disabled = true; btn.textContent = t('saving'); $('e_submit').textContent = '';
  const attempt = n => fetch('/api/booking', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) })
    .then(r => r.json())
    .then(d => {
      btn.disabled = false; btn.textContent = t('confirm');
      if (d.success) { notifyParent('booked'); if (window.vcTrackBooked) window.vcTrackBooked(); go(stepDone); }
      else {
        $('e_submit').textContent = d.error || t('errConn');
        if (/geboekt|booked/i.test(d.error || '')) { (booked[S.date] = booked[S.date] || []).push(S.time); S.time = null; setTimeout(() => go(stepCal), 1500); }
      }
    })
    .catch(() => {
      // Render kan koud staan: twee keer opnieuw proberen
      if (n < 3) return setTimeout(() => attempt(n + 1), 3000);
      btn.disabled = false; btn.textContent = t('confirm'); $('e_submit').textContent = t('errConn');
    });
  attempt(1);
}
function stepDone(){
  S.step = 7; prog(0); intro(false);
  const when = fmtDay(S.date) + ' ' + t('at') + ' ' + S.time;
  $('screen').innerHTML = `<div class="card center">
    <div style="font-size:40px">🎉</div>
    <h1 style="margin-top:8px">${t('doneH')}</h1>
    <p class="booked-ok">${esc(t('doneMsg', { when, email:S.email.trim() }))}</p>
    <p class="sub" style="margin-top:14px">${t('doneSub')}</p>
    <div class="nav" style="justify-content:center">${EMBED ? `<button class="btn btn-primary" id="dn">${t('close')}</button>` : `<a class="btn btn-primary" href="/">${t('home')}</a>`}</div>
  </div>`;
  try { sessionStorage.removeItem(KEY); } catch (e) {}
  if (EMBED) $('dn').onclick = () => notifyParent('done');
}

// Start (of herstel na een refresh)
({1:step1, 2:step2, 3:step3, 4:stepCine, 5:stepCal, 6:stepContact}[S.step] || step1)();

// Bezoekersmeting op de losse pagina (in de popup meet de homepage zelf)
if (!EMBED) {
  try {
    let sid = sessionStorage.getItem('vc_sid'); if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('vc_sid', sid); }
    let vid = null;
    fetch('/api/track', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ session_id:sid, page:location.pathname, referrer:document.referrer }) })
      .then(r => r.json()).then(d => { vid = d.id; }).catch(() => {});
    window.vcTrackBooked = () => { if (vid) fetch('/api/track/' + vid, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ booked:true }) }).catch(() => {}); };
  } catch (e) {}
}
</script>
</body>
