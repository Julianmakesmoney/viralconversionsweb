<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gratis demo aanvragen, Viral Conversions</title>
<style>
  :root{
    --bg:#EEF0F8; --surface:#ffffff; --surface2:#f6f7fc; --line:rgba(10,6,24,.08);
    --line2:rgba(10,6,24,.14); --text:#0A0618; --t2:rgba(10,6,24,.62); --t3:rgba(10,6,24,.42);
    --accent:#1D4ED8; --accent2:#3b82f6; --accent-dim:rgba(29,78,216,.07); --accent-line:rgba(29,78,216,.26); --btn3d-sh:#123a8f;
    --ok:#16a34a; --ok-dim:rgba(22,163,74,.09); --warn:#d97706; --red:#dc2626;
    --radius:18px; --shadow:0 18px 44px -22px rgba(10,6,24,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* In de modal (iframe) laten we de achtergrond transparant zodat alleen de kaart telt. */
  body.embed{background:transparent}
  .wrap{max-width:620px;margin:0 auto;padding:24px 18px 40px}
  body.embed .wrap{padding:0}
  /* Standalone /demo = full-screen app (geen popup-gevoel): vul de viewport, centreer de content */
  body:not(.embed){min-height:100dvh;display:flex;flex-direction:column}
  body:not(.embed) .wrap{flex:1;display:flex;flex-direction:column;width:100%}
  body:not(.embed) #screen{flex:1;display:flex;flex-direction:column;justify-content:center}
  body:not(.embed) #screen .cine{min-height:100%}
  body.embed .brand{display:none}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px}
  .brand b{font-weight:800;letter-spacing:-.02em;font-size:15px}
  .brand span{color:var(--t3);font-size:12px}

  .prog{display:flex;gap:6px;margin:0 auto 26px;max-width:520px}
  .prog i{height:5px;flex:1;border-radius:100px;background:var(--surface2);transition:background .35s}
  .prog i.on{background:linear-gradient(90deg,var(--accent),var(--accent2))}

  .card{background:var(--cine-bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  h1{font-size:clamp(22px,4.4vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
  .sub{color:var(--t2);font-size:14.5px;line-height:1.5;margin-top:8px}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:22px}
  .choice-opt{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;background:var(--surface);border:2px solid var(--line2);border-radius:16px;padding:20px 18px;cursor:pointer;font-family:inherit;transition:border-color .15s ease,transform .12s ease,box-shadow .2s ease}
  .choice-opt:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 26px rgba(18,58,143,.12)}
  .choice-opt:active{transform:translateY(0)}
  .choice-ic{font-size:30px;line-height:1}
  .choice-t{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.01em}
  .choice-d{font-size:12.5px;color:var(--t2);line-height:1.5}
  .choice-cta{margin-top:4px;color:var(--accent);font-weight:800;font-size:14px}
.choice-opt-wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px}
.choice-opt-wide .choice-wtxt{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.choice-opt-wide .choice-cta{margin-top:0;white-space:nowrap;flex:none}
@media(max-width:520px){ .choice-opt-wide{flex-direction:column;align-items:flex-start} .choice-opt-wide .choice-cta{margin-top:4px} }
  @media(max-width:560px){.choice-grid{grid-template-columns:1fr}}
  .lbl{font-size:13px;font-weight:700;color:var(--t2);margin:20px 0 9px;display:block}
  .hint{font-size:12px;color:var(--t3);margin-top:7px}

  .txt{width:100%;background:var(--surface);border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none;resize:vertical}
  .txt:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-dim)}
  .row{display:flex;gap:10px}
  .row .txt{flex:1}

  .opts{display:grid;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  @media(max-width:520px){.opts.two,.opts.three{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:11px;text-align:left;background:var(--surface);border:1px solid var(--line2);color:var(--text);border-radius:13px;padding:14px 15px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:border-color .18s,background .18s,transform .06s;line-height:1.35}
  .opt:hover{border-color:var(--accent-line)}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 1px var(--accent) inset}
  .opt .tick{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;color:#fff;font-size:12px}
  .opt.sel .tick{background:var(--accent);border-color:var(--accent)}
  .opt.compact{justify-content:center;text-align:center}

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px}
  .btn{border:none;border-radius:100px;padding:13px 26px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .1s ease,box-shadow .1s ease,filter .2s,opacity .2s}
  .btn:active{transform:scale(.97)}
  /* 3D "pushable"-stijl voor de primaire onboarding-knoppen */
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 5px 0 0 var(--btn3d-sh)}
  .btn-primary:hover{filter:none;transform:translateY(-1px);box-shadow:0 7px 0 0 var(--btn3d-sh)}
  .btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--btn3d-sh)}
  .btn-primary[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 0 var(--btn3d-sh)}
  .btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--t2)}
  .btn-ghost:hover{color:var(--text)}

  .places{margin-top:14px;background:var(--ok-dim);border:1px solid rgba(34,197,94,.3);border-radius:13px;padding:14px 15px;font-size:13.5px;color:var(--t2)}
  .places b{color:var(--text)}
  .places .ph{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
  .places .ph img{height:64px;width:64px;object-fit:cover;border-radius:9px;flex:none;border:1px solid var(--line)}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .diag{background:var(--surface);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;color:var(--t2);font-size:14px;line-height:1.5;margin-top:16px}
  .mod{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .mod:last-child{border-bottom:none}
  .mod .dot{width:22px;height:22px;border-radius:7px;background:var(--accent-dim);border:1px solid var(--accent-line);flex:none;display:grid;place-items:center;color:var(--accent);font-size:12px;margin-top:2px}
  .mod b{font-size:14.5px}
  .mod p{color:var(--t2);font-size:13px;line-height:1.45;margin-top:2px}
  .indic{margin-top:18px;background:linear-gradient(180deg,var(--accent-dim),transparent);border:1px solid var(--accent-line);border-radius:14px;padding:18px}
  .indic .big{font-size:clamp(26px,6vw,38px);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .indic .dis{font-size:11.5px;color:var(--t3);margin-top:8px}
  .price{margin-top:18px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:18px}
  .price .m{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--t2);padding:5px 0}
  .price .m b{color:var(--text)}
  .price .tot{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:16px}
  .price .tot .amt{font-size:24px;font-weight:800;color:var(--text)}
  .free{color:var(--ok);font-weight:800}
  .revshare{margin-top:12px;font-size:13px;color:var(--t2)}
  .revshare.prom{background:var(--accent-dim);border:1px solid var(--accent-line);border-radius:11px;padding:11px 13px;color:var(--text);font-weight:600}

  .center{text-align:center}
  .placeholder{border:1px dashed var(--line2);border-radius:14px;padding:28px;text-align:center;color:var(--t3);margin-top:16px}

  /* ── Advies-scherm (herbouw): gratis-demo hero → cijfer → interactief → vergelijking ── */
  .hero-demo{text-align:center;padding:4px 0 2px}
  .hero-demo .checks{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:13px;font-weight:700;color:var(--ok)}
  .hero-demo .honest{margin-top:16px;font-size:12.5px;color:var(--t2);background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;display:inline-block;line-height:1.5}
  .overgang{text-align:center;color:var(--t2);font-size:15px;margin:26px 0 8px;font-weight:600}
  .cijfer{text-align:center;background:linear-gradient(180deg,var(--accent-dim),transparent);border:1px solid var(--accent-line);border-radius:16px;padding:22px 20px}
  .cijfer-big{font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.05}
  .cijfer-big span{font-size:.4em;font-weight:700;color:var(--t2);-webkit-text-fill-color:var(--t2);display:block;margin-top:6px}
  .cijfer-sub{color:var(--t2);font-size:13.5px;margin-top:8px}
  .ub-list{max-width:230px;margin:16px auto 0;text-align:left}
  .ub-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--t2);border-bottom:1px solid var(--line)}
  .ub-row:last-child{border-bottom:none}.ub-row b{color:var(--text)}
  .ub-omzet{margin-top:18px;font-size:15px;font-weight:800;color:var(--accent)}
  .ub-omzet span{font-weight:600;color:var(--t2);font-size:13px}
  .ub-dis{font-size:11.5px;color:var(--t3);margin-top:8px}
  .live{margin-top:16px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:6px 16px}
  .live-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;font-size:14px;color:var(--t2);border-bottom:1px solid var(--line)}
  .live-row:last-child{border-bottom:none}.live-row b{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
  .live-row.big b{font-size:21px;font-weight:800}
  .vgl-wrap{overflow-x:auto;margin-top:10px}
  .vgl{width:100%;border-collapse:collapse;font-size:13px;min-width:380px}
  .vgl th,.vgl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .vgl th{color:var(--t3);font-weight:700;font-size:12px}
  .vgl tbody td:first-child,.vgl thead th:first-child{color:var(--t2);white-space:normal}
  .vgl .hl{background:var(--accent-dim);color:var(--text);font-weight:800}
  .vgl thead .hl{color:var(--accent)}

  /* ── Maandkalender (funnel) ── */
  .cal-note{font-size:12.5px;color:var(--t2);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:14px;text-align:center;line-height:1.45}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head b{font-size:15px;text-transform:capitalize}
  .cal-nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:18px;cursor:pointer;line-height:1}
  .cal-nav:hover{border-color:var(--accent-line)}
  .cal-nav[disabled]{opacity:.3;cursor:default}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .cal-dow span{text-align:center;font-size:11px;color:var(--t3);font-weight:700}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-cell{min-height:40px;display:grid;place-items:center;border-radius:10px;font-size:14px;font-weight:600}
  .cal-cell.empty{visibility:hidden}
  .cal-cell.off{color:var(--t3);opacity:.4}
  .cal-cell.on{background:var(--surface);border:1px solid var(--accent-line);color:var(--accent);cursor:pointer;font-weight:800}
  .cal-cell.on:hover{background:var(--accent-dim)}
  .cal-cell.today{box-shadow:0 0 0 2px var(--accent-line)}
  .cal-cell.sel{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)}

  /* ── Meeting-teaser + booked-confirmatie ── */
  .teaser{margin-top:14px;background:var(--accent-dim);border:1px solid var(--accent-line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--text);font-weight:600;line-height:1.45}
  .booked-ok{background:var(--ok-dim);border:1px solid rgba(34,197,94,.35);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--text);font-weight:700;margin-bottom:16px}
  .hero-chatbot{margin-top:14px;font-size:13px;color:var(--t2);background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;line-height:1.5;text-align:left}
  /* ── Advies: aanbevolen modules met omschrijving ── */
  .opt.adv-mod{align-items:flex-start;gap:11px}
  .adv-mod .tick{margin-left:0;margin-top:1px;flex:none;order:-1}
  .adv-mod-t{display:flex;flex-direction:column;text-align:left}
  .adv-mod-t b{font-size:14px;font-weight:700}
  .adv-mod-t i{font-style:normal;font-size:12px;color:var(--t2);font-weight:500;margin-top:2px;line-height:1.35}
  /* ── Prijsblok: subnote + boeking-toggle + alle-prijzen ── */
  .live-subnote{font-size:11.5px;color:var(--t3);padding:0 0 9px;margin-top:-3px;line-height:1.45}
  .live-subnote.accent{color:var(--accent);font-weight:600}
  .boeking-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;margin:4px 0 10px}
  .boeking-row.on{border-color:var(--accent);background:var(--accent-dim)}
  .boeking-row .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:12px;flex:none}
  .boeking-row.on .tick{background:var(--accent);border-color:var(--accent)}
  .boeking-row b{margin-left:auto;font-weight:800}
  .alle-prijzen{display:block;margin:14px auto 0;background:none;border:none;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
  .vgl .vgl-strong td{font-weight:800;color:var(--text)}
  .cta-final{text-align:center;margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
  .cta-when{font-size:19px;font-weight:800;color:var(--text)}
  /* ── "Alle prijzen"-modal ── */
  .ap-overlay{position:fixed;inset:0;z-index:50;background:rgba(10,6,24,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
  .ap-card{background:var(--surface);border:1px solid var(--line2);border-radius:18px;width:min(520px,100%);max-height:86vh;overflow:auto;padding:24px;position:relative}
  .ap-card h2{font-size:20px;font-weight:800;margin-bottom:6px}
  .ap-close{position:absolute;top:16px;right:18px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--t2)}
  .ap-sec{border-top:1px solid var(--line);padding:14px 0}
  .ap-h{font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:8px}
  .ap-mod{display:flex;flex-direction:column;padding:6px 0}
  .ap-mod b{font-size:13.5px}.ap-mod span{font-size:12px;color:var(--t2)}
  .ap-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px;color:var(--t2)}
  .ap-row b{color:var(--text);text-align:right}
  .ap-txt{font-size:12.5px;color:var(--t2);line-height:1.5;margin:6px 0}.ap-txt b{color:var(--text)}
  /* ── Alle-prijzen: pricing-page (port van het component) ── */
  :root[data-theme="light"]{ --ap-grad:radial-gradient(125% 125% at 50% 96%, #ffffff 44%, #3b5bfd 112%); }
  :root[data-theme="dark"]{  --ap-grad:radial-gradient(125% 125% at 50% 96%, #16141f 44%, #2b39c9 118%); }
  .ap-card.ap-pricing{ width:min(800px,100%); max-height:92vh; padding:0; overflow:hidden auto; -webkit-overflow-scrolling:touch; background:var(--ap-grad); border-color:var(--line2); }
  .ap-pricing .ap-close{ top:14px; right:16px; z-index:3; }
  .ap-hero{ text-align:center; padding:32px 24px 6px; }
  .ap-eyebrow{ display:inline-flex; align-items:center; gap:7px; color:var(--accent); font-weight:800; font-size:13px; letter-spacing:.01em; }
  .ap-eyebrow svg{ fill:var(--accent); }
  .ap-title{ font-size:clamp(24px,5vw,34px); font-weight:800; letter-spacing:-.02em; margin-top:12px; color:var(--text); }
  .ap-lead{ color:var(--t2); font-size:13.5px; margin:10px auto 0; max-width:460px; line-height:1.5; }
  .ap-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:22px 28px 32px; align-items:start; }
  @media(max-width:640px){ .ap-grid{ grid-template-columns:1fr; gap:16px; } }
  .ap-h3{ font-size:16px; font-weight:800; color:var(--text); margin-bottom:14px; }
  .ap-feats{ list-style:none; display:flex; flex-direction:column; gap:11px; margin:0; padding:0; }
  .apf{ display:flex; align-items:center; gap:11px; font-size:14px; color:var(--text); opacity:0; animation:apfin .5s cubic-bezier(.25,.46,.45,.94) forwards; }
  .apf-c{ width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; flex:none; box-shadow:0 4px 12px -3px var(--accent); }
  @keyframes apfin{ from{opacity:0; transform:translateY(-8px); filter:blur(6px);} to{opacity:1; transform:none; filter:none;} }
  .ap-pcard{ background:var(--surface); border:1px solid var(--line2); border-radius:16px; padding:22px; box-shadow:0 24px 60px -28px rgba(10,6,24,.55); }
  .ap-eenmalig{ font-size:12.5px; font-weight:700; color:var(--t2); margin-bottom:4px; }
  .ap-eenmalig.ok{ color:var(--ok); }
  .ap-big{ font-size:46px; font-weight:800; letter-spacing:-.02em; color:var(--text); line-height:1; }
  .ap-big span{ font-size:18px; font-weight:700; color:var(--t2); }
  .ap-rows{ margin:16px 0 4px; border-top:1px solid var(--line); padding-top:12px; }
  .ap-rev{ font-size:12px; color:var(--t2); margin-top:10px; }
  .ap-purchase{ width:100%; margin-top:18px; color:#fff; font-weight:800; font-size:15px; height:52px; border-radius:100px; border:4px solid var(--accent); background:linear-gradient(to top, var(--accent), var(--accent2)); cursor:pointer; font-family:inherit; box-shadow:0 8px 20px -8px var(--accent); }
  .ap-purchase:hover{ filter:brightness(1.06); }

  /* ── Cinematic reveal (2 losse pages) ── */
  .cine{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#141024 0%,#07060D 60%);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:44px 26px}
  .cine-inner{max-width:460px;width:100%}
  .bw{display:inline-block;opacity:0;filter:blur(12px) brightness(.5);transform:translateY(18px) scale(.96);will-change:filter,transform,opacity;transform-style:preserve-3d;backface-visibility:hidden}
  .bw.in{opacity:1;filter:blur(0) brightness(1);transform:none;text-shadow:0 2px 20px rgba(150,180,255,.15)}
  .cine-eyebrow{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#89a9ff;margin-bottom:20px}
  .cine-h{font-size:clamp(28px,7.5vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .cine-h .bw{margin-right:.22em}

async function saveProgress(extra){
  const body = Object.assign({
    id:S.id, type:S.type, company_name:S.company_name, city:S.city, branche:S.branche,
    website_huidig:S.website_huidig, shop_url:S.answers.shop_url, wat_verkoop:S.answers.wat_verkoop,
    places:S.places, answers:S.answers, last_step:step,
  }, extra||{});
  try{
    const r = await fetch('/api/demo/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    return await r.json();
  }catch(e){ return {success:false}; }
}

function optGrid(items, sel, onPick, cls){
  const wrap = document.createElement('div');
  wrap.className = 'opts ' + (cls||'');
  const multi = Array.isArray(sel);
  items.forEach(it=>{
    const val = it.key || it.code;
    const b = document.createElement('button');
    b.type='button';
    const on = multi ? sel.includes(val) : sel===val;
    b.className = 'opt' + (on?' sel':'') + (cls && cls.indexOf('compact')>=0?' compact':'');
    b.innerHTML = `<span>${esc(it.label)}</span>` + (multi?`<span class="tick">${on?'✓':''}</span>`:'');
    b.onclick = ()=>onPick(val);
    wrap.appendChild(b);
  });
  return wrap;
}

function bwWords(str){ return String(str).split(' ').map(w=>`<span class="bw">${esc(w)}</span>`).join(' '); }
function blurReveal(container, onDone){
  const words=[].slice.call(container.querySelectorAll('.bw'));
  let maxEnd=0;
  words.forEach((w,i)=>{
    const dur=1.8+Math.cos(i*0.3)*0.25;
    const delay=i*0.08+Math.pow(i/Math.max(1,words.length),0.8)*0.35;
    w.style.transitionProperty='filter,transform,opacity';
    w.style.transitionDuration=dur+'s'; w.style.transitionDelay=delay+'s';
    w.style.transitionTimingFunction='cubic-bezier(0.25,0.46,0.45,0.94)';
    maxEnd=Math.max(maxEnd,delay+dur);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>words.forEach(w=>w.classList.add('in'))));
  if(onDone) setTimeout(onDone, Math.min(maxEnd*1000+200, 7000));
}
function scrollReveal(container, onDone){
  if(window._srCleanup) window._srCleanup();
  const words=[].slice.call(container.querySelectorAll('.bw'));
  words.forEach(w=>{
    w.style.transitionProperty='filter,transform,opacity';
    w.style.transitionDuration='1s'; w.style.transitionTimingFunction='cubic-bezier(0.22,1,0.36,1)';
  });
  let ticking=false;
  function check(){
    ticking=false; const vh=window.innerHeight||800;
    for(const w of words){ if(!w.classList.contains('in') && w.getBoundingClientRect().top < vh*0.85) w.classList.add('in'); }
  }
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(check); } }
  requestAnimationFrame(()=>requestAnimationFrame(check));   // header meteen tonen
  window.addEventListener('scroll', onScroll, {passive:true});
  window._srCleanup=()=>{ window.removeEventListener('scroll', onScroll); window._srCleanup=null; };
  if(onDone) onDone();   // Verder-knop meteen klikbaar; staat onderaan de scroll
}
function _cineWrap(inner, onNext, nextLabel, opts){
  opts=opts||{};
  const prog=$('prog'); if(prog) prog.style.display='none';
  const dots = opts.dots?`<div class="cine-dots">${Array.from({length:opts.dots},(_,i)=>`<i class="${i===opts.idx?'on':(i<opts.idx?'done':'')}"></i>`).join('')}</div>`:'';
  const back = opts.back?`<button class="cine-back" id="cineBack" aria-label="Terug">←</button>`:'';
  const almost = opts.first?`<div class="cine-almost bw">Je bent er bijna, nog even dit 👇</div>`:'';
  const foot = onNext?`<div class="cine-foot"><button class="cine-next" id="cineNext" style="opacity:0">${esc(nextLabel||'Verder')} →</button></div>`:'';
  $('screen').innerHTML = `<div class="cine${opts.scroll?' cine-scroll':''}" id="cinePanel">${back}${dots}<div class="cine-inner">${almost}${inner}</div>${foot}</div>`;
  if(opts.back){ const bb=$('cineBack'); if(bb) bb.onclick=(e)=>{e.stopPropagation();opts.back();}; }
  const revealBtn=()=>{ const btn=$('cineNext'); if(btn && onNext){ btn.style.opacity='1'; btn.onclick=(e)=>{ e.stopPropagation(); onNext(); }; } };   // alleen de Verder-knop laat advancen
  const inner$ = $('screen').querySelector('.cine-inner');
  if(window._srCleanup) window._srCleanup();   // scroll-listener van vorige slide opruimen
  if(opts.scroll) scrollReveal(inner$, revealBtn);   // lange slide: info onthult 1-voor-1 op scroll
  else blurReveal(inner$, revealBtn);
  window.scrollTo({top:0});
}

function _todayISO(){ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }

    </div>
    <p class="hint" style="margin-top:12px"><a href="#" onclick="doneScreen();return false" style="color:var(--t3)">Later, ik heb voor nu genoeg gedaan</a></p>
  </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function doneScreen(){
  $('screen').innerHTML=`<div class="card center"><div style="font-size:40px">🎉</div><h1 style="margin-top:8px">Helemaal goed</h1><p class="sub">We zien je in de meeting. Tot dan!</p></div>`;
  notifyParent('done');
}
function notifyParent(type){ try{ if(window.parent!==window) window.parent.postMessage({vcDemo:type},'*'); }catch(e){} }

// ── STAP 6 - Content (ná de boeking, skipbaar) ─────────────────────────────
const FEATURES = [
  {key:'offerte', label:'Offerte aanvragen'}, {key:'afspraak', label:'Online afspraak'},
  {key:'fotos', label:"Foto's van mijn werk"}, {key:'reviews', label:'Reviews'},
  {key:'tarieven', label:'Tarieven'}, {key:'over', label:'Over mij / team'}, {key:'faq', label:'FAQ'},
];
const FEATURE_DEFAULTS = {
  loodgieter:['offerte','fotos'], stukadoor:['offerte','fotos'],
  kapper:['afspraak','reviews'], tandarts:['afspraak','reviews'],
  restaurant:['afspraak','reviews'], b2b:['offerte','over'], anders:[],
};
function fileToDataURL(file){ return new Promise(function(res){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.readAsDataURL(file); }); }

function step4(){
  if(S.type==='webshop') return step4_shop();       // if type: webshop-content
  step=5; renderProg();
  if(!S.content) S.content={diensten:'',anders:'',logo:'',fotos:[],style_ref:'',features:(FEATURE_DEFAULTS[S.branche]||[]).slice(),inspiratie:''};
  const c=S.content;
  $('screen').innerHTML=`<div class="card">
    <div class="booked-ok">✅ Meeting geboekt${S.meetingWhen?`, <b>${esc(S.meetingWhen)}</b>`:''}</div>
    <div class="eyebrow">Stap 4 · content, optioneel</div>
    <h1>Nog 2 minuten voor een betere demo</h1>
    <p class="sub">Hoe beter je input, hoe beter je demo. Alles hier is optioneel, je kunt ook overslaan.</p>

    <label class="lbl">Je diensten + prijzen (kort)</label>
    <textarea class="txt" id="c_diensten" rows="3" placeholder="Bijv. Verstopping €90 · Lekkage €120 · Ketel-onderhoud €75">${esc(c.diensten)}</textarea>

    <label class="lbl">Wat maakt jou anders? (max 200 tekens)</label>
    <textarea class="txt" id="c_anders" rows="2" maxlength="200" placeholder="Bijv. 24/7 bereikbaar · vaste prijzen · 4,9 sterren">${esc(c.anders)}</textarea>

    <label class="lbl">Logo</label>
    <div id="logoBox"></div>
    <input type="file" id="c_logo" accept="image/*" style="display:none">

    <label class="lbl">Foto's van je werk (max 6)</label>
    <div id="fotoBox"></div>
    <input type="file" id="c_fotos" accept="image/*" multiple style="display:none">

    <label class="lbl">Welke stijl spreekt je aan?</label>
    <div id="styleBox"><div class="hint">Voorbeelden laden…</div></div>

    <label class="lbl">Welke onderdelen wil je op je site?</label>
    <div id="featBox"></div>

    <label class="lbl">Een site die je mooi vindt? (optioneel)</label>
    <input class="txt" id="c_insp" placeholder="https://…" value="${esc(c.inspiratie)}">

    <div class="nav">
      <button class="btn btn-ghost" onclick="renderAdvies()">Overslaan</button>
      <button class="btn btn-primary" id="c_save">Klaar →</button>
    </div>
  </div>`;
  renderLogo(); renderFotos(); renderFeatures(); loadStyles();
  $('c_logo').onchange=async e=>{ const f=e.target.files[0]; if(f){ c.logo=await fileToDataURL(f); renderLogo(); } };
  $('c_fotos').onchange=async e=>{ for(const f of e.target.files){ if(c.fotos.length>=6) break; c.fotos.push(await fileToDataURL(f)); } renderFotos(); };
  $('c_save').onclick=async ()=>{
    c.diensten=$('c_diensten').value.trim(); c.anders=$('c_anders').value.trim(); c.inspiratie=$('c_insp').value.trim();
    const btn=$('c_save'); btn.disabled=true; btn.innerHTML='Opslaan… <span class="spin"></span>';
    await saveProgress({content:c, status:'content_compleet'});
    renderAdvies();
  };
}
// ── STAP 4 (webshop) ──
function step4_shop(){
  step=5; renderProg();
  if(!S.content) S.content={producten:'',logo:'',style_ref:'',betaal:['ideal'],verzend:['postnl'],inspiratie:''};
  const c=S.content, hasUrl=!!(S.answers.shop_url);
  $('screen').innerHTML=`<div class="card">
    <div class="booked-ok">✅ Meeting geboekt${S.meetingWhen?`, <b>${esc(S.meetingWhen)}</b>`:''}</div>
    <div class="eyebrow">Stap 4 · content, optioneel</div>
    <h1>Nog 2 minuten voor een betere demo-webshop</h1>
    <p class="sub">Hoe beter je input, hoe beter je demo. Alles hier is optioneel, je kunt ook overslaan.</p>

    <label class="lbl">${hasUrl?'Welke producten wil je in je demo terugzien?':'Je topproducten (naam + prijs)'}</label>
    <textarea class="txt" id="c_prod" rows="3" placeholder="${hasUrl?'Laat leeg = we pakken je bestsellers':'Bijv. Zilveren ring €39 · Ketting €55 · Oorbellen €29'}">${esc(c.producten)}</textarea>

    <label class="lbl">Logo</label>
    <div id="logoBox"></div>
    <input type="file" id="c_logo" accept="image/*" style="display:none">

    <label class="lbl">Welke stijl spreekt je aan?</label>
    <div id="styleBox"><div class="hint">Voorbeelden laden…</div></div>

    <label class="lbl">Betaalmethodes</label>
    <div id="betaalBox"></div>
    <label class="lbl">Verzenden</label>
    <div id="verzendBox"></div>

    <label class="lbl">Een shop die je mooi vindt? (optioneel)</label>
    <input class="txt" id="c_insp" placeholder="https://…" value="${esc(c.inspiratie)}">

    <div class="nav">
      <button class="btn btn-ghost" onclick="renderAdvies()">Overslaan</button>
      <button class="btn btn-primary" id="c_save">Klaar →</button>
    </div>
  </div>`;
  renderLogo(); loadStyles();
  const rb=()=>{
    $('betaalBox').replaceWith(mkId('betaalBox', optGrid(BETAAL_OPTS, c.betaal, k=>{const i=c.betaal.indexOf(k);if(i>=0)c.betaal.splice(i,1);else c.betaal.push(k);rb();}, 'two')));
    $('verzendBox').replaceWith(mkId('verzendBox', optGrid(VERZEND_OPTS, c.verzend, k=>{const i=c.verzend.indexOf(k);if(i>=0)c.verzend.splice(i,1);else c.verzend.push(k);rb();}, 'three')));
  };
  rb();
  $('c_logo').onchange=async e=>{ const f=e.target.files[0]; if(f){ c.logo=await fileToDataURL(f); renderLogo(); } };
  $('c_save').onclick=async ()=>{
    c.producten=$('c_prod').value.trim(); c.inspiratie=$('c_insp').value.trim();
    const btn=$('c_save'); btn.disabled=true; btn.innerHTML='Opslaan… <span class="spin"></span>';
    await saveProgress({content:c, status:'content_compleet'});
    renderAdvies();
  };
}
function renderLogo(){ const b=$('logoBox'); if(!b) return; const c=S.content;
  b.innerHTML = c.logo
    ? `<div style="display:flex;align-items:center;gap:10px"><img src="${c.logo}" style="height:44px;border-radius:8px;border:1px solid var(--line2)"><button class="btn btn-ghost" style="padding:8px 14px;font-size:13px" onclick="S.content.logo='';renderLogo()">Verwijder</button></div>`
    : `<button class="btn btn-ghost" style="padding:11px 16px;font-size:14px" onclick="document.getElementById('c_logo').click()">📁 Logo uploaden</button>`;
}
function renderFotos(){ const b=$('fotoBox'); if(!b) return; const c=S.content;
  const thumbs=c.fotos.map((f,i)=>`<div style="position:relative"><img src="${f}" style="height:60px;width:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)"><button onclick="S.content.fotos.splice(${i},1);renderFotos()" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:11px;cursor:pointer;line-height:1">×</button></div>`).join('');
  b.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${thumbs}${c.fotos.length<6?`<button class="btn btn-ghost" style="padding:11px 16px;font-size:14px" onclick="document.getElementById('c_fotos').click()">＋ Foto's</button>`:''}</div>`;
}
function renderFeatures(){ const b=$('featBox'); if(!b) return; const c=S.content;
  b.replaceWith(mkId('featBox', optGrid(FEATURES, c.features, k=>{ const i=c.features.indexOf(k); if(i>=0)c.features.splice(i,1); else c.features.push(k); renderFeatures(); }, 'two')));
}
async function loadStyles(){ const box=$('styleBox'); if(!box) return;
  try{
    const r=await fetch('/api/demo/style-examples?type='+S.type+'&branche='+encodeURIComponent(S.branche||''));
    const items=await r.json();
    if(!items || !items.length){ box.innerHTML='<div class="hint">Nog geen voorbeelden, dit bespreken we in de meeting.</div>'; return; }
    box.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+items.map(it=>`<button type="button" onclick="S.content.style_ref='${it.id}';loadStyles()" style="border:2px solid ${S.content.style_ref===it.id?'var(--accent)':'var(--line2)'};border-radius:10px;overflow:hidden;padding:0;cursor:pointer;background:none"><img src="${esc(it.image)}" alt="${esc(it.label||'')}" style="width:100%;height:90px;object-fit:cover;display:block"></button>`).join('')+'</div>';
  }catch(e){ box.innerHTML='<div class="hint">Kon voorbeelden niet laden.</div>'; }
}

// ── State-persistence: bewaar waar je in de funnel bent, zodat een refresh je
//    terugbrengt op dezelfde slide met je antwoorden nog ingevuld. ─────────────
function _persist(){
  try {
    if (!_scr) return;
    sessionStorage.setItem('vc-demo-state', JSON.stringify({
      v:1, scr:_scr, step:step, slideIdx:_slideIdx, S:S,
      act:Array.from(_active), rec:Array.from(_recommended),
      boeking:_boeking, ads:_ads, customOn:_customOn
    }));
  } catch(e){}
}
function _restoreDemoState(){
  let d; try { d = JSON.parse(sessionStorage.getItem('vc-demo-state')||'null'); } catch(e){ return false; }
  if (!d || d.v !== 1 || !d.S) return false;
  try {
    Object.assign(S, d.S);
    step = d.step || 1; _slideIdx = d.slideIdx || 0;
    _active = new Set(d.act || []); _recommended = new Set(d.rec || []);
    _boeking = !!d.boeking; _ads = !!d.ads; _customOn = !!d.customOn;
    if (S.advies) _adv = S.advies;
    if (d.scr === 'cine') { if (!S.advies) return false; _adv = S.advies; _cineGo(_slideIdx); return true; }
    const fn = window[d.scr];
    if (typeof fn === 'function') { fn(); return true; }
  } catch(e){}
  return false;
}

(function(){
  const params = new URLSearchParams(location.search);
  if (params.get('embed') === '1') document.body.classList.add('embed');
  const t = params.get('type');
  S.type = t === 'webshop' ? 'webshop' : 'website';
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';   // volgt het site-thema (default light)
  document.documentElement.setAttribute('data-theme', theme);

  // Elk scherm onthoudt zichzelf: wrap de scherm-functies zodat ze bij binnenkomst
  // (en na een cinematic-toggle) de state wegschrijven. Eén hook i.p.v. 11 edits.
  ['stepChoice','step1','step1_shop','step2','step3','step3_shop','step3b','stepMeeting','step4','step4_shop','_cineGo','_updateMed'].forEach(function(name){
    const orig = window[name];
    if (typeof orig !== 'function') return;
    const scrName = (name === '_cineGo') ? 'cine' : name;
    window[name] = function(){
      if (name !== '_updateMed') _scr = scrName;   // _updateMed her-rendert dezelfde cine-slide → scr blijft
      const r = orig.apply(this, arguments);
      _persist();
      return r;
    };
  });

  // Vangnet: sla de exacte state ook op vlak vóór een refresh/verlaten, zodat
  // in-progress typen (bv. de 'op maat'-vragen) niet verloren gaat.
  window.addEventListener('pagehide', _persist);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') _persist(); });

  // Popup werd na een refresh heropend? Herstel de slide. Anders normale start.
  if (_restoreDemoState()) return;
  if (t === 'webshop' || t === 'website') step1();   // expliciete deep-link (site-knop) → direct de funnel
  else stepChoice();                                  // geen type → begin met kiezen: website of webshop
})();
</script>
