  // ── 2. DIAGNOSE ───────────────────────────────────────────────────
  function _renderExtraDiagnose(d) {
    const el = document.getElementById('kpiExtraDiagnose'); if (!el) return;
    const diag = d.diagnose || {};
    // Compute biggest leak from the Volledige funnel data (stored in window._ffStages)
    let leak = null;
    if (window._ffStages && window._ffStages.length >= 2) {
      const stages = window._ffStages;
      let worst = null;
      // Skip i=1 (Benaderd → Warm+callback) — that transition is structural
      // (not every benaderd lead becomes a warm) and would always dominate.
      for (let i = 2; i < stages.length; i++) {
        const prev = stages[i-1].count, curr = stages[i].count;
        if (prev > 0 && curr < prev) {
          const dropPct = (prev - curr) / prev * 100;
          const lost    = prev - curr;
          if (!worst || lost > worst.lost) worst = { from: stages[i-1].label, to: stages[i].label, dropPct, lost };
        }
      }
      leak = worst;
    }
    let leakHtml = leak
      ? `<div class="ke-row"><span class="lbl">Grootste lek</span><span class="val neg">${esc(leak.from)} → ${esc(leak.to)}</span></div>
         <div class="ke-sub">−${leak.dropPct.toFixed(0)}% (${leak.lost} leads verloren)</div>`
      : `<div class="ke-row"><span class="lbl">Grootste lek</span><span class="val">—</span></div>`;
    el.innerHTML = `
      <div class="ke-head"><span class="icon">🩺</span><span>Funnel diagnose</span></div>
      ${leakHtml}
      <div class="ke-row"><span class="lbl">Callback recovery</span><span class="val ${(diag.callback_recovery_pct || 0) > 30 ? 'pos' : 'warn'}">${diag.callback_recovery_pct !== null ? _fmtPct(diag.callback_recovery_pct) : '—'}</span></div>
      <div class="ke-row"><span class="lbl">No-show recovery</span><span class="val ${(diag.no_show_recovery_pct || 0) > 20 ? 'pos' : 'warn'}">${diag.no_show_recovery_pct !== null ? _fmtPct(diag.no_show_recovery_pct) : '—'}</span></div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-top:6px;">
        ${diag.stuck_forum_nog_sturen ? `<div class="ke-action-line amber"><span class="count">${diag.stuck_forum_nog_sturen}</span><span>leads >7d in Forum nog sturen</span></div>` : ''}
        ${diag.stuck_link_pending ? `<div class="ke-action-line amber"><span class="count">${diag.stuck_link_pending}</span><span>forum klaar, link nog niet gestuurd</span></div>` : ''}
        ${diag.stuck_noshow ? `<div class="ke-action-line red"><span class="count">${diag.stuck_noshow}</span><span>no-shows zonder follow-up &gt;14d</span></div>` : ''}
      </div>`;
  }

  // ── Detail modal: build content per stage on click ──────────────────
  async function _openFullFunnelDetail(stageKey) {
    const stages = window._ffStages || [];
    const data   = window._ffData || {};
    const src    = window._ffSrc || 'all';
    const stage  = stages.find(s => s.key === stageKey);
    if (!stage) return;

    const benaderd = stages[0] ? stages[0].count : 0;
    const idx      = stages.indexOf(stage);
    const prevSame = stages.slice(0, idx).reverse().find(s => s.path === 'main' || s.col < stage.col);
    const pctOfStart = benaderd > 0 ? (stage.count / benaderd * 100) : 0;
    const pctOfPrev  = prevSame && prevSame.count > 0 ? (stage.count / prevSame.count * 100) : 0;
    const dropFromPrev = prevSame ? Math.max(0, prevSame.count - stage.count) : 0;

    document.getElementById('ffDetailKicker').textContent = 'Funnel stage';
    document.getElementById('ffDetailTitle').textContent  = stage.label;

    const srcLabel = src === 'phone' ? '📞 Bellen' : src === 'whatsapp' ? '💬 WhatsApp' : '🌐 Alle bronnen';
    document.getElementById('ffDetailHeadline').innerHTML = `
      <span class="ff-headline-pill">${stage.count.toLocaleString('nl-NL')} leads</span>
      <span class="ff-headline-pill green">${pctOfStart.toFixed(1).replace('.', ',')}% van benaderd</span>
      ${prevSame ? `<span class="ff-headline-pill ${pctOfPrev < 50 ? 'red' : 'amber'}">${pctOfPrev.toFixed(1).replace('.', ',')}% door vanaf ${esc(prevSame.label)}</span>` : ''}
      <span style="margin-left:auto;font-size:11px;color:var(--t3);font-weight:700;">${srcLabel}</span>
    `;

    document.getElementById('ffDetailBody').innerHTML = '<div class="empty-state">Laden…</div>';
    document.getElementById('ffDetailModal').classList.remove('hidden');

    // Build the per-stage content (async for stages that fetch sub-funnels)
    try {
      const html = await _ffStageDetailContent(stage, data, src, { idx, prevSame, dropFromPrev });
      document.getElementById('ffDetailBody').innerHTML = html;
    } catch (e) {
      document.getElementById('ffDetailBody').innerHTML = '<div class="empty-state" style="color:var(--red);">Kon details niet laden.</div>';
    }
  }

  function _ffStatCard(lbl, val, sub, cls) {
    return `<div class="ff-stat-card ${cls || ''}"><div class="lbl">${lbl}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  }
  function _ffSection(title, inner) {
    return `<div class="ff-section-title">${title}</div>${inner}`;
  }

  async function _ffStageDetailContent(stage, data, src, ctx) {
    const wf = data.warm_leads_funnel || {};
    const mf = data.meeting_funnel || {};
    const df = data.demo_funnel || {};
    const dp = data.demo_parallel || {};
    const sc = data.source_conversion || {};
    const mfm = data.member_stats || {};
    const dropoff = data.dropoff || {};

    const pick = (fn) => src === 'phone'    ? fn('phone')
                       : src === 'whatsapp' ? fn('whatsapp')
                       : src === 'extern'   ? fn('extern')
                       : fn('phone') + fn('whatsapp') + fn('extern');

    const phoneCount  = (fn) => fn('phone');
    const waCount     = (fn) => fn('whatsapp');

    let html = '';

    switch (stage.key) {
      case 'benaderd': {
        const phoneB = Number((sc.phone||{}).benaderd) || 0;
        const waB    = Number((sc.whatsapp||{}).benaderd) || 0;
        const conv   = stage.count > 0 ? (((Number((sc.phone||{}).warm_leads)||0) + (Number((sc.whatsapp||{}).warm_leads)||0)) / stage.count * 100) : 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Totaal benaderd', stage.count.toLocaleString('nl-NL'), 'prospects gebeld of WhatsApp')}
          ${_ffStatCard('📞 Bellen',  phoneB.toLocaleString('nl-NL'), phoneB && stage.count ? Math.round(phoneB/stage.count*100)+'%' : '')}
          ${_ffStatCard('💬 WhatsApp', waB.toLocaleString('nl-NL'),    waB && stage.count    ? Math.round(waB/stage.count*100)+'%'    : '')}
          ${_ffStatCard('Naar warm', conv.toFixed(1).replace('.', ',') + '%', 'gem. over beide bronnen', conv > 25 ? 'pos' : conv > 10 ? 'warn' : 'neg')}
        </div>`;
        break;
      }
      case 'warm_callback': {
        const ikBel = pick(b => Number((wf[b]||{}).ik_bel_terug) || 0);
        const zijBel = pick(b => Number((wf[b]||{}).zij_bellen_terug) || 0);
        const totalCallback = ikBel + zijBel;
        const realWarm = Math.max(0, stage.count - totalCallback);
        const benaderdC = stages[0] ? stages[0].count : 0;
        const benaderdConv = benaderdC > 0 ? (stage.count / benaderdC * 100) : 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Benaderd → Warm', benaderdConv.toFixed(1).replace('.', ',') + '%', `${stage.count.toLocaleString('nl-NL')} warm van ${benaderdC.toLocaleString('nl-NL')} benaderd`, benaderdConv > 25 ? 'pos' : benaderdConv > 10 ? 'warn' : 'neg')}
          ${_ffStatCard('Warm leads totaal', stage.count.toLocaleString('nl-NL'), 'incl. callback-stages')}
          ${_ffStatCard('Real warm leads', realWarm.toLocaleString('nl-NL'), stage.count ? Math.round(realWarm/stage.count*100)+'% direct verder' : '', 'pos')}
          ${_ffStatCard('In callback', totalCallback.toLocaleString('nl-NL'), stage.count ? Math.round(totalCallback/stage.count*100)+'% nog op te volgen' : '', totalCallback ? 'warn' : '')}
          ${_ffStatCard('📞 Ik bel terug', ikBel.toLocaleString('nl-NL'))}
          ${_ffStatCard('🔄 Zij bellen terug', zijBel.toLocaleString('nl-NL'))}
        </div>`;
        // Pull callback sub-funnel (live fetch) for deep data
        try {
          const q = new URLSearchParams();
          if (data.from) q.set('from', data.from);
          if (data.to)   q.set('to',   data.to);
          if (src && src !== 'all') q.set('source', src);
          if (data.member_id) q.set('member_id', data.member_id);
          const cb = await fetch('/api/sales/kpi-callback-funnel?' + q.toString()).then(r => r.json());
          if (cb && cb.total) {
            const recoveryPct = cb.total ? Math.round(cb.progressed.count / cb.total * 100) : 0;
            html += _ffSection('Callback sub-funnel', `<div class="ff-stat-grid">
              ${_ffStatCard('Cohort', cb.total, 'leads die ooit in callback zaten')}
              ${_ffStatCard('Doorgestroomd', cb.progressed.count || 0, recoveryPct + '%', 'pos')}
              ${_ffStatCard('Nog vast', cb.still_in_callback.count || 0, 'wachten op opvolging', 'warn')}
              ${_ffStatCard('Afgehaakt vanuit callback', cb.afgehaakt || 0, '', 'neg')}
            </div>`);
            html += `<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--t3);font-weight:700;">
              <span>↳ Forum gestuurd: <strong>${cb.progressed.forum_gestuurd || 0}</strong></span>
              <span>↳ Forum gezien: <strong>${cb.progressed.forum_gezien || 0}</strong></span>
              <span>↳ Forum ingevuld: <strong>${cb.progressed.forum_ingevuld || 0}</strong></span>
              <span>↳ Gesloten: <strong>${cb.progressed.gesloten || 0}</strong></span>
            </div>`;
          }
        } catch (e) { /* skip */ }
        break;
      }
      case 'real_warm': {
        const ikBel = pick(b => Number((wf[b]||{}).ik_bel_terug) || 0);
        const zijBel = pick(b => Number((wf[b]||{}).zij_bellen_terug) || 0);
        const phoneRealWarm = Number((sc.phone||{}).warm_leads) || 0;
        const waRealWarm    = Number((sc.whatsapp||{}).warm_leads) || 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Real warm leads', stage.count.toLocaleString('nl-NL'), 'actief warm pipeline')}
          ${_ffStatCard('In callback (vast)', (ikBel + zijBel).toLocaleString('nl-NL'), 'apart bijgehouden', (ikBel+zijBel) ? 'warn' : '')}
          ${_ffStatCard('📞 Phone-leads warm', phoneRealWarm.toLocaleString('nl-NL'), src === 'whatsapp' ? '— filter staat op WA' : '')}
          ${_ffStatCard('💬 WA-leads warm',    waRealWarm.toLocaleString('nl-NL'),    src === 'phone'    ? '— filter staat op bellen' : '')}
        </div>`;
        break;
      }
      case 'forum_nog_sturen': {
        const drops = (dropoff.warm_leads || {});
        const pendingDropped = Number(((drops[src === 'all' ? 'all' : src] || {}).forum_nog_sturen) || 0);
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('In wachtrij', stage.count.toLocaleString('nl-NL'), 'forum nog niet gestuurd', 'warn')}
          ${_ffStatCard('Afgehaakt vanaf hier', pendingDropped.toLocaleString('nl-NL'), 'verdween voor formulier weg', pendingDropped ? 'neg' : '')}
        </div>`;
        html += `<div style="font-size:12px;color:var(--t3);line-height:1.5;margin-top:6px;">↳ Leads in dit blok wachten tot je het forum/calendly-bericht stuurt. Een snelle reactietijd verhoogt de doorstroom naar Forum gestuurd flink.</div>`;
        break;
      }
      case 'form_meeting_sent': {
        const fgSent = pick(b => Number((wf[b]||{}).forum_gestuurd) || 0)
                     + pick(b => Number((wf[b]||{}).forum_gezien)   || 0)
                     + pick(b => Number((wf[b]||{}).forum_ingevuld) || 0);
        const linkSent = pick(b => Number((mf[b]||{}).link_sent) || 0)
                       + pick(b => Number((mf[b]||{}).scheduled) || 0)
                       + pick(b => Number((mf[b]||{}).show)      || 0);
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Totaal (form ∪ link)', stage.count.toLocaleString('nl-NL'), 'union van twee paden')}
          ${_ffStatCard('Forum gestuurd', fgSent.toLocaleString('nl-NL'), 'cumulatief gestuurd+later')}
          ${_ffStatCard('Calendly link gestuurd', linkSent.toLocaleString('nl-NL'), 'cumulatief')}
        </div>`;
        break;
      }
      case 'forum_gezien': {
        const fgVisible = pick(b => Number((wf[b]||{}).forum_gezien) || 0);
        const drops = (dropoff.warm_leads || {});
        const droppedHere = Number(((drops[src === 'all' ? 'all' : src] || {}).forum_gezien) || 0);
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Forum gezien (cumulatief)', stage.count.toLocaleString('nl-NL'), 'incl. ingevuld + later')}
          ${_ffStatCard('Nog te beslissen', fgVisible.toLocaleString('nl-NL'), 'staan momenteel op gezien')}
          ${_ffStatCard('Afgehaakt na gezien', droppedHere.toLocaleString('nl-NL'), 'zagen het, kwamen niet door', droppedHere ? 'neg' : '')}
        </div>`;
        break;
      }
      case 'forum_ingevuld': {
        const drops = (dropoff.warm_leads || {});
        const droppedHere = Number(((drops[src === 'all' ? 'all' : src] || {}).forum_ingevuld) || 0);
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Forum ingevuld (cumulatief)', stage.count.toLocaleString('nl-NL'), 'incl. doorgestroomd')}
          ${_ffStatCard('Afgehaakt vanaf hier', droppedHere.toLocaleString('nl-NL'), 'forum klaar maar dropout', droppedHere ? 'neg' : '')}
        </div>`;
        html += `<div style="font-size:12px;color:var(--t3);line-height:1.5;margin-top:6px;">↳ Forum ingevuld is de poort naar de meeting + close pipeline. Een lead móét hier doorheen voor de stap naar Clients.</div>`;
        break;
      }
      case 'meeting_ingepland': {
        const pending = pick(b => Number((mf[b]||{}).pending_link) || 0);
        const linkSent = pick(b => Number((mf[b]||{}).link_sent) || 0);
        const scheduled = pick(b => Number((mf[b]||{}).scheduled) || 0);
        const showM = pick(b => Number((mf[b]||{}).show) || 0);
        const noShow = pick(b => Number((mf[b]||{}).no_show) || 0);
        const followup = pick(b => Number((mf[b]||{}).no_show_followup) || 0);
        const afgM = pick(b => Number((mf[b]||{}).afgehaakt) || 0);
        const scheduledTotal = scheduled + showM + noShow + followup;
        const showRate = scheduledTotal ? (showM / scheduledTotal * 100) : 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Meetings ingepland (cum.)', stage.count.toLocaleString('nl-NL'), 'incl. show + no-show')}
          ${_ffStatCard('Show-up rate', showRate.toFixed(1).replace('.', ',') + '%', `${showM} show / ${scheduledTotal} ingepland`, showRate > 60 ? 'pos' : showRate > 40 ? 'warn' : 'neg')}
          ${_ffStatCard('Geen link gestuurd', pending.toLocaleString('nl-NL'), 'forum vereist link', pending ? 'warn' : '')}
          ${_ffStatCard('Link gestuurd, niet ingepland', linkSent.toLocaleString('nl-NL'), 'wachten op klant', linkSent ? 'warn' : '')}
          ${_ffStatCard('No-show', noShow.toLocaleString('nl-NL'), 'tegenmaat: opvolging', noShow ? 'neg' : '')}
          ${_ffStatCard('No-show + follow-up', followup.toLocaleString('nl-NL'), 'pogen te recoveren', followup ? 'warn' : '')}
          ${_ffStatCard('Meeting afgehaakt', afgM.toLocaleString('nl-NL'), '', afgM ? 'neg' : '')}
        </div>`;
        // No-show recovery sub-funnel
        try {
          const q = new URLSearchParams();
          if (data.from) q.set('from', data.from);
          if (data.to)   q.set('to',   data.to);
          if (src && src !== 'all') q.set('source', src);
          if (data.member_id) q.set('member_id', data.member_id);
          const ns = await fetch('/api/sales/kpi-no-show-funnel?' + q.toString()).then(r => r.json());
          if (ns && ns.total) {
            html += _ffSection('No-show recovery sub-funnel', `<div class="ff-stat-grid">
              ${_ffStatCard('Cohort', ns.total, 'ooit no-show')}
              ${_ffStatCard('Hersteld', ns.recovered.count || 0, ns.recovery_pct.toFixed(1).replace('.', ',') + '%', 'pos')}
              ${_ffStatCard('Opgevolgd', ns.followup_sent.count || 0, 'recovery loopt nog', 'warn')}
              ${_ffStatCard('Nog niet opgevolgd', ns.still_no_show.count || 0, 'KANS — bel/whatsapp', ns.still_no_show.count ? 'warn' : '')}
              ${_ffStatCard('Afgehaakt na no-show', ns.afgehaakt || 0, '', ns.afgehaakt ? 'neg' : '')}
            </div>`);
          }
        } catch (e) { /* skip */ }
        break;
      }
      case 'show': {
        const noShow = pick(b => Number((mf[b]||{}).no_show) || 0);
        const noShowFu = pick(b => Number((mf[b]||{}).no_show_followup) || 0);
        const showRate = (stage.count + noShow + noShowFu) ? (stage.count / (stage.count + noShow + noShowFu) * 100) : 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Shows totaal', stage.count.toLocaleString('nl-NL'), 'gezien op meeting')}
          ${_ffStatCard('Show-up rate', showRate.toFixed(1).replace('.', ',') + '%', 'show / (show+no_show)', showRate > 60 ? 'pos' : 'warn')}
          ${_ffStatCard('No-show totaal', (noShow + noShowFu).toLocaleString('nl-NL'), 'incl. follow-up cohort', (noShow + noShowFu) ? 'neg' : '')}
        </div>`;
        html += `<div style="font-size:12px;color:var(--t3);line-height:1.5;margin-top:6px;">↳ Show op meeting is waar je commissie écht begint. Een hoge show-rate komt van duidelijke reminders + geverifieerde tel/WA.</div>`;
        break;
      }
      case 'geclosed': {
        const closed = stage.count;
        // "Door naar aanbetaling" = iedereen die geclosed voorbij is (aanbetaling
        // t/m volledig_betaald, incl. de 4 tussenstappen). Raw per-stage buckets
        // cumulatief optellen zodat clients in vragenlijst/contract/getekend/
        // afbouwen niet uit de teller vallen terwijl ze wél in de noemer zitten.
        const _dfGc = data.demo_funnel?.[src === 'all' ? 'all' : src] || {};
        const pastGeclosed = ['aanbetaling','vragenlijst_gestuurd','contract_gestuurd','getekend','afbouwen','volledig_betaald']
          .reduce((s, k) => s + (Number(_dfGc[k]) || 0), 0);
        const closeRate = stage.count > 0 ? (pastGeclosed / stage.count * 100) : 0;
        const memberRev   = (mfm && mfm.revenue) ? mfm.revenue : 0;
        const memberComm  = (mfm && mfm.commission) ? mfm.commission : 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Geclosed (cumulatief)', closed.toLocaleString('nl-NL'), 'incl. aanbet + betaald')}
          ${_ffStatCard('Door naar aanbetaling', closeRate.toFixed(1).replace('.', ',') + '%', '% van geclosed', closeRate > 70 ? 'pos' : 'warn')}
          ${_ffStatCard('Team revenue', '€' + Math.round(memberRev).toLocaleString('nl-NL'), 'over deze periode', 'pos')}
          ${_ffStatCard('Team commissie', '€' + Math.round(memberComm).toLocaleString('nl-NL'), 'uitbetaalbaar')}
        </div>`;
        break;
      }
      case 'aanbetaling': {
        const aanbCount = pick(b => Number((df[b]||{}).aanbetaling) || 0);
        const fullCount = pick(b => Number((df[b]||{}).volledig_betaald) || 0);
        const fullPct = stage.count ? (fullCount / stage.count * 100) : 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Aanbetaling cumulatief', stage.count.toLocaleString('nl-NL'), 'incl. volledig betaald')}
          ${_ffStatCard('Alleen aanbetaling', aanbCount.toLocaleString('nl-NL'), 'wachten op restant', aanbCount ? 'warn' : '')}
          ${_ffStatCard('Naar volledig betaald', fullPct.toFixed(1).replace('.', ',') + '%', 'aanbet → volledig', fullPct > 70 ? 'pos' : 'warn')}
        </div>`;
        break;
      }
      case 'volledig_betaald': {
        const memberRev   = (mfm && mfm.revenue) ? mfm.revenue : 0;
        const memberComm  = (mfm && mfm.commission) ? mfm.commission : 0;
        const benaderdC = stages[0] ? stages[0].count : 0;
        const overall = benaderdC ? (stage.count / benaderdC * 100) : 0;
        html += `<div class="ff-stat-grid">
          ${_ffStatCard('Volledig betaald', stage.count.toLocaleString('nl-NL'), 'eindstation', 'pos')}
          ${_ffStatCard('Eindconversie', overall.toFixed(2).replace('.', ',') + '%', 'van Benaderd → Volledig', 'pos')}
          ${_ffStatCard('Team revenue', '€' + Math.round(memberRev).toLocaleString('nl-NL'), 'over deze periode', 'pos')}
          ${_ffStatCard('Team commissie', '€' + Math.round(memberComm).toLocaleString('nl-NL'), 'uitbetaalbaar', 'pos')}
        </div>`;
        html += `<div style="font-size:12px;color:var(--t3);line-height:1.5;margin-top:6px;">↳ Iedereen hier heeft het hele pad afgelegd. Vergelijk dit aantal met de eindconversie % om je leak op te sporen.</div>`;
        break;
      }
      default: {
        html = `<div class="empty-state">Geen extra details beschikbaar.</div>`;
      }
    }
    return html;
  }

  // ── No-show recovery card loader (mirror of callback card) ──────────────
  async function _loadNoShowRecoveryCard(elId, params) {
    const el = document.getElementById(elId); if (!el) return;
    const q = new URLSearchParams();
    if (params.from) q.set('from', params.from);
    if (params.to)   q.set('to',   params.to);
    if (params.source && params.source !== 'all') q.set('source', params.source);
    if (params.member_id) q.set('member_id', params.member_id);

      const res = await fetch('/api/sales/kpi-no-show-funnel?' + q.toString());
      const d = await res.json();
      if (!d || !d.total) {
        el.innerHTML = `<div class="empty-state">Nog geen no-show cohort in dit tijdvak.</div>`;
        return;
      }
      const stuck = d.still_no_show?.count ?? 0;
      const fu    = d.followup_sent?.count ?? 0;
      const rec   = d.recovered?.count    ?? 0;

      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="font-size:12px;font-weight:800;color:var(--text);letter-spacing:-0.01em;">🔁 No-show recovery</div>
          <span class="cb-tag">📥 Nog op te volgen <strong>${stuck}</strong></span>
          <span class="cb-tag">📞 Opgevolgd <strong>${fu}</strong></span>
          <span class="cb-tag" style="background:rgba(16,185,129,0.10);border-color:rgba(16,185,129,0.32);color:#10b981;">✅ Hersteld <strong>${rec}</strong></span>
          <span class="cb-tag" style="background:var(--red-bg);border-color:var(--red-border);color:var(--red);">❌ Afgehaakt <strong>${afg}</strong></span>
          <span style="margin-left:auto;font-size:11px;color:var(--t3);font-weight:700;">Recovery rate: <strong style="color:#10b981;">${pct}%</strong></span>
        </div>`;
    } catch (e) {
      el.innerHTML = `<div class="empty-state" style="color:var(--red);">Kon no-show data niet laden.</div>`;
    }
  }

  // ── Full-funnel collapse → 11 stages for the conclusion card ────────────
  // Merges the warm-leads funnel and the demo funnel into one cumulative-ish
  // pipeline: Benaderd → ... → Volledig betaald. Demo stages are cumulative
  // (each stage includes every later stage) so the count decreases as the
  // funnel progresses, which is what the leak-detection logic expects.
  function _kpiFullFunnel(data, src) {
    const wf = data.warm_leads_funnel || {};
    const df = data.demo_funnel || {};
    const mf = data.meeting_funnel || {};
    const sc = data.source_conversion || {};
    const pick = (fn) => src === 'phone'    ? fn('phone')
                       : src === 'whatsapp' ? fn('whatsapp')
                       : fn('phone') + fn('whatsapp');
    // Meeting cumulative: link_sent includes everyone past it; scheduled
    // includes show+no_show_followup; show is terminal.
    const cumMeeting = {
      link_sent: ['link_sent','scheduled','show','no_show','no_show_followup'],
      scheduled: ['scheduled','show','no_show','no_show_followup'],
      show:      ['show'],
    };
    const mCum = (key) => pick(b => cumMeeting[key].reduce((s,k) => s + (Number((mf[b] || {})[k]) || 0), 0));
    // De 4 tussenstappen (vragenlijst→afbouwen) zitten tussen aanbetaling en
    // volledig_betaald zodat de cumulatieven kloppen. LET OP: volledig_betaald is
    // nu de laatste index (niet meer 3) — zie cumDemo-aanroepen hieronder.
    const demoOrder = ['show','geclosed','aanbetaling','vragenlijst_gestuurd','contract_gestuurd','getekend','afbouwen','volledig_betaald'];
    const cumDemo  = (idx) => pick(b => demoOrder.slice(idx).reduce((s, k) =>
      s + (Number((df[b] || {})[k]) || 0), 0));
    return [
      { key:'benaderd',         label:'Benaderd',         count: pick(b => Number((sc[b] || {}).benaderd)   || 0) },
      { key:'warm',             label:'Warm lead',        count: pick(b => Number((sc[b] || {}).warm_leads) || 0) },
      { key:'callback',         label:'Bel terug',        count: pick(b => (Number((wf[b] || {}).ik_bel_terug) || 0) + (Number((wf[b] || {}).zij_bellen_terug) || 0)) },
      { key:'forum_nog_sturen', label:'Forum nog sturen', count: pick(b => Number((wf[b] || {}).forum_nog_sturen) || 0) },
      { key:'forum_gestuurd',   label:'Forum gestuurd',   count: pick(b => Number((wf[b] || {}).forum_gestuurd) || 0) },
      { key:'forum_gezien',     label:'Forum gezien',     count: pick(b => Number((wf[b] || {}).forum_gezien)   || 0) },
      { key:'forum_ingevuld',   label:'Forum ingevuld',   count: pick(b => Number((wf[b] || {}).forum_ingevuld) || 0) },
      { key:'link_sent',        label:'Link gestuurd',    count: mCum('link_sent') },
      { key:'scheduled',        label:'Meeting ingepland', count: mCum('scheduled') },
      { key:'show',             label:'Show op meeting',  count: Math.max(mCum('show'), cumDemo(0)) },
      { key:'geclosed',         label:'Geclosed',         count: cumDemo(1) },
      { key:'aanbetaling',      label:'Aanbetaling',      count: cumDemo(2) },
      { key:'volledig_betaald', label:'Volledig betaald', count: cumDemo(demoOrder.length - 1) },
    ];
  }

  function _kpiSourceWinner(data) {
    const sc = data.source_conversion || {};
    const p = sc.phone || {}, w = sc.whatsapp || {};
    const warmP  = Number(p.benaderd_to_warm_pct) || 0;
    const warmW  = Number(w.benaderd_to_warm_pct) || 0;
    const closeP = Number(p.warm_to_close_pct)    || 0;
    const closeW = Number(w.warm_to_close_pct)    || 0;
    return {
      warmPct:  { phone: warmP,  whatsapp: warmW  },
      closePct: { phone: closeP, whatsapp: closeW },
      warmWinner:  warmP  >= warmW  ? 'phone' : 'whatsapp',
      closeWinner: closeP >= closeW ? 'phone' : 'whatsapp',
      hasWarm:  warmP  > 0 || warmW  > 0,
      hasClose: closeP > 0 || closeW > 0,
    };
  }

  function _kpiTotalDropped(data, src) {
    const wf = data.warm_leads_funnel || {};
    const df = data.demo_funnel || {};
    const pickAfg = (fnl) => src === 'phone'    ? Number((fnl.phone    || {}).afgehaakt) || 0
                            : src === 'whatsapp' ? Number((fnl.whatsapp || {}).afgehaakt) || 0
                            : (Number((fnl.phone || {}).afgehaakt) || 0) + (Number((fnl.whatsapp || {}).afgehaakt) || 0);
    return pickAfg(wf) + pickAfg(df);
  }

  // Top-N biggest consecutive-stage drops, sorted by absolute number of
  // leads lost — that's what actually moves the needle. A late-stage
  // -100% on 3 leads matters less than a -88% on 190 leads at the top.
  function _kpiBiggestDrops(funnel, n) {
    const drops = [];
    for (let i = 1; i < funnel.length; i++) {
      const prev = funnel[i - 1].count, curr = funnel[i].count;
      if (prev <= 0 || curr >= prev) continue;
      const pct = Math.round((prev - curr) / prev * 100);
      drops.push({ from: funnel[i - 1].label, to: funnel[i].label, prev, curr, dropPct: pct, lost: prev - curr });
    }
    drops.sort((a, b) => b.lost - a.lost);
    return drops.slice(0, n || 3);
  }

  // ── Conclusion card — single-period and compare variants ───────────────
  function _renderConclusion(elId, dataA, dataB) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (!dataA) { el.style.display = 'none'; return; }
    el.style.display = '';
    const isCompare = !!dataB;
    el.dataset.mode = isCompare ? 'compare' : 'single';
    const modePill = document.getElementById('kpiConclusionMode');
    if (modePill) modePill.textContent = isCompare ? 'Vergelijking B vs A' : 'Single tijdvak';
    const src = (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all') || 'all';
    const sections = isCompare ? _buildCompareConclusion(dataA, dataB, src)
                               : _buildSingleConclusion(dataA, src);
    const sectionsEl = document.getElementById('kpiConclusionSections');
    if (!sectionsEl) return;
    sectionsEl.innerHTML = sections.map(s =>
      `<div class="conclusion-section">
        <div class="conclusion-section-head">${s.icon} ${s.title}</div>
        <div class="conclusion-section-body">${s.body}</div>
      </div>`
    ).join('');
  }

  function _buildSingleConclusion(data, src) {
    const funnel = _kpiFullFunnel(data, src);
    const benaderd = funnel[0].count;
    const final    = funnel[funnel.length - 1].count;
    const totalConv = benaderd > 0 ? (final / benaderd * 100) : 0;
    const totalDropped = _kpiTotalDropped(data, src);
    const drops = _kpiBiggestDrops(funnel, 3);
    const winner = _kpiSourceWinner(data);
    const fmtPct = (v) => (Number(v) || 0).toFixed(1).replace('.', ',') + '%';
    const fmtN   = (v) => (Number(v) || 0).toLocaleString('nl-NL');
    const srcLabel = src === 'phone' ? '📞 Bellen' : src === 'whatsapp' ? '💬 WhatsApp' : 'beide bronnen';

    // 🎯 Eindcijfer
    let eindcijfer;
    if (benaderd === 0) {
      eindcijfer = 'Nog niemand benaderd in dit tijdvak — selecteer een andere periode of voeg leads toe.';
    } else {
      eindcijfer = `Van <strong>${fmtN(benaderd)} benaderd</strong> via ${srcLabel} eindig je op <strong>${fmtN(final)}</strong> volledig betaald — een eindconversie van <strong class="pos">${fmtPct(totalConv)}</strong>. Onderweg <strong class="neg">${fmtN(totalDropped)} afgehaakt</strong>.`;
    }

    // 💧 Grootste lek
    let lekBody;
    if (!drops.length) {
      lekBody = 'Nog geen drop-data — wacht tot leads in latere stages komen.';
    } else {
      lekBody = '<ul>' + drops.map((d, i) =>
        `<li><span class="bullet">${i === 0 ? '🔻' : '·'}</span><span><strong>${esc(d.from)} → ${esc(d.to)}</strong> <strong class="neg">−${d.dropPct}%</strong> (${d.lost} leads weg)</span></li>`
      ).join('') + '</ul>';
    }

    // 🔀 Bron-vergelijking
    let bronBody;
    if (!winner.hasWarm && !winner.hasClose) {
      bronBody = 'Nog geen data om bronnen te vergelijken.';
    } else {
      const warmW  = winner.warmWinner === 'phone' ? '📞 Bellen' : '💬 WhatsApp';
      const closeW = winner.closeWinner === 'phone' ? '📞 Bellen' : '💬 WhatsApp';
      const loseWarmKey  = winner.warmWinner  === 'phone' ? 'whatsapp' : 'phone';
      const loseCloseKey = winner.closeWinner === 'phone' ? 'whatsapp' : 'phone';
      bronBody = `<strong>${warmW}</strong> wint in <strong>Prospect → Warm</strong> (${fmtPct(winner.warmPct[winner.warmWinner])} vs ${fmtPct(winner.warmPct[loseWarmKey])}).<br>
        <strong>${closeW}</strong> wint in <strong>Warm → Close</strong> (${fmtPct(winner.closePct[winner.closeWinner])} vs ${fmtPct(winner.closePct[loseCloseKey])}).`;
    }

    // 💡 Aanbeveling
    let aanbev;
    if (!drops.length) {
      aanbev = 'Nog te weinig data voor een gerichte aanbeveling — laat de funnel een tijdvak draaien.';
    } else {
      const top = drops[0];
      aanbev = `Grootste win zit bij <strong>${esc(top.from)} → ${esc(top.to)}</strong> — daar verlies je <strong class="neg">${top.dropPct}%</strong> van de leads. Maak die stap breder en alles dat erna komt groeit mee.`;
    }

    return [
      { icon: '🎯', title: 'Eindcijfer',         body: eindcijfer },
      { icon: '💧', title: 'Grootste lek',       body: lekBody },
      { icon: '🔀', title: 'Bron-vergelijking',  body: bronBody },
      { icon: '💡', title: 'Aanbeveling',        body: aanbev },
    ];
  }

  function _buildCompareConclusion(dataA, dataB, src) {
    const fA = _kpiFullFunnel(dataA, src);
    const fB = _kpiFullFunnel(dataB, src);
    const benA = fA[0].count, benB = fB[0].count;
    const finalA = fA[fA.length - 1].count, finalB = fB[fB.length - 1].count;
    const convA = benA > 0 ? (finalA / benA * 100) : 0;
    const convB = benB > 0 ? (finalB / benB * 100) : 0;
    const fmtPct = (v) => (Number(v) || 0).toFixed(1).replace('.', ',') + '%';

    // Per-stage % change (B vs A), filtered to stages where A had data
    const stageDeltas = fA.map((sa, i) => {
      const ca = sa.count, cb = fB[i].count;
      const pctChange = ca > 0 ? Math.round((cb - ca) / ca * 100) : null;
      return { label: sa.label, key: sa.key, ca, cb, diff: cb - ca, pctChange };
    });
    const valid = stageDeltas.filter(d => d.pctChange !== null);
    const sortedAbs = valid.slice().sort((a, b) => Math.abs(b.pctChange) - Math.abs(a.pctChange));
    const bestStage  = valid.filter(d => d.pctChange > 0).sort((a, b) => b.pctChange - a.pctChange)[0];
    const worstStage = valid.filter(d => d.pctChange < 0).sort((a, b) => a.pctChange - b.pctChange)[0];

    // 🎯 Verdict B vs A
    const convDiff = convB - convA;
    const verdictCls  = convDiff > 0.05 ? 'pos' : convDiff < -0.05 ? 'neg' : '';
    const verdictWord = convDiff > 0.05 ? 'beter' : convDiff < -0.05 ? 'slechter' : 'vrijwel gelijk';
    let verdict;
    if (benA === 0 || benB === 0) {
      verdict = 'Eén van beide periodes heeft nog geen benaderde prospects — geen vergelijking mogelijk.';
    } else {
      const sign = convDiff > 0 ? '+' : '';
      verdict = `<span class="tf-b">B</span> converteert <strong class="${verdictCls}">${sign}${convDiff.toFixed(1).replace('.', ',')}pp ${verdictWord}</strong> dan <span class="tf-a">A</span> (${fmtPct(convB)} vs ${fmtPct(convA)}).`;
      if (bestStage)  verdict += `<br>Beste stage: <strong>${esc(bestStage.label)}</strong> <span class="pos">+${bestStage.pctChange}%</span>.`;
      if (worstStage) verdict += `<br>Slechtste stage: <strong>${esc(worstStage.label)}</strong> <span class="neg">${worstStage.pctChange}%</span>.`;
    }

    // 📊 Grootste delta per stage
    let deltaBody;
    if (!sortedAbs.length) {
      deltaBody = 'Geen vergelijkbare stages (A en B hebben verschillende data-volumes).';
    } else {
      deltaBody = '<ul>' + sortedAbs.slice(0, 3).map(d => {
        const sign = d.pctChange > 0 ? '+' : '';
        const cls  = d.pctChange > 0 ? 'pos' : d.pctChange < 0 ? 'neg' : '';
        const arrow = d.pctChange > 0 ? '▲' : d.pctChange < 0 ? '▼' : '·';
        return `<li><span class="bullet">${arrow}</span><span><strong>${esc(d.label)}</strong>: <span class="tf-a">A ${d.ca}</span> → <span class="tf-b">B ${d.cb}</span> <strong class="${cls}">${sign}${d.pctChange}%</strong></span></li>`;
      }).join('') + '</ul>';
    }

    // 🧪 Strategie context
    const stratA = (dataA.active_strategies || []).map(s => s.name).filter(Boolean);
    const stratB = (dataB.active_strategies || []).map(s => s.name).filter(Boolean);
    const stratAStr = stratA.length ? stratA.join(' → ') : 'onbekend';
    const stratBStr = stratB.length ? stratB.join(' → ') : 'onbekend';
    let stratBody;
    if (!stratA.length && !stratB.length) {
      stratBody = 'Geen WhatsApp-strategie actief in beide perioden — verschillen zitten in uitvoering / leadkwaliteit.';
    } else if (stratAStr === stratBStr) {
      stratBody = `Beide perioden draaiden op <strong>${esc(stratAStr)}</strong>. Het verschil is dus niet door de strategie te verklaren — kijk naar uitvoering of leadbron.`;
    } else {
      stratBody = `<span class="tf-a">A</span> draaide op <strong>${esc(stratAStr)}</strong>, <span class="tf-b">B</span> op <strong>${esc(stratBStr)}</strong>.`;
      if (worstStage) stratBody += ` Verschil zit met name bij <strong>${esc(worstStage.label)}</strong> — strategie-effect waarschijnlijk.`;
      else if (bestStage) stratBody += ` Verbetering zit met name bij <strong>${esc(bestStage.label)}</strong>.`;
    }

    // 💡 Aanbeveling
    let aanbev;
    if (benA === 0 || benB === 0) {
      aanbev = 'Geen aanbeveling — eerst beide periodes vullen met leads.';
    } else if (convDiff > 0.05 && bestStage) {
      aanbev = `B is breder dan A. Onderzoek waarom <strong>${esc(bestStage.label)}</strong> beter werd in B — herhaal die aanpak in volgende periodes.`;
    } else if (convDiff < -0.05 && worstStage) {
      aanbev = `B is smaller dan A. Focus op <strong>${esc(worstStage.label)}</strong> — daar verlies je het meeste t.o.v. A.`;
    } else if (sortedAbs[0]) {
      aanbev = `Nagenoeg gelijke conversie. Grootste schommeling per stage: <strong>${esc(sortedAbs[0].label)}</strong> — daar kun je B nog optimaliseren.`;
    } else {
      aanbev = 'Te weinig overlappende data voor een gerichte aanbeveling.';
    }

    return [
      { icon: '🎯', title: 'Verdict B vs A',          body: verdict },
      { icon: '📊', title: 'Grootste delta per stage', body: deltaBody },
      { icon: '🧪', title: 'Strategie-context',        body: stratBody },
      { icon: '💡', title: 'Aanbeveling',              body: aanbev },
    ];
  }

  function _renderFunnelInto(elId, funnel, stages, labels, options) {
    const el = document.getElementById(elId);
    if (!el) return;
    const bucket = funnel[_kpiSource] || funnel.all || {};
    const entry  = bucket[stages[0]] || 0;
    const phone  = funnel.phone || {};
    const wa     = funnel.whatsapp || {};
    const compF  = options.compareFunnel || null;
    const compB  = compF ? (compF[_kpiSource] || compF.all || {}) : null;
    if (!entry && !bucket.total) {
      el.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Nog geen data in deze periode.</div>';
      return;
    }
    let prev = entry || 1;
    el.innerHTML = stages.map((stage, i) => {
      const count = bucket[stage] || 0;
      const pct   = entry ? (count / entry * 100) : 0;
      const ph    = phone[stage] || 0;
      const w     = wa[stage]    || 0;
      const sum   = ph + w;
      const phPct = sum ? Math.round(ph / sum * 100) : 0;
      const waPct = sum ? Math.round(w  / sum * 100) : 0;
      const phWins = ph > w, waWins = w > ph;
      const deltaPct = (i > 0 && prev) ? Math.round((count - prev) / prev * 100) : null;
      prev = count;
      const isEnd = (options.endStages || []).includes(stage);
      const split = (ph || w)
        ? `<div class="funnel-stage-split">
             <span class="src-pill ${phWins ? 'winner' : ''}">📞 ${ph} <span style="opacity:0.6;">(${phPct}%)</span></span>
             <span class="src-pill ${waWins ? 'winner' : ''}">💬 ${w} <span style="opacity:0.6;">(${waPct}%)</span></span>
           </div>`
        : '';
      const arrow = (i > 0 && deltaPct !== null && deltaPct !== 0)
        ? `<div class="funnel-arrow">${deltaPct > 0 ? '↑ +' + deltaPct : '<span class="delta-neg">↓ ' + Math.abs(deltaPct) + '%</span>'}</div>`
        : '';
      const cmpCount = compB ? _deltaSpan(count, compB[stage] || 0, false) : '';
      return `${arrow}
        <div class="funnel-stage ${isEnd ? 'is-end' : ''}">
          <div class="funnel-stage-name">${esc(labels[stage] || stage)}</div>
          <div class="funnel-stage-count">${count}${cmpCount}</div>
          <div class="funnel-stage-pct">${pct.toFixed(1)}% van entry</div>
          ${split}
        </div>`;
    }).join('');
  }

  // ── Stage-focus klik-interactie ─────────────────────────────────────────
  // Klik een stage-card (of een datapunt) om die stage te isoleren — andere
  // stages worden gefade & blurred. Klik nogmaals om te resetten.
  function setKpiStageFocus(funnelEl, stageIdx) {
    if (!funnelEl) return;
    const current = funnelEl.dataset.focus;
    const next = String(stageIdx);
    if (current === next) {
      // Same stage clicked again → release focus
      delete funnelEl.dataset.focus;
      funnelEl.querySelectorAll('.lc-stage-meta').forEach(m => m.classList.remove('is-focused'));
      funnelEl.querySelectorAll('.lc-pt').forEach(p => p.removeAttribute('data-focused'));
    } else {
      funnelEl.dataset.focus = next;
      funnelEl.querySelectorAll('.lc-stage-meta').forEach((m, i) => m.classList.toggle('is-focused', i === stageIdx));
      funnelEl.querySelectorAll('.lc-pt').forEach((p, i) => {
        // pts list is interleaved per series; cx attribute matches xs[stageIdx]
        // Easier: count points per series by reading their parent group order.
        const wantX = funnelEl._stageXs ? funnelEl._stageXs[stageIdx] : null;
        if (wantX != null && Math.abs(parseFloat(p.getAttribute('cx')) - wantX) < 0.5) {
          p.setAttribute('data-focused', '1');
        } else {
          p.removeAttribute('data-focused');
        }
      });
    }
  }

</script>
