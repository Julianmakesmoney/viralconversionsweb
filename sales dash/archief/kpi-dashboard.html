<script>
  // ── KPI DASHBOARD ─────────────────────────────
  let _kpiGran        = 'week';                // day | week | month | custom
  let _kpiSource      = 'all';                  // all | phone | whatsapp
  let _kpiMember      = '';                     // sales_members.id or '' for team
  let _kpiCloseStatus = 'geclosed';             // close definition
  let _kpiCompare     = false;                  // compare mode toggle
  let _kpiA = null, _kpiB = null;               // per-panel data
  let _kpiParamsA = null, _kpiParamsB = null;   // {from, to, label}

  // Compute {from, to, label} for a preset step within a granularity
  function _kpiRangeFor(gran, stepsBack) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const fmt = (d) => d.toISOString().split('T')[0];
    let from, to, label;
    if (gran === 'day') {
      from = new Date(today); from.setDate(from.getDate() - stepsBack);
      to   = new Date(from);
      label = stepsBack === 0 ? 'Vandaag' : stepsBack === 1 ? 'Gisteren'
            : stepsBack + ' dagen geleden';
    } else if (gran === 'week') {
      // ISO week (ma-zo)
      const dow = (today.getDay() + 6) % 7;  // 0=ma
      const thisMonday = new Date(today); thisMonday.setDate(today.getDate() - dow);
      from = new Date(thisMonday); from.setDate(from.getDate() - stepsBack * 7);
      to   = new Date(from); to.setDate(to.getDate() + 6);
      label = stepsBack === 0 ? 'Deze week' : stepsBack === 1 ? 'Vorige week'
            : stepsBack + ' weken geleden';
    } else if (gran === 'month') {
      from = new Date(today.getFullYear(), today.getMonth() - stepsBack, 1);
      to   = new Date(today.getFullYear(), today.getMonth() - stepsBack + 1, 0);
      const m = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'][from.getMonth()];
      label = stepsBack === 0 ? 'Deze maand · ' + m : stepsBack === 1 ? 'Vorige maand · ' + m
            : m + ' ' + from.getFullYear();
    } else {
      return null;
    }
    return {from: fmt(from), to: fmt(to), label: label};
  }

  function _buildPresetOptions(gran) {
    const steps = gran === 'day' ? [0,1,2,3,4,5,6]
                : gran === 'week' ? [0,1,2,3,4,5,6,7]
                : gran === 'month' ? [0,1,2,3,4,5,6]
                : [];
    return steps.map(s => {
      const r = _kpiRangeFor(gran, s);
      return `<option value="${s}">${esc(r.label)}</option>`;
    }).join('');
  }

  function setKpiGran(gran, btn) {
    _kpiGran = gran;
    document.querySelectorAll('[data-gran]').forEach(b => b.classList.toggle('active', b === btn));
    const presetA = document.getElementById('kpiPresetA');
    const presetB = document.getElementById('kpiPresetB');
    const showCustom = gran === 'custom';
    ['kpiFromA','kpiToA','kpiFromB','kpiToB'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = showCustom ? '' : 'none';
    });
    [presetA, presetB].forEach(s => { if (s) s.style.display = showCustom ? 'none' : ''; });
    if (!showCustom) {
      const opts = _buildPresetOptions(gran);
      presetA.innerHTML = opts;
      presetB.innerHTML = opts;
      // Default state:
      //   single-mode  → A = current period, B unset
      //   compare-mode → A = one step back  , B = current
      if (_kpiCompare) { presetA.value = '1'; presetB.value = '0'; onKpiPresetChange('A'); onKpiPresetChange('B'); }
      else             { presetA.value = '0';                       onKpiPresetChange('A'); }
    }
  }

  function setKpiSource(src, btn) {
    _kpiSource = src;
    // Sync every source toggle on the page — top-bar buttons and the new
    // per-card vertical side-controls all share one _kpiSource state.
    document.querySelectorAll('[data-src],[data-side-src]').forEach(b => {
      const v = b.dataset.src || b.dataset.sideSrc;
      b.classList.toggle('active', v === src);
    });
    _renderKpiPanels();
  }

  function setKpiClose(value, btn) {
    _kpiCloseStatus = value;
    document.querySelectorAll('[data-close]').forEach(b => b.classList.toggle('active', b.dataset.close === value));
    if (_kpiParamsA) _kpiFetch('A', _kpiParamsA);
    if (_kpiCompare && _kpiParamsB) _kpiFetch('B', _kpiParamsB);
  }

  function toggleKpiCompare() {
    _kpiCompare = document.getElementById('kpiCompareMode').checked;
    document.getElementById('kpiPanelB').style.display = _kpiCompare ? '' : 'none';
    const oldSwap = document.getElementById('kpiSwapBtn');
    if (oldSwap) oldSwap.style.display = _kpiCompare ? '' : 'none';
    // Side-swap buttons inside each chart card only make sense in compare-mode
    document.querySelectorAll('.kpi-side-swap').forEach(b => { b.style.display = _kpiCompare ? '' : 'none'; });
    document.querySelector('.kpi-wrap').classList.toggle('is-compare', _kpiCompare);
    document.getElementById('kpiCompareHint').textContent = _kpiCompare
      ? 'Compare-mode: tijdvak B wordt over A heen getekend (B = dashed). Wissel via de ⇅ knop links van elke grafiek.'
      : 'Eén tijdvak — zet vergelijkingsmodus aan om twee perioden in dezelfde grafiek te zien.';
    document.getElementById('kpiAtitle').textContent = _kpiCompare ? 'Tijdvak A' : 'Periode';
    document.getElementById('kpiAbadge').textContent = _kpiCompare ? 'A' : '📊';
    if (_kpiCompare && !_kpiB) {
      // Auto-fetch B with sensible default (current period)
      const presetB = document.getElementById('kpiPresetB');
      if (presetB && _kpiGran !== 'custom') { presetB.value = '0'; onKpiPresetChange('B'); }
    }
    _renderKpiPanels();
  }

  function onKpiMemberChange() {
    _kpiMember = document.getElementById('kpiMember').value;
    // Re-fetch both panels with the new member filter
    if (_kpiParamsA) _kpiFetch('A', _kpiParamsA);
    if (_kpiCompare && _kpiParamsB) _kpiFetch('B', _kpiParamsB);
  }

  function onKpiPresetChange(panel) {
    const sel = document.getElementById('kpiPreset' + panel);
    if (!sel) return;
    const r = _kpiRangeFor(_kpiGran, parseInt(sel.value, 10) || 0);
    if (!r) return;
    _kpiFetch(panel, r);
  }

  function onKpiCustomChange(panel) {
    const f = document.getElementById('kpiFrom' + panel)?.value;
    const t = document.getElementById('kpiTo' + panel)?.value;
    if (!f || !t) return;
    if (t < f) return;
    _kpiFetch(panel, {from: f, to: t, label: f + ' t/m ' + t});
  }

  async function _kpiFetch(panel, range) {
    const params = new URLSearchParams({
      from: range.from, to: range.to,
      close_status: _kpiCloseStatus,
    });
    if (_kpiMember) params.set('member_id', _kpiMember);
    try {
      const res = await fetch('/api/sales/kpi-stats?' + params.toString());
      if (!res.ok) return;
      const d = await res.json();
      if (panel === 'A') { _kpiA = d; _kpiParamsA = range; }
      else               { _kpiB = d; _kpiParamsB = range; }
      document.getElementById('kpi' + panel + 'label').textContent = '· ' + range.label + ' (' + range.from + ' t/m ' + range.to + ')';
      const strats = (d.active_strategies || []).map(s => s.name).filter(Boolean);
      const sEl = document.getElementById('kpiStrategy' + panel);
      if (sEl) sEl.textContent = 'strategie: ' + (strats.length ? strats.join(' → ') : 'onbekend');
      // Roster populates the member dropdown — only once
      if (d.roster && document.getElementById('kpiMember').options.length <= 1) {
        const sel = document.getElementById('kpiMember');
        d.roster.forEach(m => { sel.insertAdjacentHTML('beforeend', '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>'); });
      }
      // Member stats card — only show on panel A (the current period) when a member is selected
      if (panel === 'A') {
        const ms = d.member_stats;
        const msEl = document.getElementById('kpiMemberStats');
        if (ms && _kpiMember) {
          msEl.style.display = '';
          document.getElementById('kpiMemberRevenue').textContent    = '€' + Math.round(ms.revenue).toLocaleString('nl-NL');
          document.getElementById('kpiMemberCommission').textContent = '€' + Math.round(ms.commission).toLocaleString('nl-NL');
          document.getElementById('kpiMemberCloses').textContent     = ms.closes;
        } else {
          msEl.style.display = 'none';
        }
      }
      _renderKpiPanels();
    } catch (e) { console.warn('[kpi] fetch failed', e); }
  }

  function swapKpiPanels() {
    [_kpiA, _kpiB] = [_kpiB, _kpiA];
    [_kpiParamsA, _kpiParamsB] = [_kpiParamsB, _kpiParamsA];
    const a = document.getElementById('kpiAlabel'), b = document.getElementById('kpiBlabel');
    if (a) a.textContent = _kpiParamsA ? ('· ' + _kpiParamsA.label) : '— kies een periode';
    if (b) b.textContent = _kpiParamsB ? ('· ' + _kpiParamsB.label) : '— kies een periode';
    const sA = document.getElementById('kpiStrategyA'), sB = document.getElementById('kpiStrategyB');
    if (sA && _kpiA) { const n = (_kpiA.active_strategies || []).map(s => s.name).filter(Boolean); sA.textContent = 'strategie: ' + (n.length ? n.join(' → ') : 'onbekend'); }
    if (sB && _kpiB) { const n = (_kpiB.active_strategies || []).map(s => s.name).filter(Boolean); sB.textContent = 'strategie: ' + (n.length ? n.join(' → ') : 'onbekend'); }
    _renderKpiPanels();
  }

  // Single-card rendering: panel A is the only render target. When compare
  // mode is on AND _kpiB has data, B is passed in as overlay so each chart
  // draws 4 lines (A solid + B dashed) and the stage cards stack A above B.
  function _renderKpiPanels() {
    if (!_kpiA) return;
    const compare = _kpiCompare && _kpiB ? _kpiB : null;
    _renderPanel('A', _kpiA, compare);
    // Panel B's body stays hidden in compare mode (overlay lives in A), but
    // its summary remains so the user can still pick B's period.
  }

  function _renderPanel(panel, data, compareAgainst) {
    const wLabels = data.stage_labels?.warm_leads || {};
    const dLabels = data.stage_labels?.demos || {};
    // The warm-leads chart embeds its own Prospect → Warm-lead conversion in
    // the first segment, so we leave the old strip empty above it.
    const convWarmEl = document.getElementById('kpi' + panel + 'convWarm');
    if (convWarmEl) convWarmEl.innerHTML = '';

    const warmCompare = compareAgainst
      ? { funnel: compareAgainst.warm_leads_funnel || {}, source: compareAgainst.source_conversion || {} }
      : null;
    const demoCompare = compareAgainst
      ? { demoFunnel: compareAgainst.demo_funnel || {}, source: compareAgainst.source_conversion || {} }
      : null;
    const bridgeCompare = compareAgainst
      ? { warmFunnel: compareAgainst.warm_leads_funnel || {}, demoFunnel: compareAgainst.demo_funnel || {} }
      : null;

    // 0 · Combined Benaderd → Volledig betaald line chart (only KPI chart now)
    _renderFullFunnelLineChart('kpi' + panel + 'full', data, compareAgainst);
    // Extras (8 supplementary cards) only render on Panel A (current period)
    if (panel === 'A') {
      const params = _kpiParamsA || {};
      _loadKpiExtras({
        from: params.from, to: params.to,
        preset: params.preset, period: params.period,
        source: (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all'),
        member_id: data.member_id || '',
      });
    }
    // Drop-off card is verwijderd — afhakers worden al getoond in de
    // 'Totaal afgehaakt' totaal-kaarten onder elke chart, en de
    // conclusie-card noemt de grootste lek expliciet.
    // Callback sub-funnel + Conclusion card lives only on Panel A
    if (panel === 'A') {
      _renderCallbackFunnel();
      _renderConclusion('kpiConclusion', data, compareAgainst);
    }
  }

  // ── Callback sub-funnel (independent from main warm-lead funnel) ───────
  // Calls /api/sales/kpi-callback-funnel with the active period + source +
  // member filter. The endpoint walks status_history to find every lead
  // that ever sat in ik_bel_terug/zij_bellen_terug, then looks up its
  // current status to build the buckets.
  async function _renderCallbackFunnel() {
    const cardEl = document.getElementById('kpiCallbackCard');
    const bodyEl = document.getElementById('kpiCallbackBody');
    if (!cardEl || !bodyEl) return;
    const range = (typeof _kpiParamsA !== 'undefined') ? _kpiParamsA : null;
    if (!range) { cardEl.style.display = 'none'; return; }
    const src = (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all') || 'all';
    const params = new URLSearchParams({
      from:   range.from,
      to:     range.to,
      source: src,
    });
    if (typeof _kpiMember !== 'undefined' && _kpiMember) params.set('member_id', _kpiMember);

    let d;
    try {
      const res = await fetch('/api/sales/kpi-callback-funnel?' + params.toString());
      if (!res.ok) { cardEl.style.display = 'none'; return; }
      d = await res.json();
    } catch (e) {
      console.warn('[callback-funnel] fetch failed', e);
      cardEl.style.display = 'none';
      return;
    }

    cardEl.style.display = '';
    const total = d.total || 0;
    if (!total) {
      bodyEl.innerHTML = `
        <div class="cb-head">
          <div class="title">📞 Callback sub-funnel</div>
          <div class="summary">Geen leads in deze periode hebben callback aangeraakt.</div>
        </div>`;
      return;
    }

    const still      = d.still_in_callback || {count: 0};
    const progressed = d.progressed        || {count: 0};
    const afgehaakt  = d.afgehaakt         || 0;
    const pct = (n) => total ? Math.round(n / total * 100) : 0;

    const stillIb = still.ik_bel_terug || 0;
    const stillZb = still.zij_bellen_terug || 0;
    const stillSub = (stillIb || stillZb)
      ? `<div class="cb-bucket-pct">📞 ik bel: ${stillIb} · 💬 zij bellen: ${stillZb}</div>`
      : '';

    const srcLabel = src === 'phone' ? '📞 bellen' : src === 'whatsapp' ? '💬 WhatsApp' : 'alle bronnen';

    const tags = [];
    if (progressed.forum_nog_sturen) tags.push(`<span class="cb-tag">⏳ Forum nog sturen <strong>${progressed.forum_nog_sturen}</strong></span>`);
    if (progressed.forum_gestuurd)   tags.push(`<span class="cb-tag">📤 Forum gestuurd <strong>${progressed.forum_gestuurd}</strong></span>`);
    if (progressed.forum_gezien)     tags.push(`<span class="cb-tag">👀 Forum gezien <strong>${progressed.forum_gezien}</strong></span>`);
    if (progressed.forum_ingevuld)   tags.push(`<span class="cb-tag">📝 Forum ingevuld <strong>${progressed.forum_ingevuld}</strong></span>`);
    if (progressed.gesloten)         tags.push(`<span class="cb-tag">✓ Gesloten <strong>${progressed.gesloten}</strong></span>`);

    bodyEl.innerHTML = `
      <div class="cb-head">
        <div class="title">📞 Callback sub-funnel — ${srcLabel}</div>
        <div class="summary"><strong>${total}</strong> leads ooit in callback</div>
      </div>
      <div class="cb-buckets">
        <div class="cb-bucket cb-still">
          <div class="cb-bucket-icon">⏳</div>
          <div class="cb-bucket-count">${still.count}</div>
          <div class="cb-bucket-label">Nog in callback</div>
          <div class="cb-bucket-pct">${pct(still.count)}%</div>
          ${stillSub}
        </div>
        <div class="cb-bucket cb-progressed">
          <div class="cb-bucket-icon">✅</div>
          <div class="cb-bucket-count">${progressed.count}</div>
          <div class="cb-bucket-label">Doorgestroomd</div>
          <div class="cb-bucket-pct">${pct(progressed.count)}%</div>
        </div>
        <div class="cb-bucket cb-afgehaakt">
          <div class="cb-bucket-icon">❌</div>
          <div class="cb-bucket-count">${afgehaakt}</div>
          <div class="cb-bucket-label">Afgehaakt</div>
          <div class="cb-bucket-pct">${pct(afgehaakt)}%</div>
        </div>
      </div>
      ${tags.length ? `
        <div class="cb-progression">
          <div class="cb-progression-head">Doorgestroomd naar</div>
          <div class="cb-tag-row">${tags.join('')}</div>
        </div>` : ''}
      <div class="cb-conv-pill">
        Callback-conversie: <strong>${(d.progression_pct || 0).toFixed(1).replace('.', ',')}%</strong>
        <span style="opacity:0.7;">— ${progressed.count} van ${total} leads stroomde door</span>
      </div>
    `;
  }

  // Inline delta helper — returns colored '(±N)' or '(±X%)' span
  function _deltaSpan(curr, prev, isPct) {
    if (prev == null) return '';
    const c = Number(curr || 0), p = Number(prev || 0);
    if (p === 0 && c === 0) return '';
    const diff = c - p;
    if (Math.abs(diff) < 0.01) return ' <span class="delta-flat">(=)</span>';
    const cls = diff > 0 ? 'delta-up' : 'delta-down';
    const sign = diff > 0 ? '+' : '';
    const txt = isPct
      ? sign + diff.toFixed(1).replace('.', ',') + 'pp'
      : sign + Math.round(diff).toLocaleString('nl-NL');
    return ' <span class="' + cls + '">(' + txt + ')</span>';
  }

  // Compact bron-conversie strip rendered above each funnel
  function _sourceConvStrip(src, pctKey, label, compareSrc, comparePctKey) {
    const p = src.phone    || {};
    const w = src.whatsapp || {};
    const cp = compareSrc ? (compareSrc.phone    || {}) : null;
    const cw = compareSrc ? (compareSrc.whatsapp || {}) : null;
    const numKey = pctKey === 'benaderd_to_warm_pct' ? 'warm_leads' : 'closes';
    const baseKey = pctKey === 'benaderd_to_warm_pct' ? 'benaderd'  : 'warm_leads';
    const cellHTML = (icon, name, data, comp) => {
      const num = data[numKey] || 0, base = data[baseKey] || 0, pct = data[pctKey] || 0;
      const dNum = comp ? _deltaSpan(num, comp[numKey] || 0, false) : '';
      const dPct = comp ? _deltaSpan(pct, comp[pctKey] || 0, true)  : '';
      return `<div style="flex:1;min-width:160px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:10px;padding:10px 14px;">
        <div style="font-size:10.5px;font-weight:800;color:var(--t3);letter-spacing:0.04em;text-transform:uppercase;">${icon} ${name}</div>
        <div style="display:flex;gap:14px;align-items:baseline;margin-top:4px;">
          <div style="font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;">${num}/${base}${dNum}</div>
          <div style="font-size:18px;font-weight:900;color:#10b981;font-variant-numeric:tabular-nums;">${pct.toFixed(1).replace('.', ',')}%${dPct}</div>
        </div>
      </div>`;
    };
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:11px;">
      <div style="flex:0 0 100%;font-size:10.5px;font-weight:700;color:var(--t3);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px;">${label} per bron</div>
      ${cellHTML('📞','Bellen', p, cp)}
      ${cellHTML('💬','WhatsApp', w, cw)}
    </div>`;
  }

  function _renderDropoffInto(elId, d, wLabels, dLabels, compare) {
    const el = document.getElementById(elId);
    if (!el) return;
    const warm  = d.warm_leads || {};
    const demos = d.demos      || {};
    const wAll = warm.all || {};
    const dAll = demos.all || {};
    const cWarm  = compare ? (compare.warm_leads || {}).all || {} : null;
    const cDemos = compare ? (compare.demos      || {}).all || {} : null;
    const wTotal = Object.values(wAll).reduce((s,v) => s+v, 0);
    const dTotal = Object.values(dAll).reduce((s,v) => s+v, 0);
    if (!wTotal && !dTotal && !warm.unknown && !demos.unknown) { el.innerHTML = '<div class="empty-state">Geen afgehaakte leads.</div>'; return; }
    const max = Math.max(wTotal ? Math.max(...Object.values(wAll)) : 0,
                         dTotal ? Math.max(...Object.values(dAll)) : 0, 1);
    const rowH = (label, count, cmpVal) => {
      const w = Math.max(2, Math.round(count / max * 100));
      // For dropoff: more afhakers is WORSE — invert green/red
      const cmpHtml = (cmpVal != null)
        ? (() => {
            const diff = count - cmpVal;
            if (diff === 0) return ' <span class="delta-flat">(=)</span>';
            // More dropoff = bad (red), less = good (green)
            const cls = diff > 0 ? 'delta-down' : 'delta-up';
            const sign = diff > 0 ? '+' : '';
            return ' <span class="' + cls + '">(' + sign + diff + ')</span>';
          })()
        : '';
      return `<div class="dropoff-bar-row">
        <div class="dropoff-bar-name">${esc(label)}</div>
        <div class="dropoff-bar-track"><div class="dropoff-bar-fill" style="width:${w}%;"></div></div>
        <div class="dropoff-bar-count">${count}${cmpHtml}</div>
      </div>`;
    };
    const sect = (title, totals, labels, cmp) => {
      const entries = Object.entries(totals).filter(([_, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return '';
      return `<div class="dropoff-section-label">${title}</div><div class="dropoff-bars">${entries.map(([k, v]) => rowH(labels[k] || k, v, cmp ? (cmp[k] || 0) : null)).join('')}</div>`;
    };
    let html = '';
    html += sect('Warm leads', wAll, wLabels, cWarm);
    if (warm.unknown)  html += `<div style="font-size:11px;color:var(--t3);margin-top:6px;">+ ${warm.unknown} zonder dropoff-stage (oude data)</div>`;
    html += sect("Demo's", dAll, dLabels, cDemos);
    if (demos.unknown) html += `<div style="font-size:11px;color:var(--t3);margin-top:6px;">+ ${demos.unknown} zonder dropoff-stage (oude data)</div>`;
    el.innerHTML = html || '<div class="empty-state">Geen afgehaakte leads.</div>';
  }

  // Initialise on boot: load Week granularity with A=last week, B=this week
  function initKpiDashboard() {
    if (document.getElementById('kpiPresetA') == null) return;  // not on this page
    const btn = document.querySelector('[data-gran="week"]');
    if (btn) setKpiGran('week', btn);
  }

  // Lazy-loader: draai initKpiDashboard() pas als de KPI-sectie in beeld komt,
  // zodat de 3 zware KPI-endpoints niet op elke page-load meedraaien. Één keer.
  let _kpiInit = false;
  function _lazyInitKpiDashboard() {
    if (_kpiInit) return;
    const panel = document.getElementById('kpiPanelA') || document.getElementById('kpiPresetA');
    if (!panel) return;  // KPI niet op deze pagina
    const go = () => { if (_kpiInit) return; _kpiInit = true; initKpiDashboard(); };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        if (entries.some(e => e.isIntersecting)) { io.disconnect(); go(); }
      }, { rootMargin: '250px' });
      io.observe(panel);
    } else {
      go();  // oude browser zonder IO → gewoon eager laden
    }
  }

  // No-op: kept so other places that call loadKPIs() don't crash. The compare
  // dashboard is independent of the existing Totaal/Maand/Week/Dag tab buttons.
  function loadKPIs() { /* compare UI manages its own state */ }

  // ── Delta-pill helper for compare-mode (B − A) ─────────────────────────
  // Returns a small coloured pill that says how B compares to A. Counts:
  // up = good (more = better). Percentages share the same colour rule but
  // use "pp" units. Callers that want the inverse semantics (e.g. drop %)
  // pass {lowerIsBetter:true} so a smaller B reads as "up/green".
  function _lcDeltaPill(curr, prev, opts) {
    opts = opts || {};
    const c = Number(curr || 0), p = Number(prev || 0);
    if (p === 0 && c === 0) return '';
    const diff = c - p;
    if (Math.abs(diff) < 0.01) return '<span class="lc-delta-pill flat">Δ = 0</span>';
    const better = opts.lowerIsBetter ? diff < 0 : diff > 0;
    const cls = better ? 'up' : 'down';
    const arrow = diff > 0 ? '▲' : '▼';
    const sign = diff > 0 ? '+' : '−';
    const mag = Math.abs(diff);
    const txt = opts.isPct
      ? sign + mag.toFixed(1).replace('.', ',') + 'pp'
      : sign + Math.round(mag).toLocaleString('nl-NL');
    return '<span class="lc-delta-pill ' + cls + '">' + arrow + ' ' + txt + '</span>';
  }

  // ── Warm-leads funnel as a line chart with points ──────────────────────
  // Stages: Benaderd → Warm lead → Bel terug → Forum gestuurd → Forum gezien → Forum ingevuld
  // First segment (Benaderd → Warm lead) is a big drop; visually compressed
  // with a zigzag + broken-axis marker.
  //
  // Single-period mode: 2 lines (📞 + 💬), stage cards show one row.
  // Compare-mode (compareData provided): 4 lines (A solid, B dashed), stage
  // cards stack A above B with a delta pill; totals show A + B + delta.
  function _renderWarmLeadsLineChart(elId, funnel, source, _labels, compareData) {
    const el = document.getElementById(elId);
    if (!el) return;

    const isCompare = !!compareData;
    const STAGES = [
      { key:'benaderd',         label:'Benaderd'         },
      { key:'warm_lead',        label:'Warm lead'        },
      { key:'callback',         label:'Bel terug'        },
      { key:'forum_nog_sturen', label:'Forum nog sturen' },
      { key:'forum_gestuurd',   label:'Forum gestuurd'   },
      { key:'forum_gezien',     label:'Forum gezien'     },
      { key:'forum_ingevuld',   label:'Forum ingevuld'   },
    ];

    const _warmCounts = (fnl, srcObj, bucketKey) => {
      const f = (fnl || {})[bucketKey] || {};
      const s = (srcObj || {})[bucketKey] || {};
      return [
        Number(s.benaderd)          || 0,
        Number(s.warm_leads)        || 0,
        (Number(f.ik_bel_terug) || 0) + (Number(f.zij_bellen_terug) || 0),
        Number(f.forum_nog_sturen)  || 0,
        Number(f.forum_gestuurd)    || 0,
        Number(f.forum_gezien)      || 0,
        Number(f.forum_ingevuld)    || 0,
      ];
    };

    // Series A (always present)
    const aPh = _warmCounts(funnel, source, 'phone');
    const aWa = _warmCounts(funnel, source, 'whatsapp');
    const aAll = aPh.map((v, i) => v + aWa[i]);
    // Series B (compare only)
    const bPh = isCompare ? _warmCounts(compareData.funnel, compareData.source, 'phone')    : null;
    const bWa = isCompare ? _warmCounts(compareData.funnel, compareData.source, 'whatsapp') : null;
    const bAll = isCompare ? bPh.map((v, i) => v + bWa[i]) : null;

    const src = (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all') || 'all';
    const pickSrc = (ph, wa, all) => src === 'phone' ? ph : (src === 'whatsapp' ? wa : all);
    const activeA = pickSrc(aPh, aWa, aAll);
    const activeB = isCompare ? pickSrc(bPh, bWa, bAll) : null;

    const emptyA = activeA.every(v => v === 0);
    const emptyB = isCompare ? activeB.every(v => v === 0) : true;
    if (emptyA && emptyB) {
      el.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Nog geen data in deze periode.</div>';
      return;
    }

    // ── SVG geometry ──
    const W = 1000, H = 280;
    const mT = 26, mB = 26;
    const colW = W / STAGES.length;
    const xs = STAGES.map((_, i) => (i + 0.5) * colW);
    const stage0Y = mT + 4;
    const stage1Top = mT + 70;
    const bottomY = H - mB;
    // restMax scaled across all visible series so nothing clips
    const restPool = [
      ...aPh.slice(1), ...aWa.slice(1),
      ...(isCompare ? [...bPh.slice(1), ...bWa.slice(1)] : []),
    ];
    const restMax = Math.max(1, ...restPool);
    const yFor = (i, v) => i === 0
      ? stage0Y
      : bottomY - (v / restMax) * (bottomY - stage1Top);

    // Zig-zag path through the first segment (stage 0 → 1), straight after.
    const buildPath = (data) => {
      const pts = data.map((v, i) => [xs[i], yFor(i, v)]);
      const [x0, y0] = pts[0], [x1, y1] = pts[1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.hypot(dx, dy) || 1;
      const px = -dy / len, py = dx / len;
      const amp = 11;
      const wps = [[0.30,0],[0.40,1],[0.50,-1],[0.60,1],[0.70,-1],[0.80,0]];
      let d = `M ${x0} ${y0}`;
      wps.forEach(([t, s]) => {
        const bx = x0 + dx * t, by = y0 + dy * t;
        d += ` L ${bx + px * amp * s} ${by + py * amp * s}`;
      });
      d += ` L ${x1} ${y1}`;
      for (let i = 2; i < pts.length; i++) d += ` L ${pts[i][0]} ${pts[i][1]}`;
      return d;
    };

    const buildPoints = (data, cls) => data.map((v, i) =>
      `<circle class="lc-pt ${cls}" cx="${xs[i].toFixed(1)}" cy="${yFor(i, v).toFixed(1)}" r="5.5" />`
    ).join('');

    // ── Stage row ──
    const stageRow = STAGES.map((st, i) => {
      if (isCompare) {
        const ca = activeA[i], cb = activeB[i];
        const pa = i > 0 ? activeA[i - 1] : 0;
        const pb = i > 0 ? activeB[i - 1] : 0;
        const dropA = i > 0 && pa > 0 ? Math.round((pa - ca) / pa * 100) : null;
        const dropB = i > 0 && pb > 0 ? Math.round((pb - cb) / pb * 100) : null;
        const rowFor = (tf, c, drop) => `<div class="lc-tf-row" data-tf="${tf}">
          <span class="lc-tf-badge">${tf}</span>
          <span class="lc-tf-cnt">${c.toLocaleString('nl-NL')}</span>
          <span class="lc-tf-drop ${drop === null ? '' : (drop > 0 ? 'neg' : '')}">${drop === null ? 'start' : '−' + drop + '%'}</span>
        </div>`;
        return `<div class="lc-stage-meta is-compare">
          <div class="lc-stage-name">${esc(st.label)}</div>
          ${rowFor('A', ca, dropA)}
          ${rowFor('B', cb, dropB)}
          ${_lcDeltaPill(cb, ca)}
        </div>`;
      }
      // Single-period card
      const cnt  = activeA[i];
      const prev = i > 0 ? activeA[i - 1] : 0;
      const drop = (i > 0 && prev > 0) ? Math.round((prev - cnt) / prev * 100) : null;
      const conv = activeA[0] > 0 ? (cnt / activeA[0] * 100) : 0;
      // Snapshot counts are not strictly monotonic — when a later stage has
      // MORE leads than the previous (e.g. forum_gestuurd is the default
      // landing status), drop is negative, so show '+N%' in green.
      const dropTxt = drop === null ? 'start'
                    : drop === 0    ? '0%'
                    : drop > 0      ? '−' + drop + '%'
                    : '+' + (-drop) + '%';
      const dropCls = drop === null ? 'zero'
                    : drop === 0    ? 'zero'
                    : drop > 0      ? 'neg'
                    : 'pos';
      const convTxt = i === 0 ? '100% start' : conv.toFixed(1).replace('.', ',') + '% van start';
      return `<div class="lc-stage-meta">
        <div class="lc-stage-name">${esc(st.label)}</div>
        <div class="lc-stage-count">${cnt.toLocaleString('nl-NL')}</div>
        <div class="lc-stage-drop ${dropCls}">${dropTxt}</div>
        <div class="lc-stage-conv">${convTxt}</div>
      </div>`;
    }).join('');

    // ── Totals ──
    const droppedBy = (fnl, b) => Number(((fnl || {})[b] || {}).afgehaakt) || 0;
    const sumDropped = (fnl) => src === 'phone'    ? droppedBy(fnl, 'phone')
                              : src === 'whatsapp' ? droppedBy(fnl, 'whatsapp')
                              : droppedBy(fnl, 'phone') + droppedBy(fnl, 'whatsapp');
    const srcLabel = src === 'phone' ? '📞 bellen' : src === 'whatsapp' ? '💬 WhatsApp' : 'alle bronnen';

    // Last-stage index — stays in sync when we add/remove stages
    const LAST = STAGES.length - 1;

    let totalsHtml;
    if (isCompare) {
      const finalA = activeA[LAST], baseA = activeA[0];
      const finalB = activeB[LAST], baseB = activeB[0];
      const convA = baseA > 0 ? (finalA / baseA * 100) : 0;
      const convB = baseB > 0 ? (finalB / baseB * 100) : 0;
      const dropA = sumDropped(funnel);
      const dropB = sumDropped(compareData.funnel);
      const pair = (tf, num, sub) => `<div class="lc-tot-pair" data-tf="${tf}">
        <span class="tf-badge">${tf}</span>
        <span class="tot-num">${num}</span>
        <span class="tot-sub">${sub}</span>
      </div>`;
      totalsHtml = `
        <div class="lc-tot-card good is-compare">
          <div class="label">Totale conversie — ${srcLabel}</div>
          ${pair('A', convA.toFixed(1).replace('.', ',') + '%', '· ' + finalA + ' van ' + baseA)}
          ${pair('B', convB.toFixed(1).replace('.', ',') + '%', '· ' + finalB + ' van ' + baseB)}
          <div style="text-align:center;margin-top:6px;">${_lcDeltaPill(convB, convA, {isPct:true})}</div>
        </div>
        <div class="lc-tot-card bad is-compare">
          <div class="label">Totaal afgehaakt — ${srcLabel}</div>
          ${pair('A', dropA.toLocaleString('nl-NL'), '')}
          ${pair('B', dropB.toLocaleString('nl-NL'), '')}
          <div style="text-align:center;margin-top:6px;">${_lcDeltaPill(dropB, dropA, {lowerIsBetter:true})}</div>
        </div>`;
    } else {
      const finalConv = activeA[0] > 0 ? (activeA[LAST] / activeA[0] * 100) : 0;
      const totalDropped = sumDropped(funnel);
      totalsHtml = `
        <div class="lc-tot-card good">
          <div class="label">Totale conversie — ${srcLabel}</div>
          <div class="value">${finalConv.toFixed(1).replace('.', ',')}%
            <span style="font-size:12px;color:var(--t3);font-weight:700;letter-spacing:0;">
              · ${activeA[LAST].toLocaleString('nl-NL')} van ${activeA[0].toLocaleString('nl-NL')}
            </span>
          </div>
        </div>
        <div class="lc-tot-card bad">
          <div class="label">Totaal afgehaakt — ${srcLabel}</div>
          <div class="value">${totalDropped.toLocaleString('nl-NL')}</div>
        </div>`;
    }

    // Broken-axis slashes + vertical guides
    const brkX = xs[0] + colW * 0.42;
    const brkY = (stage0Y + stage1Top) / 2;
    const slashes = `
      <line class="lc-break-slash" x1="${brkX - 8}" y1="${brkY + 8}" x2="${brkX + 8}" y2="${brkY - 8}" />
      <line class="lc-break-slash" x1="${brkX + 4}" y1="${brkY + 8}" x2="${brkX + 20}" y2="${brkY - 8}" />`;
    const vGuides = xs.map(x =>
      `<line class="lc-vline" x1="${x.toFixed(1)}" y1="${stage1Top}" x2="${x.toFixed(1)}" y2="${bottomY}" />`
    ).join('');

    // ── Lines + points (A always, B in compare with dashed) ──
    const linesSvg = [
      `<path class="lc-line lc-line-phone" d="${buildPath(aPh)}" />`,
      `<path class="lc-line lc-line-wa"    d="${buildPath(aWa)}" />`,
      buildPoints(aPh, 'lc-pt-phone'),
      buildPoints(aWa, 'lc-pt-wa'),
    ];
    if (isCompare) {
      linesSvg.push(`<path class="lc-line lc-line-phone lc-line-tfb" d="${buildPath(bPh)}" />`);
      linesSvg.push(`<path class="lc-line lc-line-wa    lc-line-tfb" d="${buildPath(bWa)}" />`);
      linesSvg.push(buildPoints(bPh, 'lc-pt-phone lc-pt-tfb'));
      linesSvg.push(buildPoints(bWa, 'lc-pt-wa lc-pt-tfb'));
    }

    const legendHtml = isCompare
      ? `<span><span class="lc-legend-dot" style="background:#60a5fa;"></span>📞 Bellen</span>
         <span><span class="lc-legend-dot" style="background:#34d399;"></span>💬 WhatsApp</span>
         <span style="opacity:0.6;">·</span>
         <span><span style="display:inline-block;width:22px;height:2px;background:var(--text);vertical-align:middle;margin-right:5px;"></span>solid = A</span>
         <span><span style="display:inline-block;width:22px;height:2px;background:repeating-linear-gradient(90deg,var(--text) 0 4px,transparent 4px 7px);vertical-align:middle;margin-right:5px;"></span>dashed = B</span>`
      : `<span><span class="lc-legend-dot" style="background:#60a5fa;"></span>📞 Bellen</span>
         <span><span class="lc-legend-dot" style="background:#34d399;"></span>💬 WhatsApp</span>`;

    el.innerHTML = `
      <div class="lc-funnel" data-source="${src}" data-mode="${isCompare ? 'compare' : 'single'}">
        <div class="lc-chart-wrap">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="lc-svg" style="height:260px;">
            ${vGuides}
            <line class="lc-baseline" x1="${xs[0]}" y1="${bottomY}" x2="${xs[xs.length-1]}" y2="${bottomY}" />
            ${slashes}
            ${linesSvg.join('')}
          </svg>
        </div>
        <div class="lc-axis-row" style="grid-template-columns: repeat(${STAGES.length}, 1fr);">${stageRow}</div>
        <div class="lc-legend">${legendHtml}</div>
        <div class="lc-totals ${isCompare ? 'is-compare' : ''}">${totalsHtml}</div>
      </div>
    `;
    _attachStageFocus(el.querySelector('.lc-funnel'), xs);
  }

  // ── Bridge between Warm-leads chart and Demo chart ─────────────────────
  // Two bridges: (1) Forum ingevuld → Meeting ingepland, (2) Meeting → Show.
  // Both are rendered as a single .demo-bridge stack (the visual matches the
  // old single-bridge style so we keep the CSS).
  // Reads from `data.bridges` (returned by sales_kpi_stats) which is keyed by
  // 'phone'|'whatsapp'|'all' → {forum_to_meeting, meeting_to_show}.
  function _renderForumToDemoBridge(elId, _warmFunnel, _demoFunnel, compareData, bridgesA, bridgesB) {
    const el = document.getElementById(elId);
    if (!el) return;
    const src = (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all') || 'all';
    const isCompare = !!compareData;
    const pickBridge = (br) => (br && br[src]) ? br[src] : (br && br.all) || {};
    const a = pickBridge(bridgesA);
    const f2m = a.forum_to_meeting || {a:0,b:0,conv_pct:0,loss:0};
    const m2s = a.meeting_to_show  || {a:0,b:0,conv_pct:0,loss:0};

    const bridgeCell = (n, lbl, loss=false) => `<div class="br-cell${loss?' br-loss':''}">
      <div class="br-num">${(Number(n)||0).toLocaleString('nl-NL')}</div>
      <div class="br-lbl">${lbl}</div>
    </div>`;
    const arrow = (pct) => `<div class="br-arrow"><div class="line">→</div><div class="pct">${(Number(pct)||0).toFixed(1).replace('.', ',')}%</div></div>`;

    if (!isCompare) {
      el.innerHTML = `
        <div class="demo-bridge">
          ${bridgeCell(f2m.a, '📝 Forum ingevuld')}
          ${arrow(f2m.conv_pct)}
          ${bridgeCell(f2m.b, '📅 Meeting ingepland')}
          ${arrow(m2s.conv_pct)}
          ${bridgeCell(m2s.b, '✅ Show')}
          ${bridgeCell(f2m.loss + m2s.loss, 'Niet door (totaal)', true)}
        </div>`;
      return;
    }
    const b = pickBridge(bridgesB);
    const bf2m = b.forum_to_meeting || {a:0,b:0,conv_pct:0,loss:0};
    const bm2s = b.meeting_to_show  || {a:0,b:0,conv_pct:0,loss:0};

    const rowFor = (tf, x, y) => `<div class="br-row" data-tf="${tf}">
      <div class="br-tf-chip">${tf}</div>
      <div class="br-mini"><div class="br-mini-num">${(x.a||0).toLocaleString('nl-NL')}</div><div class="br-mini-lbl">📝 Ingevuld</div></div>
      <div style="text-align:center;"><div style="font-size:13px;color:#60a5fa;font-weight:900;">→</div><div style="font-size:10px;color:#10b981;font-weight:900;">${(x.conv_pct||0).toFixed(1).replace('.', ',')}%</div></div>
      <div class="br-mini"><div class="br-mini-num">${(x.b||0).toLocaleString('nl-NL')}</div><div class="br-mini-lbl">📅 Meeting</div></div>
      <div style="text-align:center;"><div style="font-size:13px;color:#60a5fa;font-weight:900;">→</div><div style="font-size:10px;color:#10b981;font-weight:900;">${(y.conv_pct||0).toFixed(1).replace('.', ',')}%</div></div>
      <div class="br-mini"><div class="br-mini-num">${(y.b||0).toLocaleString('nl-NL')}</div><div class="br-mini-lbl">✅ Show</div></div>
    </div>`;
    el.innerHTML = `
      <div class="demo-bridge is-compare">
        ${rowFor('A', f2m, m2s)}
        ${rowFor('B', bf2m, bm2s)}
        <div style="display:flex;justify-content:center;gap:14px;padding-top:4px;font-size:10px;color:var(--t3);font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">
          <span>Forum→Meeting B vs A: ${_lcDeltaPill(bf2m.conv_pct||0, f2m.conv_pct||0, {isPct:true})}</span>
          <span>Meeting→Show B vs A: ${_lcDeltaPill(bm2s.conv_pct||0, m2s.conv_pct||0, {isPct:true})}</span>
        </div>
      </div>`;
  }

  // ── Demo funnel as a line chart with points ────────────────────────────
  // Stages (cumulative — each stage includes that stage AND every later one):
  //   Show op meeting → Geclosed → Aanbetaling → Volledig betaald
  // Show replaces the old Geleverd + Gezien stages (demos are now shown during
  // the Calendly meeting). No-show + Afgehaakt are parallel buckets shown as
  // side chips, not in the monotonic chain.
  function _renderDemoLineChart(elId, demoFunnel, source, _labels, compareData) {
    const el = document.getElementById(elId);
    if (!el) return;

    const isCompare = !!compareData;
    const STAGES = [
      { key:'moet_gebouwd',     label:'Moet gebouwd'     },
      { key:'klaar',            label:'Demo klaar'       },
      { key:'show',             label:'Show'             },
      { key:'geclosed',         label:'Geclosed'         },
      { key:'aanbetaling',      label:'Aanbetaling'      },
      { key:'volledig_betaald', label:'Volledig betaald' },
    ];
    const ORDER = STAGES.map(s => s.key);
    // Volledige demo-volgorde incl. de 4 tussenstappen tussen aanbetaling en
    // volledig_betaald. De chart toont alleen de 6 hoofdkolommen (STAGES), maar
    // de cumulatieve som telt clients in de tussenstappen mee zodat de
    // geclosed/aanbetaling-buckets niet ondertellen.
    const FULL_ORDER = ['moet_gebouwd','klaar','show','geclosed','aanbetaling','vragenlijst_gestuurd','contract_gestuurd','getekend','afbouwen','volledig_betaald'];

    // Cumulative count per stage: stage i = sum of clients in stage i AND every
    // later stage (including the hidden intermediate stages).
    const computeBucket = (fnl, bucketKey) => {
      const f = (fnl || {})[bucketKey] || {};
      return ORDER.map((key) => {
        const start = FULL_ORDER.indexOf(key);
        let s = 0;
        for (let j = (start < 0 ? FULL_ORDER.length : start); j < FULL_ORDER.length; j++) s += Number(f[FULL_ORDER[j]]) || 0;
        return s;
      });
    };

    const aPh = computeBucket(demoFunnel, 'phone');
    const aWa = computeBucket(demoFunnel, 'whatsapp');
    const aAll = aPh.map((v, i) => v + aWa[i]);
    const bPh = isCompare ? computeBucket(compareData.demoFunnel, 'phone')    : null;
    const bWa = isCompare ? computeBucket(compareData.demoFunnel, 'whatsapp') : null;
    const bAll = isCompare ? bPh.map((v, i) => v + bWa[i]) : null;

    const src = (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all') || 'all';
    const pickSrc = (ph, wa, all) => src === 'phone' ? ph : (src === 'whatsapp' ? wa : all);
    const activeA = pickSrc(aPh, aWa, aAll);
    const activeB = isCompare ? pickSrc(bPh, bWa, bAll) : null;

    const emptyA = activeA.every(v => v === 0);
    const emptyB = isCompare ? activeB.every(v => v === 0) : true;
    if (emptyA && emptyB) {
      el.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Nog geen demo-data in deze periode.</div>';
      return;
    }

    // Benaderd totals (per series) so per-stage labels show % of prospect.
    const benaderdFor = (srcObj, b) => Number(((srcObj || {})[b] || {}).benaderd) || 0;
    const sumBen = (srcObj) => src === 'phone'    ? benaderdFor(srcObj, 'phone')
                              : src === 'whatsapp' ? benaderdFor(srcObj, 'whatsapp')
                              : benaderdFor(srcObj, 'phone') + benaderdFor(srcObj, 'whatsapp');
    const benA = sumBen(source);
    const benB = isCompare ? sumBen(compareData.source) : 0;

    // ── SVG geometry ──
    const W = 1000, H = 280;
    const mT = 26, mB = 26;
    const colW = W / STAGES.length;
    const xs = STAGES.map((_, i) => (i + 0.5) * colW);
    const topY = mT + 4;
    const bottomY = H - mB;
    // Anchor stage-0 (Geleverd) at the top by scaling against the max
    // stage-0 value across every visible series.
    const restMax = Math.max(1, aPh[0], aWa[0], ...(isCompare ? [bPh[0], bWa[0]] : []));
    const yFor = (i, v) => bottomY - (v / restMax) * (bottomY - topY);

    const buildPath = (data) => 'M ' + data.map((v, i) =>
      `${xs[i].toFixed(1)} ${yFor(i, v).toFixed(1)}`
    ).join(' L ');
    const buildPoints = (data, cls) => data.map((v, i) =>
      `<circle class="lc-pt ${cls}" cx="${xs[i].toFixed(1)}" cy="${yFor(i, v).toFixed(1)}" r="5.5" />`
    ).join('');

    // ── Stage row ──
    const stageRow = STAGES.map((st, i) => {
      if (isCompare) {
        const ca = activeA[i], cb = activeB[i];
        const pa = i > 0 ? activeA[i - 1] : 0;
        const pb = i > 0 ? activeB[i - 1] : 0;
        const dropA = i > 0 && pa > 0 ? Math.round((pa - ca) / pa * 100) : null;
        const dropB = i > 0 && pb > 0 ? Math.round((pb - cb) / pb * 100) : null;
        const rowFor = (tf, c, drop) => `<div class="lc-tf-row" data-tf="${tf}">
          <span class="lc-tf-badge">${tf}</span>
          <span class="lc-tf-cnt">${c.toLocaleString('nl-NL')}</span>
          <span class="lc-tf-drop ${drop === null ? '' : (drop > 0 ? 'neg' : '')}">${drop === null ? 'demo start' : '−' + drop + '%'}</span>
        </div>`;
        return `<div class="lc-stage-meta is-compare">
          <div class="lc-stage-name">${esc(st.label)}</div>
          ${rowFor('A', ca, dropA)}
          ${rowFor('B', cb, dropB)}
          ${_lcDeltaPill(cb, ca)}
        </div>`;
      }
      const cnt  = activeA[i];
      const prev = i > 0 ? activeA[i - 1] : 0;
      const drop = (i > 0 && prev > 0) ? Math.round((prev - cnt) / prev * 100) : null;
      const conv = benA > 0 ? (cnt / benA * 100) : 0;
      const dropTxt = drop === null ? 'demo start'
                    : drop === 0    ? '0%'
                    : drop > 0      ? '−' + drop + '%'
                    : '+' + (-drop) + '%';
      const dropCls = drop === null ? 'zero'
                    : drop === 0    ? 'zero'
                    : drop > 0      ? 'neg'
                    : 'pos';
      const convTxt = conv.toFixed(1).replace('.', ',') + '% van benaderd';
      return `<div class="lc-stage-meta">
        <div class="lc-stage-name">${esc(st.label)}</div>
        <div class="lc-stage-count">${cnt.toLocaleString('nl-NL')}</div>
        <div class="lc-stage-drop ${dropCls}">${dropTxt}</div>
        <div class="lc-stage-conv">${convTxt}</div>
      </div>`;
    }).join('');

    // ── Totals ──
    const droppedBy = (fnl, b) => Number(((fnl || {})[b] || {}).afgehaakt) || 0;
    const sumDropped = (fnl) => src === 'phone'    ? droppedBy(fnl, 'phone')
                              : src === 'whatsapp' ? droppedBy(fnl, 'whatsapp')
                              : droppedBy(fnl, 'phone') + droppedBy(fnl, 'whatsapp');
    const srcLabel = src === 'phone' ? '📞 bellen' : src === 'whatsapp' ? '💬 WhatsApp' : 'alle bronnen';

    let totalsHtml;
    if (isCompare) {
      const finalA = activeA[activeA.length - 1];
      const finalB = activeB[activeB.length - 1];
      const convA = benA > 0 ? (finalA / benA * 100) : 0;
      const convB = benB > 0 ? (finalB / benB * 100) : 0;
      const dropA = sumDropped(demoFunnel);
      const dropB = sumDropped(compareData.demoFunnel);
      const pair = (tf, num, sub) => `<div class="lc-tot-pair" data-tf="${tf}">
        <span class="tf-badge">${tf}</span>
        <span class="tot-num">${num}</span>
        <span class="tot-sub">${sub}</span>
      </div>`;
      totalsHtml = `
        <div class="lc-tot-card good is-compare">
          <div class="label">Volledig betaald — ${srcLabel}</div>
          ${pair('A', convA.toFixed(1).replace('.', ',') + '%', '· ' + finalA + ' van ' + benA + ' ben.')}
          ${pair('B', convB.toFixed(1).replace('.', ',') + '%', '· ' + finalB + ' van ' + benB + ' ben.')}
          <div style="text-align:center;margin-top:6px;">${_lcDeltaPill(convB, convA, {isPct:true})}</div>
        </div>
        <div class="lc-tot-card bad is-compare">
          <div class="label">Demo's afgehaakt — ${srcLabel}</div>
          ${pair('A', dropA.toLocaleString('nl-NL'), '')}
          ${pair('B', dropB.toLocaleString('nl-NL'), '')}
          <div style="text-align:center;margin-top:6px;">${_lcDeltaPill(dropB, dropA, {lowerIsBetter:true})}</div>
        </div>`;
    } else {
      const finalCnt = activeA[activeA.length - 1];
      const finalConv = benA > 0 ? (finalCnt / benA * 100) : 0;
      const totalDropped = sumDropped(demoFunnel);
      totalsHtml = `
        <div class="lc-tot-card good">
          <div class="label">Volledig betaald — ${srcLabel}</div>
          <div class="value">${finalConv.toFixed(1).replace('.', ',')}%
            <span style="font-size:12px;color:var(--t3);font-weight:700;letter-spacing:0;">
              · ${finalCnt.toLocaleString('nl-NL')} van ${benA.toLocaleString('nl-NL')} benaderd
            </span>
          </div>
        </div>
        <div class="lc-tot-card bad">
          <div class="label">Demo's afgehaakt — ${srcLabel}</div>
          <div class="value">${totalDropped.toLocaleString('nl-NL')}</div>
        </div>`;
    }

    const vGuides = xs.map(x =>
      `<line class="lc-vline" x1="${x.toFixed(1)}" y1="${topY}" x2="${x.toFixed(1)}" y2="${bottomY}" />`
    ).join('');

    const linesSvg = [
      `<path class="lc-line lc-line-phone" d="${buildPath(aPh)}" />`,
      `<path class="lc-line lc-line-wa"    d="${buildPath(aWa)}" />`,
      buildPoints(aPh, 'lc-pt-phone'),
      buildPoints(aWa, 'lc-pt-wa'),
    ];
    if (isCompare) {
      linesSvg.push(`<path class="lc-line lc-line-phone lc-line-tfb" d="${buildPath(bPh)}" />`);
      linesSvg.push(`<path class="lc-line lc-line-wa    lc-line-tfb" d="${buildPath(bWa)}" />`);
      linesSvg.push(buildPoints(bPh, 'lc-pt-phone lc-pt-tfb'));
      linesSvg.push(buildPoints(bWa, 'lc-pt-wa lc-pt-tfb'));
    }

    const legendHtml = isCompare
      ? `<span><span class="lc-legend-dot" style="background:#60a5fa;"></span>📞 Bellen</span>
         <span><span class="lc-legend-dot" style="background:#34d399;"></span>💬 WhatsApp</span>
         <span style="opacity:0.6;">·</span>
         <span><span style="display:inline-block;width:22px;height:2px;background:var(--text);vertical-align:middle;margin-right:5px;"></span>solid = A</span>
         <span><span style="display:inline-block;width:22px;height:2px;background:repeating-linear-gradient(90deg,var(--text) 0 4px,transparent 4px 7px);vertical-align:middle;margin-right:5px;"></span>dashed = B</span>`
      : `<span><span class="lc-legend-dot" style="background:#60a5fa;"></span>📞 Bellen</span>
         <span><span class="lc-legend-dot" style="background:#34d399;"></span>💬 WhatsApp</span>`;

    el.innerHTML = `
      <div class="lc-funnel" data-source="${src}" data-mode="${isCompare ? 'compare' : 'single'}">
        <div class="lc-chart-wrap">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="lc-svg" style="height:260px;">
            ${vGuides}
            <line class="lc-baseline" x1="${xs[0]}" y1="${bottomY}" x2="${xs[xs.length-1]}" y2="${bottomY}" />
            ${linesSvg.join('')}
          </svg>
        </div>
        <div class="lc-axis-row" style="grid-template-columns: repeat(${STAGES.length}, 1fr);">${stageRow}</div>
        <div class="lc-legend">${legendHtml}</div>
        <div class="lc-totals ${isCompare ? 'is-compare' : ''}">${totalsHtml}</div>
      </div>
    `;
    _attachStageFocus(el.querySelector('.lc-funnel'), xs);
  }

  // ── Meeting funnel as a line chart (KPI Card 1.5) ──────────────────────
  // Stages: Link gestuurd → Meeting ingepland → Show (cumulative). No-show +
  // afgehaakt sit as side chips, never part of the monotonic chain.
  function _renderMeetingLineChart(elId, meetingFunnel, source, _labels, compareData) {
    const el = document.getElementById(elId); if (!el) return;
    const isCompare = !!compareData;
    const STAGES = [
      { key:'link_sent', label:'Link gestuurd' },
      { key:'scheduled', label:'Meeting ingepland' },
      { key:'show',      label:'Show' },
    ];
    const ORDER = STAGES.map(s => s.key);
    // Cumulative: stage i = i + later. scheduled includes show + no_show_followup; show is terminal.
    const cumKeys = {
      link_sent: ['link_sent','scheduled','show','no_show','no_show_followup'],
      scheduled: ['scheduled','show','no_show','no_show_followup'],
      show:      ['show'],
    };
    const compute = (fnl, bucket) => {
      const f = (fnl || {})[bucket] || {};
      return ORDER.map(k => cumKeys[k].reduce((s, x) => s + (Number(f[x]) || 0), 0));
    };
    const src = (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all') || 'all';
    const pickSrc = (ph, wa, all) => src === 'phone' ? ph : (src === 'whatsapp' ? wa : all);
    const aPh = compute(meetingFunnel, 'phone');
    const aWa = compute(meetingFunnel, 'whatsapp');
    const aAll = aPh.map((v, i) => v + aWa[i]);
    const activeA = pickSrc(aPh, aWa, aAll);

    // Side chips: no_show + afgehaakt (terminal/recovery buckets)
    const buck = (meetingFunnel || {})[src === 'phone' ? 'phone' : src === 'whatsapp' ? 'whatsapp' : 'all'] || {};
    const noShow = Number(buck.no_show || 0) + Number(buck.no_show_followup || 0);
    const afgeh  = Number(buck.afgehaakt || 0);

    const emptyA = activeA.every(v => v === 0);
    if (emptyA && !isCompare) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Nog geen meeting-data in dit tijdvak</div>`;
      return;
    }
    const stageRow = STAGES.map((s, i) => {
      const pct = activeA[0] ? (activeA[i] / activeA[0] * 100) : 0;
      return `<div class="lc-axis-cell"><div class="lc-axis-num">${activeA[i].toLocaleString('nl-NL')}</div><div class="lc-axis-lbl">${s.label}</div><div class="lc-axis-pct">${pct.toFixed(1).replace('.', ',')}%</div></div>`;
    }).join('');
    const sideChips = `<div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
      <span class="meeting-btn meeting-orange" style="cursor:default;pointer-events:none;"><span class="meeting-dot"></span>🚫 No-show <strong style="margin-left:4px;">${noShow}</strong></span>
      <span class="meeting-btn meeting-red"    style="cursor:default;pointer-events:none;"><span class="meeting-dot"></span>❌ Afgehaakt <strong style="margin-left:4px;">${afgeh}</strong></span>
    </div>`;
    el.innerHTML = `
      <div class="lc-funnel">
        <div class="lc-axis-row" style="grid-template-columns: repeat(${STAGES.length}, 1fr);">${stageRow}</div>
        ${sideChips}
      </div>`;
  }

  // ── Volledige funnel: Benaderd → Volledig betaald (branched line chart) ──
  // Layout: 11 columns. After "Forum + meeting gestuurd" (col 4) the chart
  // splits into two parallel sub-paths that both rejoin at "Show op meeting":
  //   upper: Forum gezien (col 5)   → Forum ingevuld (col 6) → Show (col 7)
  //   lower: Meeting ingepland (col 5.5, between upper nodes)  → Show (col 7)
  // The 5.5 fractional column sits Meeting ingepland's dot + label between
  // Forum gezien and Forum ingevuld so the labels never collide horizontally
  // (the previous shared col-5 X position made them overlap into garbled text).
  // Each dot is clickable → opens the detail modal with stage-specific data.
  // Line + area colour switches per source toggle: green for WhatsApp.
  function _renderFullFunnelLineChart(elId, data, compareData) {
    const el = document.getElementById(elId);
    if (!el) return;

    const src = (typeof _kpiSource !== 'undefined' ? _kpiSource : 'all') || 'all';

    // Compute the 12-stage layout for any kpi-stats payload (used for both A and B)
    function _buildStages(payload) {
      if (!payload) return null;
      const wf = payload.warm_leads_funnel || {};
      const mf = payload.meeting_funnel || {};
      const df = payload.demo_funnel || {};
      const sc = payload.source_conversion || {};
      const pick = (fn) => src === 'phone'    ? fn('phone')
                         : src === 'whatsapp' ? fn('whatsapp')
                         : src === 'extern'   ? fn('extern')
                         : fn('phone') + fn('whatsapp') + fn('extern');
      const WARM_ORDER = ['forum_nog_sturen','forum_gestuurd','forum_gezien','forum_ingevuld','gesloten'];
      const cumWarm = (key) => {
        const idx = WARM_ORDER.indexOf(key);
        if (idx < 0) return 0;
        return pick(b => WARM_ORDER.slice(idx).reduce((s, k) => s + (Number((wf[b] || {})[k]) || 0), 0));
      };
      const MEET_ORDER = ['link_sent','scheduled','show','no_show','no_show_followup'];
      const cumMeeting = (key) => {
        const idx = MEET_ORDER.indexOf(key);
        if (idx < 0) return 0;
        return pick(b => MEET_ORDER.slice(idx).reduce((s, k) => s + (Number((mf[b] || {})[k]) || 0), 0));
      };
      // Volgorde = cumulatieve funnel-math. De 4 tussenstappen tussen aanbetaling
      // en volledig_betaald moeten meetellen, anders vallen clients daar buiten de
      // aanbetaling/geclosed cumulatieven (undercount).
      const DEMO_ORDER = ['moet_gebouwd','klaar','show','geclosed','aanbetaling','vragenlijst_gestuurd','contract_gestuurd','getekend','afbouwen','volledig_betaald'];
      const cumDemo = (key) => {
        const idx = DEMO_ORDER.indexOf(key);
        if (idx < 0) return 0;
        return pick(b => DEMO_ORDER.slice(idx).reduce((s, k) => s + (Number((df[b] || {})[k]) || 0), 0));
      };
      const benaderd        = pick(b => Number((sc[b] || {}).benaderd)   || 0);
      const warmsAll        = pick(b => Number((sc[b] || {}).warm_leads) || 0);
      const callbackCount   = pick(b => (Number((wf[b] || {}).ik_bel_terug) || 0) + (Number((wf[b] || {}).zij_bellen_terug) || 0));
      const realWarms       = Math.max(0, warmsAll - callbackCount);
      const formMeetGestuurd= Math.max(cumWarm('forum_gestuurd'), cumMeeting('link_sent'));
      return [
        { key: 'benaderd',          label: 'Benaderd',                 col: 0, path: 'main',  count: benaderd },
        { key: 'warm_callback',     label: 'Warm leads + callback',    col: 1, path: 'main',  count: warmsAll },
        { key: 'real_warm',         label: 'Real warm leads',          col: 2, path: 'main',  count: realWarms },
        { key: 'forum_nog_sturen',  label: 'Forum nog sturen',         col: 3, path: 'main',  count: cumWarm('forum_nog_sturen') },
        { key: 'form_meeting_sent', label: 'Forum + meeting gestuurd', col: 4, path: 'main',  count: formMeetGestuurd },
        { key: 'forum_gezien',      label: 'Forum gezien',             col: 5, path: 'upper', count: cumWarm('forum_gezien') },
        { key: 'forum_ingevuld',    label: 'Forum ingevuld',           col: 6, path: 'upper', count: cumWarm('forum_ingevuld') },
        { key: 'meeting_ingepland', label: 'Meeting ingepland',        col: 5.5, path: 'lower', count: cumMeeting('scheduled') },
        { key: 'show',              label: 'Show op meeting',          col: 7, path: 'main',  count: Math.max(cumMeeting('show'), cumDemo('show')) },
        { key: 'geclosed',          label: 'Geclosed',                 col: 8, path: 'main',  count: cumDemo('geclosed') },
        { key: 'aanbetaling',       label: 'Aanbetaling',              col: 9, path: 'main',  count: cumDemo('aanbetaling') },
        { key: 'volledig_betaald',  label: 'Volledig betaald',         col: 10, path: 'main', count: cumDemo('volledig_betaald') },
      ];
    }

    const STAGES   = _buildStages(data);
    const STAGES_B = compareData ? _buildStages(compareData) : null;
    const isCompare = !!STAGES_B;

    const benaderdCount = STAGES[0].count;
    const finalCount    = STAGES[STAGES.length - 1].count;
    const finalPct      = benaderdCount > 0 ? (finalCount / benaderdCount * 100) : 0;
    const benaderdCountB = STAGES_B ? STAGES_B[0].count : 0;
    const finalCountB    = STAGES_B ? STAGES_B[STAGES_B.length - 1].count : 0;
    const finalPctB      = benaderdCountB > 0 ? (finalCountB / benaderdCountB * 100) : 0;

    if (benaderdCount === 0 && benaderdCountB === 0) {
      el.innerHTML = `<div class="empty-state">Nog niemand benaderd in dit tijdvak — kies een andere periode.</div>`;
      return;
    }

    // ── SVG geometry ─────────────────────────────────────────────────
    const N_COLS = 11;
    const W = 1200, H = 400;
    // padB has room for a 2-line label band under each dot (~30px of headroom
    // + 22px of text). padT shrinks again now that upper labels share the
    // single bottom band instead of floating above their dots.
    const padL = 40, padR = 28, padT = 36, padB = 130;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    // Baselines: Warm leads + callback (col 1) is the 100% top of the chart.
    // Falls back to Benaderd if there are no warms yet. Per-series so A and B
    // both start at 100% and slope by their own relative conversion rates.
    const baselineA = (STAGES[1] && STAGES[1].count) || STAGES[0].count || 1;
    const baselineB = STAGES_B ? ((STAGES_B[1] && STAGES_B[1].count) || STAGES_B[0].count || 1) : 1;
    const xFor = (col) => padL + (col / (N_COLS - 1)) * innerW;
    // yFor takes a base param so the same function works for A and B.
    // Math.min(1, ...) clamps Benaderd (which is ABOVE 100% of warm+callback)
    // back to the top of the chart.
    const yFor = (v, base) => padT + (1 - Math.max(0, Math.min(1, v / base))) * innerH;

    // Every dot lands at its TRUE Y based on actual count — no cosmetic
    // ±22 offset on the upper/lower branches. A 35% point CANNOT visually
    // sit lower than a 28% point. If two branched stages happen to have
    // identical counts their dots overlap, which is the truth.
    const yForStage = (s) => yFor(s.count, baselineA);

    // Build the four poly-line segments:
    //  1. Main start: cols 0..4 (Benaderd → Forum + meeting gestuurd)
    //  2. Upper branch: col 4 → cols 5,6 → col 7
    //  3. Lower branch: col 4 → col 5 → col 7  (straight line skip through col 6)
    //  4. Main tail: cols 7..10 (Show → Volledig betaald)
    const colToStage = {};
    STAGES.forEach(s => { colToStage[`${s.col}:${s.path}`] = s; });
    const stageMain = (col) => STAGES.find(s => s.col === col && s.path === 'main');

    const makePath = (pts) => pts.map((p, i) => (i === 0 ? 'M' : 'L') + ` ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');

    // Main-start: line BEGINS at col 1 (Warm leads + callback) per Julian's
    // spec. Benaderd (col 0) is rendered as a standalone dot + count BELOW.
    const startPts = [1,2,3,4].map(c => {
      const s = stageMain(c);
      return [xFor(s.col), yForStage(s)];
    });

    const showStage = stageMain(7);
    const splitOrigin = [xFor(4), yForStage(stageMain(4))];
    const showPoint   = [xFor(7), yForStage(showStage)];

    // Upper branch: split origin → forum_gezien → forum_ingevuld → Show
    const fg = STAGES.find(s => s.key === 'forum_gezien');
    const fi = STAGES.find(s => s.key === 'forum_ingevuld');
    const upperPts = [splitOrigin, [xFor(fg.col), yForStage(fg)], [xFor(fi.col), yForStage(fi)], showPoint];

    // Lower branch: split origin → meeting_ingepland → Show
    const mi = STAGES.find(s => s.key === 'meeting_ingepland');
    const lowerPts = [splitOrigin, [xFor(mi.col), yForStage(mi)], showPoint];

    // Main tail (cols 7..10)
    const tailPts = [7,8,9,10].map(c => {
      const s = stageMain(c);
      return [xFor(s.col), yForStage(s)];
    });

    const pathStart = makePath(startPts);
    const pathUpper = makePath(upperPts);
    const pathLower = makePath(lowerPts);
    const pathTail  = makePath(tailPts);

    // Closed area under the main spine (start + tail) for visual depth.
    // Begins at col 1 (Warm+callback) — Benaderd is intentionally outside it.
    const areaSpine = `${makePath([...startPts, ...tailPts])} L ${xFor(10).toFixed(1)} ${(padT + innerH).toFixed(1)} L ${xFor(1).toFixed(1)} ${(padT + innerH).toFixed(1)} Z`;

    // ── COMPARE MODE: build the same 4 path-segments for Panel B ──────
    // B uses its OWN baseline (B's warm+callback) so both lines start at
    // 100% — direct comparison of conversion shape rather than magnitudes.
    // Same truthful Y rule: no ±22 cosmetic offset.
    let pathStartB = '', pathUpperB = '', pathLowerB = '', pathTailB = '';
    const yForStageB = (s) => yFor(s.count, baselineB);
    if (isCompare) {
      const stageMainB = (col) => STAGES_B.find(s => s.col === col && s.path === 'main');
      const fgB = STAGES_B.find(s => s.key === 'forum_gezien');
      const fiB = STAGES_B.find(s => s.key === 'forum_ingevuld');
      const miB = STAGES_B.find(s => s.key === 'meeting_ingepland');
      // B line also begins at col 1 (Warm+callback)
      const startPtsB = [1,2,3,4].map(c => { const s = stageMainB(c); return [xFor(s.col), yForStageB(s)]; });
      const splitOriginB = [xFor(4), yForStageB(stageMainB(4))];
      const showPointB   = [xFor(7), yForStageB(stageMainB(7))];
      const upperPtsB = [splitOriginB, [xFor(fgB.col), yForStageB(fgB)], [xFor(fiB.col), yForStageB(fiB)], showPointB];
      const lowerPtsB = [splitOriginB, [xFor(miB.col), yForStageB(miB)], showPointB];
      const tailPtsB  = [7,8,9,10].map(c => { const s = stageMainB(c); return [xFor(s.col), yForStageB(s)]; });
      pathStartB = makePath(startPtsB);
      pathUpperB = makePath(upperPtsB);
      pathLowerB = makePath(lowerPtsB);
      pathTailB  = makePath(tailPtsB);
    }

    // ── Source colour + gradient id ──────────────────────────────────
    const lineColor    = src === 'whatsapp' ? '#10b981'
                       : src === 'extern'   ? '#a855f7'
                       : '#60a5fa';   // phone or 'all' → blue
    const lineColorDim = src === 'whatsapp' ? '#0d9968'
                       : src === 'extern'   ? '#8b5cf6'
                       : '#3b82f6';
    const gradId = `ff-grad-${elId}`;

    // ── Grid + Y-axis labels (100/75/50/25/0%) ───────────────────────
    // In compare mode the two series use different baselines, so showing
    // raw counts on the grid would be misleading — switch to % labels.
    const gridLines = [1, 0.75, 0.5, 0.25, 0].map(frac => {
      const y = padT + (1 - frac) * innerH;
      const lbl = isCompare
        ? `${Math.round(frac * 100)}%`
        : Math.round(baselineA * frac).toLocaleString('nl-NL');
      return `<line class="ff-grid" x1="${padL}" x2="${padL + innerW}" y1="${y}" y2="${y}"/>
              <text x="${padL - 6}" y="${y + 3}" text-anchor="end" style="font-size:9.5px;fill:var(--t4);font-weight:700;">${lbl}</text>`;
    }).join('');

    // ── Stage dots + labels + hit-areas (each clickable) ──────────────
    // Label vertical layout:
    //   • upper branch: ABOVE its dot — sits in the new top padding band
    //   • lower branch: BELOW its pct — sits below the chart, row 2
    //   • main path: staggered 2-row band BELOW the chart (row 0 / row 1)
    // Multi-line labels for the long stage names so the labels under each
    // dot stay readable without horizontal crowding.
    const LABEL_LINES = {
      benaderd:           ['Benaderd'],
      warm_callback:      ['Warm leads', '+ callback'],
      real_warm:          ['Real warm', 'leads'],
      forum_nog_sturen:   ['Forum nog', 'sturen'],
      form_meeting_sent:  ['Forum + meeting', 'gestuurd'],
      forum_gezien:       ['Forum gezien'],
      forum_ingevuld:     ['Forum ingevuld'],
      meeting_ingepland:  ['Meeting', 'ingepland'],
      show:               ['Show op', 'meeting'],
      geclosed:           ['Geclosed'],
      aanbetaling:        ['Aanbetaling'],
      volledig_betaald:   ['Volledig', 'betaald'],
    };

    // Labels live in a fixed band BELOW the chart so every stage name sits
    // in the same horizontal row, column-aligned with its dot. No floating
    // names inside the chart area when a dot happens to be near the top.
    const labelRowTopY = padT + innerH + 28;

    const stageMarkup = STAGES.map((s, i) => {
      const x = xFor(s.col);
      const y = yForStage(s);
      const isStart = s.key === 'benaderd';
      const isEnd   = s.key === 'volledig_betaald';
      const showPct = !isStart;
      const pct     = showPct && baselineA > 0 ? (s.count / baselineA * 100) : 0;
      const dotCls = 'ff-dot' + (isStart ? ' is-start' : isEnd ? ' is-end' : '');
      const countY = y - 12;
      const pctY   = y + 16;
      const lines  = LABEL_LINES[s.key] || [s.label];
      // Lower-branch stage labels sit ABOVE the dot — they'd otherwise crowd
      // into the main row of labels below the chart and overlap with the
      // upper-branch neighbours at adjacent columns. Above the dot keeps the
      // name clearly attached to the right point.
      let labelTexts;
      if (s.path === 'lower') {
        // Stack the lines top-down ending just above the count.
        //   first line   y - 24 - 11*(n-1)
        //   ...
        //   last line    y - 24
        const lastLineY = Math.max(y - 30, padT + 4);
        labelTexts = lines.map((ln, idx) => {
          const lineY = lastLineY - (lines.length - 1 - idx) * 11;
          return `<text class="ff-pt-label" x="${x}" y="${lineY}" text-anchor="middle">${esc(ln)}</text>`;
        }).join('');
      } else {
        labelTexts = lines.map((ln, idx) =>
          `<text class="ff-pt-label" x="${x}" y="${labelRowTopY + idx * 11}" text-anchor="middle">${esc(ln)}</text>`
        ).join('');
      }
      return `
        <g class="ff-pt-grp">
          <circle class="${dotCls}" cx="${x}" cy="${y}" r="4.5" style="${isStart || isEnd ? '' : `stroke:${lineColor};`}"/>
          <circle class="ff-dot-btn" cx="${x}" cy="${y}" r="16" onclick="_openFullFunnelDetail('${s.key}')"/>
          <text class="ff-pt-count" x="${x}" y="${countY}" text-anchor="middle">${s.count.toLocaleString('nl-NL')}</text>
          ${showPct ? `<text class="ff-pt-pct" x="${x}" y="${pctY}" text-anchor="middle">${pct.toFixed(1).replace('.', ',')}%</text>` : ''}
          ${labelTexts}
        </g>
      `;
    }).join('');

    // ── COMPARE: B dots + B counts (purple, smaller) ─────────────────
    // B count sits just below A's pct so it's clearly attached to the same
    // column without occluding A's number. Same y-row regardless of path.
    let stageMarkupB = '';
    if (isCompare) {
      stageMarkupB = STAGES_B.map(s => {
        const x = xFor(s.col);
        const y = yForStageB(s);
        const isStart = s.key === 'benaderd';
        const showPct = !isStart;
        const pct = showPct && baselineB > 0 ? (s.count / baselineB * 100) : 0;
        const countY = y + 30;
        const numTxt = showPct
          ? `${s.count.toLocaleString('nl-NL')} <tspan style="opacity:0.7;">·${pct.toFixed(1).replace('.', ',')}%</tspan>`
          : `${s.count.toLocaleString('nl-NL')}`;
        return `
          <g class="ff-pt-grp ff-grp-b">
            <circle cx="${x}" cy="${y}" r="3.2" fill="#a855f7" stroke="#0A0618" stroke-width="1.5" opacity="0.95"/>
            <text x="${x}" y="${countY}" text-anchor="middle" style="font-size:9.5px;font-weight:800;fill:#a855f7;">${numTxt}</text>
          </g>
        `;
      }).join('');
    }

    // ── Headline + (when compare mode) inline A/B legend ──────────────
    const headlinePctCls = finalPct < 1 ? 'low' : '';
    const labelA = (window._kpiParamsA && window._kpiParamsA.label) ? window._kpiParamsA.label : 'Tijdvak A';
    const labelB = (window._kpiParamsB && window._kpiParamsB.label) ? window._kpiParamsB.label : 'Tijdvak B';
    const compareHeadline = isCompare ? `
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:11px;font-weight:700;">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:rgba(96,165,250,0.10);border:1px solid rgba(96,165,250,0.30);border-radius:100px;color:#60a5fa;">
          <span style="display:inline-block;width:18px;height:2.5px;background:${lineColor};border-radius:2px;"></span>
          A · ${esc(labelA)} — eindconv ${finalPct.toFixed(1).replace('.', ',')}%
        </span>
        <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:rgba(168,85,247,0.10);border:1px solid rgba(168,85,247,0.30);border-radius:100px;color:#a855f7;">
          <span style="display:inline-block;width:18px;height:2.5px;background:repeating-linear-gradient(90deg,#a855f7 0 5px,transparent 5px 9px);border-radius:2px;"></span>
          B · ${esc(labelB)} — eindconv ${finalPctB.toFixed(1).replace('.', ',')}%
        </span>
      </div>
    ` : '';
    const headline = `
      <div class="ff-head">
        <div class="ff-head-label">Eindconversie</div>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
          <div><span class="ff-head-bignum start">${benaderdCount.toLocaleString('nl-NL')}</span><span class="ff-head-sub">benaderd</span></div>
          <span class="ff-head-arrow">→</span>
          <div><span class="ff-head-bignum end">${finalCount.toLocaleString('nl-NL')}</span><span class="ff-head-sub">volledig betaald</span></div>
          <span class="ff-head-pct ${headlinePctCls}">${finalPct.toFixed(1).replace('.', ',')}%</span>
        </div>
      </div>
    `;

    // Stash data so the modal can fetch fresh details without re-fetching kpi-stats
    window._ffData = data;
    window._ffStages = STAGES;
    window._ffSrc = src;

    // Compare-mode B-line styling: dashed purple, lighter weight than A
    const compareLines = isCompare ? `
      <path d="${pathStartB}" class="ff-line" style="stroke:#a855f7;stroke-dasharray:6 4;stroke-width:2;opacity:0.80;"/>
      <path d="${pathUpperB}" class="ff-line" style="stroke:#a855f7;stroke-dasharray:6 4;stroke-width:2;opacity:0.80;"/>
      <path d="${pathLowerB}" class="ff-line" style="stroke:#a855f7;stroke-dasharray:4 4;stroke-width:1.8;opacity:0.60;"/>
      <path d="${pathTailB}"  class="ff-line" style="stroke:#a855f7;stroke-dasharray:6 4;stroke-width:2;opacity:0.80;"/>
    ` : '';

    el.innerHTML = `
      ${compareHeadline}
      ${headline}
      <div class="ff-svg-wrap">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="ff-svg" style="--ff-line:${lineColor};">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="${lineColor}" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="${lineColor}" stop-opacity="0.02"/>
            </linearGradient>
          </defs>
          ${gridLines}
          <path d="${areaSpine}" class="ff-area" fill="url(#${gradId})"/>
          ${compareLines}
          <path d="${pathStart}" class="ff-line" style="stroke:${lineColor};"/>
          <path d="${pathUpper}" class="ff-line" style="stroke:${lineColor};"/>
          <path d="${pathLower}" class="ff-line" style="stroke:${lineColorDim};stroke-dasharray:5 4;opacity:0.85;"/>
          <path d="${pathTail}"  class="ff-line" style="stroke:${lineColor};"/>
          ${stageMarkupB}
          ${stageMarkup}
        </svg>
      </div>
    `;
  }

  // ── KPI EXTRAS — fetch + render 8 cards below the Volledige funnel ──
  const _KE_IDS = ['kpiExtraGeld','kpiExtraDiagnose','kpiExtraBronnen','kpiExtraActie','kpiExtraVsPrev','kpiExtraVelocity','kpiExtraStrategy'];
  const _KE_TITLES = {
    kpiExtraGeld: ['💰', 'Geld in een blik'],
    kpiExtraDiagnose: ['🩺', 'Funnel diagnose'],
    kpiExtraBronnen: ['📊', 'Bronnen vergelijking'],
    kpiExtraActie: ['⚡', 'Actie queue'],
    kpiExtraVsPrev: ['📈', 'vs Vorige periode'],
    kpiExtraVelocity: ['⏱', 'Velocity & timing'],
    kpiExtraStrategy: ['🎯', 'Active strategy'],
  };
  function _keHeader(id, extra) {
    const [icon, title] = _KE_TITLES[id] || ['', ''];
    return `<div class="ke-head"><span class="icon">${icon}</span><span>${title}</span>${extra ? '<span style="margin-left:auto;font-size:9.5px;font-weight:700;color:var(--t4);">' + extra + '</span>' : ''}</div>`;
  }
  function _keSkeleton(id) {
    return `${_keHeader(id, '⏳ laden…')}<div style="display:flex;flex-direction:column;gap:8px;opacity:0.4;">
      <div style="height:14px;background:rgba(255,255,255,0.05);border-radius:4px;width:70%;"></div>
      <div style="height:22px;background:rgba(255,255,255,0.05);border-radius:4px;width:50%;"></div>
      <div style="height:12px;background:rgba(255,255,255,0.05);border-radius:4px;width:60%;"></div>
      <div style="height:12px;background:rgba(255,255,255,0.05);border-radius:4px;width:55%;"></div>
    </div>`;
  }
  function _keError(id, message) {
    return `${_keHeader(id)}
      <div style="display:flex;flex-direction:column;justify-content:center;flex:1;gap:8px;color:var(--t3);font-size:12px;font-weight:600;text-align:center;padding:8px;">
        <div style="font-size:22px;opacity:0.6;">${message.icon || '⚠'}</div>
        <div>${esc(message.text || 'Geen data')}</div>
        ${message.hint ? `<div style="font-size:10.5px;opacity:0.7;font-weight:500;">${esc(message.hint)}</div>` : ''}
      </div>`;
  }

  async function _loadKpiExtras(params) {
    const q = new URLSearchParams();
    if (params.from)      q.set('from', params.from);
    if (params.to)        q.set('to', params.to);
    if (params.preset)    q.set('preset', params.preset);
    if (params.period)    q.set('period', params.period);
    if (params.member_id) q.set('member_id', params.member_id);
    if (params.source && params.source !== 'all') q.set('source', params.source);

    _KE_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = _keSkeleton(id); });

    let res, d;
    try {
      res = await fetch('/api/sales/kpi-extras?' + q.toString(), { credentials: 'same-origin' });
    } catch (netErr) {
      const msg = { icon: '🔌', text: 'Geen verbinding', hint: 'Check je netwerk en herlaad' };
      _KE_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = _keError(id, msg); });
      return;
    }
    if (!res.ok) {
      let msg;
      if (res.status === 401 || res.status === 403) {
        msg = { icon: '🔐', text: 'Sessie verlopen', hint: 'Herlaad de pagina om opnieuw in te loggen' };
      } else if (res.status === 404) {
        msg = { icon: '🚧', text: 'Endpoint nog niet live', hint: 'Wacht ~1 min op Render deploy en refresh' };
      } else if (res.status >= 500) {
        msg = { icon: '⚠', text: `Server error (${res.status})`, hint: 'Probeer over een minuut opnieuw' };
      } else {
        msg = { icon: '⚠', text: `HTTP ${res.status}`, hint: 'Check console voor details' };
      }
      _KE_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = _keError(id, msg); });
      return;
    }
    try {
      d = await res.json();
    } catch (parseErr) {
      const msg = { icon: '⚠', text: 'Ongeldig antwoord', hint: 'Server gaf geen geldige JSON' };
      _KE_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = _keError(id, msg); });
      return;
    }

    // Render each section in its own try/catch so a bug in one doesn't kill the rest
    const safeRender = (id, fn) => {
      try { fn(d); } catch (e) {
        console.warn('[kpi-extras]', id, 'render failed:', e);
        const el = document.getElementById(id);
        if (el) el.innerHTML = _keError(id, { icon: '⚠', text: 'Render-fout', hint: e && e.message });
      }
    };
    safeRender('kpiExtraGeld',        _renderExtraGeld);
    safeRender('kpiExtraDiagnose',    _renderExtraDiagnose);
    safeRender('kpiExtraBronnen',     _renderExtraBronnen);
    safeRender('kpiExtraActie',       _renderExtraActie);
    safeRender('kpiExtraVsPrev',      _renderExtraVsPrev);
    safeRender('kpiExtraVelocity',    _renderExtraVelocity);
    safeRender('kpiExtraStrategy',    _renderExtraStrategy);
  }
  const _fmtEuro = (n) => '€' + Math.round(Number(n) || 0).toLocaleString('nl-NL');
  const _fmtPct  = (n) => (Number(n) || 0).toFixed(1).replace('.', ',') + '%';
  const _deltaPill = (v, opts) => {
    if (v === null || v === undefined) return '<span class="ke-delta flat">—</span>';
    const num = Number(v);
    const cls = num > 0 ? 'pos' : num < 0 ? 'neg' : 'flat';
    const sign = num > 0 ? '+' : '';
    const suffix = opts && opts.pctPoints ? 'pp' : '%';
    return `<span class="ke-delta ${cls}">${num > 0 ? '▲' : num < 0 ? '▼' : '◆'} ${sign}${num.toFixed(1).replace('.', ',')}${suffix}</span>`;
  };
