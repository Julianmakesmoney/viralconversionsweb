<!--
  ══════════════════════════════════════════════════════════════════════════
   KPI-DASHBOARD — UIT HET SALESPORTAAL GEHAALD
  ══════════════════════════════════════════════════════════════════════════

  Dit dashboard hoorde bij de oude statussen: forum sturen/gezien/ingevuld,
  bel-terug-stappen, meeting ingepland/show/no-show, aanbetaling, contract
  getekend, plus een vergelijkmodus voor twee tijdvakken naast elkaar.

  De flow is inmiddels:
    leads    demo_bouwen -> demo_aanleveren -> demo_gezien
    klanten  factuur_gestuurd -> factuur_betaald -> website_deployed

  De helft van de kolommen zou dus permanent op nul staan. Daarom staat het
  hier geparkeerd in plaats van in sales.html.

  -- Terugzetten ----------------------------------------------------------
  1. Plak het CSS-blok hieronder terug in de <style> van sales.html.
  2. Plak het HTML-blok terug, direct voor "<!-- PAGE: LEADS -->".
  3. Plak het JS-blok terug in het grote <script>, boven "function fmt(n)".
  4. Zet de navigatieknoppen terug (desktop en mobiel):
       <button class="nav-tab alleen-julian" data-nav="kpi" onclick="nav('kpi',this)">KPI</button>
  5. Zet in nav() terug:
       if (page === 'kpi' && typeof _renderKpiPanels === 'function') _renderKpiPanels();
  6. Zet in init() terug: _lazyInitKpiDashboard();

  Let op: de backend-endpoints (/api/sales/kpi-stats, /api/sales/kpi-extras,
  /api/sales/kpi-callback-funnel) staan nog gewoon in server.py. Die lezen nog
  de oude statuskolommen, dus die moeten mee omgezet worden voordat dit weer
  zinnige cijfers geeft.
-->

<!-- == 1. CSS ================================================== -->
<style>
    /* ══ KPI DASHBOARD ══ */
    :root {
      --tf-a: #f43f5e;   /* Tijdvak A — rose-red */
      --tf-b: #3b82f6;   /* Tijdvak B — clear blue */
    }
    .kpi-wrap { margin-top: 28px; }
    .kpi-summary {
      cursor: pointer; list-style: none; padding: 14px 18px;
      background: linear-gradient(135deg,rgba(96,165,250,0.07),rgba(96,165,250,0.02));
      border: 1px solid rgba(96,165,250,0.28); border-radius: 14px;
      display: flex; align-items: center; gap: 10px; user-select: none;
    }
    .kpi-summary::-webkit-details-marker { display:none; }
    .kpi-summary-title { font-size: 14px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; flex: 1; }
    .kpi-summary-hint  { font-size: 11px; color: var(--t3); }
    .kpi-summary-chev  { font-size: 16px; opacity: 0.55; transition: transform 0.2s; }
    details[open] > .kpi-summary .kpi-summary-chev { transform: rotate(180deg); }

    .kpi-content { display: flex; flex-direction: column; gap: 18px; padding-top: 14px; }
    .kpi-source-toggle {
      display: inline-flex; gap: 3px; background: rgba(0,0,0,0.18); padding: 3px;
      border-radius: 100px; align-self: flex-start;
    }
    .kpi-src-btn {
      border: none; background: transparent; color: var(--t2); border-radius: 100px;
      padding: 6px 14px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .kpi-src-btn.active { background: var(--accent); color: #fff; }
    .kpi-src-btn:not(.active):hover { color: var(--text); }

    .kpi-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 18px 18px 22px;
    }
    .kpi-card-title {
      font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--t2); margin-bottom: 14px;
    }
    .funnel-stages {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 8px;
    }
    .funnel-stage {
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 12px 14px; position: relative;
    }
    .funnel-stage.is-end { border-color: rgba(239,68,68,0.30); background: rgba(239,68,68,0.06); }
    .funnel-stage-name  { font-size: 11px; font-weight: 700; color: var(--t3); letter-spacing: 0.03em; }
    .funnel-stage-count { font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .funnel-stage-pct   { font-size: 11px; font-weight: 700; color: var(--t2); margin-top: 2px; }
    .funnel-stage-split { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--glass-border); font-size: 10.5px; font-weight: 700; color: var(--t2); }
    .funnel-stage-split .src-pill { display: inline-flex; align-items: center; gap: 3px; }
    .funnel-stage-split .winner { color: #10b981; }
    .funnel-arrow {
      font-size: 11px; color: var(--t3); text-align: center; margin: 6px 0 0; font-weight: 700;
    }
    .funnel-arrow .delta-neg { color: #ef4444; }

    /* ── Volledige funnel (Benaderd → Volledig betaald) ───────────────────── */
    .ff-card { background: rgba(255,255,255,0.025); border: 1px solid var(--glass-border); border-radius: 14px; padding: 18px 18px 14px; }
    .ff-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 14px; }
    .ff-head-label { font-size: 10px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--t3); }
    .ff-head-bignum { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; color: var(--text); }
    .ff-head-bignum.start { color: #60a5fa; }
    .ff-head-bignum.end   { color: #10b981; }
    .ff-head-sub { font-size: 11px; font-weight: 700; color: var(--t3); margin-left: 4px; }
    .ff-head-arrow { font-size: 18px; color: var(--t3); margin: 0 4px; }
    .ff-head-pct { padding: 6px 14px; background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.38); border-radius: 100px; color: #10b981; font-size: 14px; font-weight: 900; letter-spacing: -0.01em; }
    .ff-head-pct.low { background: rgba(239,68,68,0.10); border-color: rgba(239,68,68,0.35); color: #ef4444; }

    .ff-svg-wrap { position: relative; width: 100%; overflow: hidden; }
    .ff-svg { width: 100%; height: auto; display: block; overflow: visible; }

    /* Line + dots */
    .ff-line { fill: none; stroke: #60a5fa; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(96,165,250,0.40)); }
    .ff-area { fill: url(#ff-grad); opacity: 0.25; }
    .ff-grid { stroke: rgba(255,255,255,0.06); stroke-width: 1; stroke-dasharray: 3 4; }
    .ff-dot  { fill: #0A0618; stroke: #60a5fa; stroke-width: 2.4; transition: r 0.15s, fill 0.15s; }
    [data-theme="light"] .ff-dot { fill: #ffffff; }
    .ff-dot:hover { r: 6; fill: #60a5fa; }
    .ff-dot.is-start { stroke: #60a5fa; fill: #60a5fa; }
    .ff-dot.is-end   { stroke: #10b981; fill: #10b981; }

    /* Per-point label group */
    .ff-pt-grp .ff-pt-count { font-size: 11px; font-weight: 800; fill: var(--text); }
    .ff-pt-grp .ff-pt-pct   { font-size: 10px; font-weight: 700; fill: var(--t3); }
    .ff-pt-grp .ff-pt-label { font-size: 10px; font-weight: 700; fill: var(--t2); }
    .ff-pt-grp .ff-pt-label.alt { fill: var(--t3); }

    /* Clickable hit-area on each point */
    .ff-dot-btn { fill: transparent; stroke: transparent; cursor: pointer; }
    .ff-dot-btn:hover ~ .ff-dot, .ff-dot:hover { r: 7; }

    /* Detail modal headline + stats grid */
    .ff-headline-pill { padding: 6px 14px; background: rgba(96,165,250,0.10); border: 1px solid rgba(96,165,250,0.32); border-radius: 100px; color: #60a5fa; font-size: 12px; font-weight: 800; }
    .ff-headline-pill.green { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.32); color: #10b981; }
    .ff-headline-pill.red   { background: rgba(239,68,68,0.10);  border-color: rgba(239,68,68,0.32);  color: #ef4444; }
    .ff-headline-pill.amber { background: rgba(245,158,11,0.10); border-color: rgba(245,158,11,0.32); color: #f59e0b; }
    .ff-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .ff-stat-card { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 14px; }
    .ff-stat-card .lbl { font-size: 9.5px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }
    .ff-stat-card .val { font-size: 19px; font-weight: 900; letter-spacing: -0.02em; color: var(--text); }
    .ff-stat-card .sub { font-size: 11px; color: var(--t3); margin-top: 2px; font-weight: 600; }
    .ff-stat-card.pos .val { color: #10b981; }
    .ff-stat-card.neg .val { color: #ef4444; }
    .ff-stat-card.warn .val { color: #f59e0b; }
    .ff-section-title { font-size: 10px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--t3); margin-top: 4px; }
    .ff-list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 10px; font-size: 12px; }
    .ff-list-row strong { font-weight: 800; color: var(--text); }
    [data-theme="light"] .ff-stat-card { background: rgba(0,0,0,0.025); }
    [data-theme="light"] .ff-list-row  { background: rgba(0,0,0,0.025); }

    @media (max-width: 720px) {
      .ff-head-bignum { font-size: 18px; }
      .ff-head-pct    { font-size: 12px; padding: 5px 11px; }
      .ff-pt-grp .ff-pt-count { font-size: 10px; }
      .ff-pt-grp .ff-pt-label { font-size: 9px; }
    }

    /* ── KPI extras grid (8 cards below Volledige funnel) ─────────────── */
    /* Roomier layout: max 3 cards per row on wide screens so each card has
       breathing room. Falls back to 2-col on tablets and 1-col on phones. */
    .kpi-extras-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 22px; }
    @media (max-width: 1180px) { .kpi-extras-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px)  { .kpi-extras-grid { grid-template-columns: 1fr; gap: 14px; } }
    .kpi-extra-card { background: rgba(255,255,255,0.025); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px 22px 18px; min-height: 220px; display: flex; flex-direction: column; gap: 12px; }
    [data-theme="light"] .kpi-extra-card { background: rgba(0,0,0,0.022); }
    .ke-head { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }
    .ke-head .icon { font-size: 16px; }
    .ke-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .ke-row .lbl { font-size: 12.5px; font-weight: 600; color: var(--t2); }
    .ke-row .val { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .ke-row .val.big { font-size: 26px; font-weight: 900; letter-spacing: -0.025em; }
    .ke-row .val.pos { color: #10b981; }
    .ke-row .val.neg { color: #ef4444; }
    .ke-row .val.warn { color: #f59e0b; }
    .ke-sub { font-size: 11px; color: var(--t3); font-weight: 600; line-height: 1.45; }
    .ke-delta { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 800; }
    .ke-delta.pos { background: rgba(16,185,129,0.13); color: #10b981; }
    .ke-delta.neg { background: rgba(239,68,68,0.10);  color: #ef4444; }
    .ke-delta.flat { background: rgba(96,165,250,0.10); color: #60a5fa; }
    .ke-bar { display: grid; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; padding: 4px 0; }
    .ke-bar .bar { height: 6px; background: var(--glass-border); border-radius: 100px; overflow: hidden; }
    .ke-bar .bar > span { display: block; height: 100%; border-radius: 100px; background: #60a5fa; transition: width 0.3s; }
    .ke-bar.winner { color: var(--success); }
    .ke-bar.winner .bar > span { background: var(--success); }
    .ke-pill-lg { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 100px; font-size: 10.5px; font-weight: 800; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--t2); }
    .ke-pill-lg.gold { background: var(--gold-bg); border-color: var(--gold-border); color: var(--gold); }
    .ke-pill-lg.fire { background: rgba(251,146,60,0.10); border-color: rgba(251,146,60,0.32); color: #fb923c; }
    .ke-action-line { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,0.04); border-radius: 10px; font-size: 12.5px; font-weight: 700; }
    .ke-action-line .count { font-size: 15px; font-weight: 900; min-width: 32px; }
    .ke-action-line.red    { background: rgba(239,68,68,0.10);  color: #ef4444; }
    .ke-action-line.amber  { background: rgba(245,158,11,0.10); color: #f59e0b; }
    .ke-action-line.blue   { background: rgba(96,165,250,0.10); color: #60a5fa; }
    .ke-leader { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--glass-border); }
    .ke-leader:last-child { border-bottom: none; }
    .ke-leader .rank { font-size: 18px; }
    .ke-leader .name { font-size: 13px; font-weight: 800; color: var(--text); }
    .ke-leader .sub  { font-size: 10.5px; color: var(--t3); font-weight: 600; margin-top: 1px; }
    .ke-leader .num  { font-size: 14px; font-weight: 900; color: var(--success); letter-spacing: -0.01em; }

    /* ── Warm-leads line-chart funnel ───────────────────────────────────── */
    .lc-funnel {
      display: flex; flex-direction: column; gap: 14px;
      background: rgba(255,255,255,0.025); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 18px 18px 16px;
    }
    .lc-chart-wrap { position: relative; width: 100%; }
    .lc-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .lc-line {
      fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
      transition: opacity 0.25s, stroke-width 0.25s;
    }
    .lc-line-phone { stroke: #60a5fa; filter: drop-shadow(0 0 8px rgba(96,165,250,0.30)); }
    .lc-line-wa    { stroke: #34d399; filter: drop-shadow(0 0 8px rgba(52,211,153,0.30)); }
    .lc-pt         { transition: opacity 0.25s, r 0.25s; stroke: var(--bg, #000); stroke-width: 1.5; }
    .lc-pt-phone   { fill: #60a5fa; }
    .lc-pt-wa      { fill: #34d399; }
    .lc-funnel[data-source="phone"]    .lc-line-wa,
    .lc-funnel[data-source="phone"]    .lc-pt-wa    { opacity: 0.16; filter: none; }
    .lc-funnel[data-source="whatsapp"] .lc-line-phone,
    .lc-funnel[data-source="whatsapp"] .lc-pt-phone { opacity: 0.16; filter: none; }
    .lc-break-slash { stroke: var(--t3); stroke-width: 1.4; opacity: 0.55; }
    .lc-baseline { stroke: var(--glass-border); stroke-width: 1; stroke-dasharray: 3 4; }
    .lc-vline { stroke: var(--glass-border); stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.55; }

    .lc-axis-row {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: -4px;
    }
    .lc-stage-meta {
      text-align: center; display: flex; flex-direction: column; gap: 2px;
      padding: 10px 6px 8px; border-radius: 10px;
      background: rgba(255,255,255,0.025); border: 1px solid var(--glass-border);
    }
    .lc-stage-name {
      font-size: 10px; font-weight: 800; color: var(--t3);
      letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2;
    }
    .lc-stage-count {
      font-size: 22px; font-weight: 900; color: var(--text);
      font-variant-numeric: tabular-nums; letter-spacing: -0.03em; margin-top: 2px;
    }
    .lc-stage-drop {
      font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px;
    }
    .lc-stage-drop.neg  { color: #ef4444; }
    .lc-stage-drop.pos  { color: #10b981; }
    .lc-stage-drop.zero { color: var(--t3); }
    .lc-stage-conv {
      font-size: 10px; font-weight: 700; color: var(--t2);
      font-variant-numeric: tabular-nums;
    }

    .lc-legend {
      display: flex; gap: 16px; justify-content: center; font-size: 11px; font-weight: 700;
      color: var(--t2);
    }
    .lc-legend-dot {
      width: 9px; height: 9px; border-radius: 50%; display: inline-block; vertical-align: middle;
      margin-right: 6px;
    }
    .lc-totals {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding-top: 12px; border-top: 1px solid var(--glass-border);
    }
    .lc-tot-card {
      border-radius: 12px; padding: 10px 16px;
    }
    .lc-tot-card.good {
      background: linear-gradient(135deg, rgba(16,185,129,0.10), rgba(16,185,129,0.02));
      border: 1px solid rgba(16,185,129,0.30);
    }
    .lc-tot-card.bad {
      background: linear-gradient(135deg, rgba(239,68,68,0.10), rgba(239,68,68,0.02));
      border: 1px solid rgba(239,68,68,0.30);
    }
    .lc-tot-card .label {
      font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--t3);
    }
    .lc-tot-card.good .value {
      font-size: 22px; font-weight: 900; color: #10b981;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 2px;
    }
    .lc-tot-card.bad .value {
      font-size: 22px; font-weight: 900; color: #ef4444;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 2px;
    }

    /* ── Forum-ingevuld → Demo-geleverd bridge ──────────────────────────── */
    .demo-bridge {
      display: flex; align-items: stretch; gap: 12px; flex-wrap: wrap;
      padding: 12px 14px; margin-bottom: 14px;
      background: rgba(255,255,255,0.025); border: 1px solid var(--glass-border);
      border-radius: 12px;
    }
    .br-cell {
      display: flex; flex-direction: column; gap: 2px; justify-content: center;
      padding: 6px 14px;
    }
    .br-num { font-size: 22px; font-weight: 900; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1.1; }
    .br-lbl { font-size: 9.5px; font-weight: 800; color: var(--t3); letter-spacing: 0.05em; text-transform: uppercase; }
    .br-arrow { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 4px; }
    .br-arrow .pct {
      font-size: 12.5px; font-weight: 900; color: #10b981; font-variant-numeric: tabular-nums;
      padding: 2px 9px; border-radius: 100px;
      background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.30);
    }
    .br-arrow .line { font-size: 16px; color: #60a5fa; font-weight: 900; line-height: 1; }
    .br-loss {
      margin-left: auto;
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.30);
      border-radius: 10px; padding: 6px 16px;
    }
    .br-loss .br-num { color: #ef4444; }
    /* Bridge in compare mode — two horizontal rows (A on top, B below) */
    .demo-bridge.is-compare { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
    .demo-bridge.is-compare .br-row {
      display: grid; grid-template-columns: 14px 1fr auto 1fr auto; gap: 10px; align-items: center;
      padding: 8px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border);
    }
    .demo-bridge.is-compare .br-row[data-tf="A"] {
      border-left: 3px solid var(--tf-a, #f43f5e);
      background: linear-gradient(90deg, rgba(244,63,94,0.05), rgba(244,63,94,0.01));
    }
    .demo-bridge.is-compare .br-row[data-tf="B"] {
      border-left: 3px solid var(--tf-b, #3b82f6);
      background: linear-gradient(90deg, rgba(59,130,246,0.05), rgba(59,130,246,0.01));
    }
    .demo-bridge.is-compare .br-tf-chip {
      width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .demo-bridge.is-compare .br-row[data-tf="A"] .br-tf-chip { background: var(--tf-a, #f43f5e); }
    .demo-bridge.is-compare .br-row[data-tf="B"] .br-tf-chip { background: var(--tf-b, #3b82f6); }
    .demo-bridge.is-compare .br-mini {
      display: flex; flex-direction: column; gap: 1px;
    }
    .demo-bridge.is-compare .br-mini-num {
      font-size: 17px; font-weight: 900; color: var(--text);
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1;
    }
    .demo-bridge.is-compare .br-mini-lbl {
      font-size: 9px; font-weight: 800; color: var(--t3);
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .demo-bridge.is-compare .br-mini.loss .br-mini-num { color: #ef4444; }

    /* ── Compare-mode line styles + per-timeframe A/B branding ──────────── */
    .lc-funnel[data-mode="compare"] .lc-line-tfb { stroke-dasharray: 6 4; }
    .lc-funnel[data-mode="compare"] .lc-pt-tfb   { stroke-dasharray: 0; opacity: 0.85; }
    /* Compare-mode focus: dim phone or whatsapp pair (both TF A & TF B) */
    .lc-funnel[data-mode="compare"][data-source="phone"] .lc-line-wa,
    .lc-funnel[data-mode="compare"][data-source="phone"] .lc-pt-wa { opacity: 0.16; filter: none; }
    .lc-funnel[data-mode="compare"][data-source="whatsapp"] .lc-line-phone,
    .lc-funnel[data-mode="compare"][data-source="whatsapp"] .lc-pt-phone { opacity: 0.16; filter: none; }

    /* Stage cards in compare-mode: stacked A row + B row + delta pill */
    .lc-stage-meta.is-compare {
      padding: 8px 6px 6px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .lc-stage-meta.is-compare .lc-stage-name {
      font-size: 9.5px; margin-bottom: 2px;
    }
    .lc-stage-meta.is-compare .lc-tf-row {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 6px; border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }
    .lc-stage-meta.is-compare .lc-tf-row[data-tf="A"] {
      background: rgba(244,63,94,0.07); border-left: 2px solid var(--tf-a, #f43f5e);
    }
    .lc-stage-meta.is-compare .lc-tf-row[data-tf="B"] {
      background: rgba(59,130,246,0.07); border-left: 2px solid var(--tf-b, #3b82f6);
    }
    .lc-stage-meta.is-compare .lc-tf-badge {
      font-size: 9px; font-weight: 900; color: #fff;
      width: 14px; height: 14px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .lc-stage-meta.is-compare .lc-tf-row[data-tf="A"] .lc-tf-badge { background: var(--tf-a, #f43f5e); }
    .lc-stage-meta.is-compare .lc-tf-row[data-tf="B"] .lc-tf-badge { background: var(--tf-b, #3b82f6); }
    .lc-stage-meta.is-compare .lc-tf-cnt {
      font-size: 14px; font-weight: 900; color: var(--text); letter-spacing: -0.02em; flex: 1;
    }
    .lc-stage-meta.is-compare .lc-tf-drop {
      font-size: 9.5px; font-weight: 700; color: var(--t3);
    }
    .lc-stage-meta.is-compare .lc-tf-drop.neg { color: #ef4444; }
    .lc-stage-meta.is-compare .lc-delta-pill {
      margin-top: 2px; align-self: center;
      font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 100px;
      font-variant-numeric: tabular-nums;
    }
    .lc-delta-pill.up { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.30); }
    .lc-delta-pill.down { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.30); }
    .lc-delta-pill.flat { background: rgba(255,255,255,0.06); color: var(--t3); border: 1px solid var(--glass-border); }

    /* Compare-mode totals row: shows A + B side by side with delta pill */
    .lc-totals.is-compare { grid-template-columns: 1fr 1fr; gap: 10px; }
    .lc-tot-card.is-compare { padding: 10px 14px; }
    .lc-tot-card.is-compare .lc-tot-pair {
      display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline;
      margin-top: 4px;
    }
    .lc-tot-card.is-compare .lc-tot-pair .tf-badge {
      width: 16px; height: 16px; border-radius: 50%; color: #fff;
      font-size: 9px; font-weight: 900;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .lc-tot-card.is-compare .lc-tot-pair[data-tf="A"] .tf-badge { background: var(--tf-a, #f43f5e); }
    .lc-tot-card.is-compare .lc-tot-pair[data-tf="B"] .tf-badge { background: var(--tf-b, #3b82f6); }
    .lc-tot-card.is-compare .tot-num {
      font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .lc-tot-card.good.is-compare .tot-num { color: #10b981; }
    .lc-tot-card.bad.is-compare .tot-num  { color: #ef4444; }
    .lc-tot-card.is-compare .tot-sub { font-size: 10px; color: var(--t3); font-weight: 700; }

    /* ── KPI card body — side controls + chart area ─────────────────────── */
    .kpi-card-body { display: flex; gap: 14px; align-items: stretch; }
    .kpi-card-area { flex: 1; min-width: 0; }
    .kpi-side-controls {
      display: flex; flex-direction: column; gap: 6px;
      padding: 4px; border-radius: 12px;
      background: rgba(0,0,0,0.18); border: 1px solid var(--glass-border);
      align-self: flex-start; flex-shrink: 0;
    }
    .kpi-side-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      width: 56px; padding: 8px 4px; border: none;
      background: transparent; color: var(--t2); border-radius: 8px;
      font-family: inherit; font-size: 9.5px; font-weight: 800; cursor: pointer;
      letter-spacing: 0.03em; text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .kpi-side-btn .icon { font-size: 16px; line-height: 1; }
    .kpi-side-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .kpi-side-btn.active { background: var(--accent); color: #fff; }
    .kpi-side-btn.swap {
      margin-top: 4px; border-top: 1px solid var(--glass-border); border-radius: 0 0 8px 8px;
      padding-top: 10px;
    }
    .kpi-side-btn.swap .icon { font-size: 15px; }

    @media (max-width: 720px) {
      .kpi-card-body { flex-direction: column; gap: 10px; }
      .kpi-side-controls { flex-direction: row; flex-wrap: wrap; align-self: stretch; }
      .kpi-side-btn { width: auto; flex: 1; flex-direction: row; padding: 8px 10px; }
      .kpi-side-btn.swap { margin: 0; border: none; padding: 8px 10px; border-left: 1px solid var(--glass-border); border-radius: 8px; }
    }

    /* ── Sticky compare-header (period pickers + legend) ────────────────── */
    .kpi-sticky-head {
      position: sticky; top: 0; z-index: 30;
      background: var(--bg-sticky, rgba(8,4,24,0.78));
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      padding: 10px 12px; margin: 0 -12px 14px; border-bottom: 1px solid var(--glass-border);
      border-radius: 0 0 14px 14px;
    }
    .kpi-tf-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 100px;
      font-size: 12px; font-weight: 800; color: var(--text);
      background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
    }
    .kpi-tf-pill[data-tf="A"] {
      background: linear-gradient(135deg, rgba(244,63,94,0.12), rgba(244,63,94,0.02));
      border-color: rgba(244,63,94,0.40);
    }
    .kpi-tf-pill[data-tf="B"] {
      background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(59,130,246,0.02));
      border-color: rgba(59,130,246,0.40);
    }
    .kpi-tf-pill .tf-badge {
      width: 18px; height: 18px; border-radius: 50%;
      font-size: 10px; font-weight: 900; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .kpi-tf-pill[data-tf="A"] .tf-badge { background: var(--tf-a, #f43f5e); }
    .kpi-tf-pill[data-tf="B"] .tf-badge { background: var(--tf-b, #3b82f6); }
    .kpi-tf-pill .tf-date { font-size: 11.5px; color: var(--t2); font-weight: 700; }

    .kpi-legend-strip {
      display: inline-flex; align-items: center; gap: 14px;
      padding: 5px 14px; font-size: 11px; font-weight: 700; color: var(--t2);
      background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
      border-radius: 100px;
    }
    .kpi-legend-strip .ln {
      display: inline-flex; align-items: center; gap: 6px;
    }
    .kpi-legend-strip .ln-bar {
      width: 26px; height: 2.5px; border-radius: 2px;
    }
    .kpi-legend-strip .ln-bar.solid { background: var(--text); }
    .kpi-legend-strip .ln-bar.dashed {
      background: repeating-linear-gradient(90deg, var(--text) 0 4px, transparent 4px 7px);
    }

    /* Card head — title + (optional) close-stage pill toggle */
    .kpi-card-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .kpi-card-head .kpi-card-title { margin-bottom: 0; flex: 1; min-width: 0; }
    .close-stage-toggle {
      display: inline-flex; align-items: center; gap: 2px;
      background: rgba(0,0,0,0.18); padding: 3px; border-radius: 100px;
    }
    .close-stage-toggle .cst-label {
      font-size: 10.5px; font-weight: 800; color: var(--t3);
      letter-spacing: 0.05em; text-transform: uppercase; padding: 0 8px 0 10px;
    }
    .close-stage-toggle .cst-btn {
      border: none; background: transparent; color: var(--t2); border-radius: 100px;
      padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .close-stage-toggle .cst-btn.active { background: var(--accent); color: #fff; }
    .close-stage-toggle .cst-btn:not(.active):hover { color: var(--text); }

    /* ── Conclusion card ────────────────────────────────────────────────── */
    .kpi-conclusion-card {
      background: linear-gradient(135deg, rgba(245,158,11,0.06), rgba(245,158,11,0.01));
      border: 1px solid rgba(245,158,11,0.28);
      border-radius: 14px; padding: 18px 18px 20px;
    }
    .kpi-conclusion-card[data-mode="compare"] {
      background: linear-gradient(135deg, rgba(168,85,247,0.06), rgba(168,85,247,0.01));
      border-color: rgba(168,85,247,0.32);
    }
    .conclusion-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .conclusion-head .icon { font-size: 22px; }
    .conclusion-head .title {
      font-size: 14px; font-weight: 900; color: var(--text);
      letter-spacing: -0.01em; flex: 1;
    }
    .conclusion-head .mode-pill {
      font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 100px;
      letter-spacing: 0.05em; text-transform: uppercase;
      background: rgba(245,158,11,0.14); color: #f59e0b;
      border: 1px solid rgba(245,158,11,0.30);
    }
    .kpi-conclusion-card[data-mode="compare"] .conclusion-head .mode-pill {
      background: rgba(168,85,247,0.14); color: #a855f7;
      border-color: rgba(168,85,247,0.32);
    }
    .conclusion-sections {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px;
    }
    .conclusion-section {
      background: rgba(255,255,255,0.025); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 12px 14px;
    }
    .conclusion-section-head {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 900; color: var(--t2);
      letter-spacing: 0.05em; text-transform: uppercase;
      margin-bottom: 8px;
    }
    .conclusion-section-body { font-size: 12.5px; line-height: 1.5; color: var(--t2); }
    .conclusion-section-body strong { color: var(--text); font-weight: 800; }
    .conclusion-section-body .pos { color: #10b981; font-weight: 800; }
    .conclusion-section-body .neg { color: #ef4444; font-weight: 800; }
    .conclusion-section-body .tf-a { color: var(--tf-a, #f43f5e); font-weight: 800; }
    .conclusion-section-body .tf-b { color: var(--tf-b, #3b82f6); font-weight: 800; }
    .conclusion-section-body ul { margin: 0; padding: 0; list-style: none; }
    .conclusion-section-body li {
      padding: 3px 0; display: flex; gap: 6px; align-items: baseline;
    }
    .conclusion-section-body li .bullet { color: var(--t3); flex-shrink: 0; }

    /* ── Dashboard top-level subtabs (Overzicht ↔ KPI Dashboard) ────────── */
    /* Rooster en KPI zijn alleen voor Julian — standaard verborgen, de
       vlag uit /api/sales/me zet ze aan. */
    .alleen-julian { display: none !important; }
    body.is-eigenaar .nav-tab.alleen-julian { display: inline-flex !important; }
    body.is-eigenaar .mob-nav-btn.alleen-julian { display: flex !important; }

    .dash-subtabs {
      display: inline-flex; gap: 4px; background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border); border-radius: 100px;
      padding: 4px; margin-bottom: 22px;
    }
    .dash-subtab {
      padding: 7px 18px; border: none; background: transparent; color: var(--t2);
      border-radius: 100px; font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.15s, color 0.15s;
    }
    .dash-subtab.on { background: var(--accent); color: #fff; }
    .dash-subtab:not(.on):hover { color: var(--text); }
    /* Default mode = Overzicht → KPI dashboard verstopt */
    /* KPI mode → alles in page-inner verbergen, behalve chrome (page-hd, switcher,
       de kpi-wrap zelf en de live feed onderaan) */
      display: none !important;
    }
      display: none !important;
    }
      display: none !important;
    }

    /* ── Stage-focus klik-interactie ────────────────────────────────────── */
    .lc-funnel[data-focus] .lc-stage-meta {
      transition: transform 0.25s, opacity 0.25s, filter 0.25s;
      cursor: pointer;
    }
    .lc-funnel:not([data-focus]) .lc-stage-meta { cursor: pointer; }
    .lc-funnel[data-focus] .lc-stage-meta:not(.is-focused) {
      opacity: 0.4; filter: blur(1.5px);
    }
    .lc-funnel[data-focus] .lc-stage-meta.is-focused {
      transform: scale(1.08);
      background: linear-gradient(135deg, rgba(96,165,250,0.10), rgba(96,165,250,0.02));
      border-color: rgba(96,165,250,0.45);
      box-shadow: 0 4px 18px rgba(96,165,250,0.18);
      z-index: 2; position: relative;
    }
    .lc-funnel[data-focus] .lc-pt {
      transition: r 0.25s, opacity 0.25s;
    }
    .lc-funnel[data-focus] .lc-pt:not([data-focused]) {
      opacity: 0.35;
    }
    .lc-funnel[data-focus] .lc-pt[data-focused] {
      r: 8;
    }
    .lc-pt { cursor: pointer; }

    /* ── Callback sub-funnel card ───────────────────────────────────────── */
    .kpi-callback-card {
      background: linear-gradient(135deg, rgba(96,165,250,0.05), rgba(96,165,250,0.01));
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 14px; padding: 18px 18px 18px;
    }
    .cb-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .cb-head .title {
      font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--t2);
    }
    .cb-head .summary { font-size: 11.5px; color: var(--t3); font-weight: 700; }
    .cb-head .summary strong { color: var(--text); font-weight: 900; font-variant-numeric: tabular-nums; }
    .cb-buckets {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 14px;
    }
    .cb-bucket {
      text-align: center;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 12px 8px 10px;
    }
    .cb-bucket-icon { font-size: 18px; line-height: 1; }
    .cb-bucket-count {
      font-size: 26px; font-weight: 900; letter-spacing: -0.03em;
      color: var(--text); font-variant-numeric: tabular-nums; margin-top: 4px;
    }
    .cb-bucket-label {
      font-size: 10px; font-weight: 800; color: var(--t3);
      letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px;
    }
    .cb-bucket-pct { font-size: 11px; font-weight: 800; color: var(--t2); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .cb-bucket.cb-still      { border-color: rgba(251,191,36,0.32); background: rgba(251,191,36,0.05); }
    .cb-bucket.cb-still      .cb-bucket-count { color: #fbbf24; }
    .cb-bucket.cb-progressed { border-color: rgba(16,185,129,0.32); background: rgba(16,185,129,0.05); }
    .cb-bucket.cb-progressed .cb-bucket-count { color: #10b981; }
    .cb-bucket.cb-afgehaakt  { border-color: rgba(239,68,68,0.32); background: rgba(239,68,68,0.05); }
    .cb-bucket.cb-afgehaakt  .cb-bucket-count { color: #ef4444; }
    .cb-progression {
      padding-top: 12px; margin-bottom: 12px; border-top: 1px solid var(--glass-border);
    }
    .cb-progression-head {
      font-size: 10.5px; font-weight: 800; color: var(--t3);
      letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px;
    }
    .cb-tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .cb-tag {
      padding: 5px 11px; border-radius: 100px;
      background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.28);
      font-size: 11.5px; color: var(--t2); font-variant-numeric: tabular-nums;
    }
    .cb-tag strong { color: var(--text); font-weight: 800; }
    .cb-conv-pill {
      text-align: center; padding: 10px 14px;
      background: linear-gradient(135deg, rgba(16,185,129,0.10), rgba(16,185,129,0.02));
      border: 1px solid rgba(16,185,129,0.30); border-radius: 12px;
      font-size: 12.5px; color: var(--t2); font-weight: 700;
    }
    .cb-conv-pill strong { color: #10b981; font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

    /* Recolor the existing A/B summary chips: A=red, B=blue */
    .kpi-summary[data-tf="A"] {
      background: linear-gradient(135deg, rgba(244,63,94,0.10), rgba(244,63,94,0.02));
      border: 1px solid rgba(244,63,94,0.32);
    }
    .kpi-summary[data-tf="B"] {
      background: linear-gradient(135deg, rgba(59,130,246,0.10), rgba(59,130,246,0.02));
      border: 1px solid rgba(59,130,246,0.32);
    }
    .kpi-summary[data-tf="A"] > span:first-child {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px;
      background: rgba(244,63,94,0.20); color: #f43f5e;
    }
    .kpi-summary[data-tf="B"] > span:first-child {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px;
      background: rgba(59,130,246,0.20); color: #3b82f6;
    }

    /* Sticky period-picker summaries — stay pinned while scrolling */
    .kpi-sticky-summary {
      position: sticky; z-index: 30;
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
    }
    #kpiPanelA > .kpi-sticky-summary { top: 0; }
    #kpiPanelB > .kpi-sticky-summary { top: 56px; }   /* sits just below A */

    /* Swap button: only relevant in compare mode */
    .kpi-side-btn.swap { display: none; }
    .kpi-wrap.is-compare .kpi-side-btn.swap { display: flex; }
    @media (max-width: 720px) {
      .kpi-wrap.is-compare .kpi-side-btn.swap { display: flex; }
    }

    .source-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .source-card  { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 12px; padding: 16px 18px; }
    .source-card.winner { border-color: rgba(16,185,129,0.4); background: linear-gradient(135deg, rgba(16,185,129,0.10), rgba(16,185,129,0.02)); }
    .source-card-head   { font-size: 12px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--t2); }
    .source-card-head .crown { color: #fbbf24; }
    .source-card-stats  { display: flex; gap: 22px; margin: 10px 0 8px; }
    .source-card-stat   { display: flex; flex-direction: column; gap: 1px; }
    .source-card-stat-val { font-size: 18px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .source-card-stat-lbl { font-size: 10px; font-weight: 700; color: var(--t3); letter-spacing: 0.04em; text-transform: uppercase; }
    .source-card-pct { font-size: 28px; font-weight: 900; letter-spacing: -0.03em; }
    .source-card.winner .source-card-pct { color: #10b981; }
    .source-card:not(.winner) .source-card-pct { color: var(--t2); }

    .dropoff-bars { display: flex; flex-direction: column; gap: 6px; }
    .dropoff-bar-row {
      display: grid; grid-template-columns: 160px 1fr auto; gap: 10px; align-items: center;
      font-size: 12px; padding: 4px 0;
    }
    .dropoff-bar-name { color: var(--t2); font-weight: 600; }
    .dropoff-bar-track { background: rgba(255,255,255,0.04); border-radius: 100px; height: 14px; overflow: hidden; }
    .dropoff-bar-fill  { height: 100%; background: linear-gradient(90deg, #ef4444, #f87171); border-radius: 100px; min-width: 4px; transition: width 0.3s; }
    .dropoff-bar-count { font-size: 12px; font-weight: 800; color: var(--text); min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    .dropoff-section-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--t3); margin: 12px 0 6px; }
    .dropoff-section-label:first-child { margin-top: 0; }

    /* KPI compare panels */

    }
